  <!-- Action sheet over same Today composition -->
  <g transform="translate(555 125)">
    <rect width="430" height="735" rx="38" fill="#fffaf7" stroke="#ded1c8" stroke-width="2"/>
    <text x="26" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="760" fill="#231e28">Us</text>
    <g opacity=".28">
      <rect x="26" y="88" width="378" height="194" rx="28" fill="#fff" stroke="#eadfd8"/>
      <circle cx="191" cy="151" r="45" fill="#f5cabb"/>
      <circle cx="241" cy="151" r="45" fill="#d8c5e7"/>
      <text x="216" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="760" fill="#231e28">Philipp &amp; Lea</text>
      <rect x="26" y="320" width="378" height="82" rx="22" fill="#f8f1ee"/>
      <rect x="26" y="434" width="378" height="82" rx="22" fill="#fff4ef"/>
      <rect x="26" y="548" width="378" height="116" rx="22" fill="#fff" stroke="#eadfd8"/>
    </g>
    <rect width="430" height="735" rx="38" fill="#231e28" opacity=".16"/>
    <path d="M0 350Q0 320 30 320H400Q430 320 430 350V735H0Z" fill="#fff"/>
