  <text x="80" y="132" fill="#211A2B" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600">One product, seven connected workstreams</text>
  <text x="80" y="166" fill="#51485C" font-family="Inter, Arial, sans-serif" font-size="18">Work in parallel, but pass release gates together.</text>

