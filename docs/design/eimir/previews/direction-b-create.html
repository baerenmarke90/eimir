<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direction B: Memory Create (Immersive Creation Canvas)</title>
  <link rel="stylesheet" href="/web/src/styles.css">
  <link rel="stylesheet" href="/web/src/theme.css">
  <link rel="stylesheet" href="/web/src/shell.css">
  <link rel="stylesheet" href="/web/src/layout.css">
  <link rel="stylesheet" href="/web/src/components/VisibilityBadge.css">
  <link rel="stylesheet" href="./shared-preview.css">
</head>
<body>
  <header class="mock-header">
    <div style="display:flex; align-items:center; gap:var(--space-6);">
      <a href="#" class="mock-logo">eimir<span class="brand-dot">.</span></a>
      <nav class="mock-nav">
        <a href="#" class="mock-nav-item">Wir</a>
        <a href="#" class="mock-nav-item active">Momente</a>
        <a href="#" class="mock-nav-item">Planen</a>
        <a href="#" class="mock-nav-item">Mehr</a>
      </nav>
    </div>
    <div class="mock-user-profile">
      <div class="mock-avatar-chip" title="Philipp">P</div>
    </div>
  </header>

  <main class="preview-container">
    <div class="sanctuary-create-card">
      <div class="sanctuary-create-header">
        <span style="font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--color-brand); margin-bottom:var(--space-1); display:inline-block;">Unser Archiv</span>
        <h1 class="sanctuary-create-title">Einen gemeinsamen Moment festhalten</h1>
        <p class="sanctuary-create-sub">Halte fest, was euch heute berührt hat — für jetzt und für später.</p>

        <!-- Privacy Selection at top for immediate psychological safety -->
        <div class="sanctuary-privacy-pill-selector">
          <button type="button" class="privacy-pill-option selected">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/></svg>
            <span>Mit Lea geteilt</span>
          </button>
          <button type="button" class="privacy-pill-option">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Nur für mich</span>
          </button>
        </div>
      </div>

      <form style="display:flex; flex-direction:column; gap:var(--space-6);">
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--color-text-secondary); margin-bottom:var(--space-1);">Überschrift</label>
          <input type="text" value="Spätsommertage am See" style="width:100%; border:none; border-bottom:2px solid var(--color-border); font-family:var(--font-display); font-size:1.45rem; font-weight:700; color:var(--color-text); padding:var(--space-2) 0; background:transparent; outline:none;" placeholder="Wie wollt ihr diesen Moment nennen?">
        </div>

        <div>
          <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--color-text-secondary); margin-bottom:var(--space-2);">Eure Geschichte</label>
          <textarea rows="4" style="width:100%; border:1px solid var(--color-border-subtle); border-radius:var(--radius-large); padding:var(--space-4); font-family:inherit; font-size:1.05rem; line-height:1.6; color:var(--color-text); background:var(--color-surface-subtle); outline:none; resize:vertical;">Die Blätter färben sich langsam gold. Wir haben heißen Apfeltee mitgenommen, uns auf den Holzsteg gesetzt und einfach nur dem Wasser gelauscht.</textarea>
        </div>

        <!-- Keepsake Photo Attachment Area -->
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--color-text-secondary); margin-bottom:var(--space-2);">Fotografien</label>
          <div style="display:flex; gap:var(--space-4); align-items:center;">
            <div style="position:relative; width:110px; height:85px; border-radius:var(--radius-medium); overflow:hidden; box-shadow:0 4px 12px var(--color-shadow-soft);">
              <img src="./assets/cabin-lake.jpg" alt="Vorschau" style="width:100%; height:100%; object-fit:cover;">
              <button type="button" style="position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,0.6); color:white; border:none; font-size:12px; cursor:pointer; display:grid; place-items:center;">✕</button>
            </div>
            <div style="flex:1; height:85px; border:1.5px dashed var(--color-brand); border-radius:var(--radius-medium); background:var(--color-brand-surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; color:var(--color-brand-strong);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              <span style="font-size:0.85rem; font-weight:600;">Weiteres Foto hinzufügen</span>
            </div>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:var(--space-4); padding-top:var(--space-5); border-top:1px solid var(--color-border-subtle);">
          <div style="display:flex; align-items:center; gap:var(--space-2); font-size:0.9rem; color:var(--color-text-secondary);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>7. September 2026</span>
          </div>

          <div style="display:flex; gap:var(--space-3);">
            <button type="button" style="padding:0.65rem 1.25rem; border-radius:var(--radius-pill); border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text-secondary); font-weight:600; cursor:pointer;">Abbrechen</button>
            <button type="button" style="display:inline-flex; align-items:center; gap:8px; padding:0.75rem 1.6rem; border-radius:var(--radius-pill); border:none; background:var(--color-brand); color:white; font-weight:700; cursor:pointer; box-shadow:0 4px 18px var(--color-brand-glow);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <span>Im gemeinsamen Ort bewahren</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
