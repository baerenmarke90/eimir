      <circle cx="355" cy="24" r="20" fill="#fff" stroke="#ded1c8"/>
      <path d="M348 20a7 7 0 0 1 14 0v7l3 4h-20l3-4z" fill="none" stroke="#5e5466" stroke-width="1.7"/>
      <circle cx="365" cy="12" r="5" fill="#d93d59"/>

      <!-- Hero -->
      <g transform="translate(0 78)">
        <rect width="378" height="194" rx="28" fill="#fff" stroke="#eadfd8"/>
        <g transform="translate(111 24)">
          <circle cx="55" cy="48" r="45" fill="#ecd8cf"/>
          <circle cx="105" cy="48" r="45" fill="#dcd1e8"/>
          <circle cx="55" cy="48" r="41" fill="#f5cabb"/>
          <text x="55" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#5f3b46">P</text>
          <circle cx="105" cy="48" r="41" fill="#d8c5e7"/>
          <text x="105" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#4e3b62">L</text>
          <circle cx="141" cy="78" r="8" fill="#207266" stroke="#fff" stroke-width="3"/>
        </g>
        <text x="189" y="132" text-anchor="middle" font-size="23" font-weight="760" fill="#231e28">Philipp &amp; Lea</text>
        <text x="189" y="158" text-anchor="middle" font-size="14" font-weight="650" fill="#d93d59">Together for 4 years, 7 months</text>
        <text x="189" y="180" text-anchor="middle" font-size="12.5" fill="#776c7e">Tap the pair for partner actions</text>
      </g>

      <!-- Vibe -->
      <g transform="translate(0 292)">
        <text x="0" y="16" font-size="13" font-weight="750" fill="#776c7e">HOW ARE YOU BOTH TODAY?</text>
        <rect y="30" width="378" height="82" rx="22" fill="#f8f1ee"/>
        <circle cx="36" cy="71" r="18" fill="#fff"/>
        <text x="36" y="77" text-anchor="middle" font-size="18">♡</text>
        <text x="68" y="65" font-size="16" font-weight="700" fill="#231e28">Your vibe</text>
        <text x="68" y="87" font-size="13" fill="#776c7e">How do you feel today?</text>
        <text x="329" y="78" font-size="14" font-weight="700" fill="#d93d59">Open</text>
      </g>

      <!-- Quote -->
      <g transform="translate(0 425)">
        <text x="0" y="16" font-size="13" font-weight="750" fill="#776c7e">QUOTE OF THE DAY</text>
        <rect y="30" width="378" height="82" rx="22" fill="#fff4ef"/>
        <text x="22" y="63" font-size="15" font-family="Georgia, serif" font-style="italic" fill="#493e50">“Together, everyday life becomes a story.”</text>
        <text x="22" y="88" font-size="12.5" fill="#776c7e">Curated daily quote · Pro</text>
      </g>

