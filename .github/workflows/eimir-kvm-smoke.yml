name: eimir-dev isolated runner smoke test

on:
  push:
    branches: ["ci/eimir-kvm-smoke-20261120"]
    paths: [".github/workflows/eimir-kvm-smoke.yml"]

permissions: {}

jobs:
  containers:
    name: Node job and PostgreSQL service
    runs-on: [self-hosted, Linux, X64, eimir-kvm-smoke]
    timeout-minutes: 15
    permissions:
      contents: read
    container: node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eimir
          POSTGRES_PASSWORD: smoke-test-only
          POSTGRES_DB: eimir_test
        options: >-
          --health-cmd "pg_isready -U eimir -d eimir_test"
          --health-interval 2s
          --health-timeout 4s
          --health-retries 20
    steps:
      - name: Verify Node container and PostgreSQL service
        shell: sh
        run: |
          node --version
          node --input-type=module <<'JS'
          import { createConnection } from 'node:net';
          const connection = createConnection({ host: 'postgres', port: 5432 });
          connection.setTimeout(5000);
          connection.on('timeout', () => connection.destroy(new Error('PostgreSQL connection timed out')));
          connection.on('connect', () => {
            console.log('PostgreSQL service is reachable from the job container');
            connection.end();
          });
          JS
      - name: Check out eimir
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install locked Web and browser dependencies
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web/e2e ci --ignore-scripts --no-audit --no-fund
      - name: Run a Web unit-test file
        run: npm --prefix web test -- src/client/config.test.ts --maxWorkers=1
      - name: Install Playwright Chromium and system dependencies
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run the browser reload test
        working-directory: web/e2e
        run: >-
          ./node_modules/.bin/playwright test browser-session-reload.spec.ts
          --grep 'restores deep protected route' --workers=1 --retries=0
