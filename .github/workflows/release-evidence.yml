name: Release Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/release-evidence.yml"
      - ".github/actions/attest-release-artifact/**"
      - "android/**"
      - "web/capacitor.config.ts"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/scripts/build-capacitor-web.mjs"
      - "tools/ci/test_release_evidence.py"
      - "docs/m6/SBOM-ATTESTATIONS.md"
  workflow_dispatch:
    inputs:
      android_version_code:
        description: Monotonic Android versionCode for this evidence build.
        required: true
        type: number
      android_api_base_url:
        description: Backend API base URL baked into the Capacitor Android release assets (must start with https://).
        required: true
        type: string
      release_version:
        description: SemVer product version without the v prefix; must equal Android versionName.
        required: true
        type: string
  workflow_call:
    inputs:
      android_version_code:
        description: Monotonic Android versionCode for this evidence build.
        required: true
        type: number
      android_api_base_url:
        description: Backend API base URL baked into the Capacitor Android release assets (must start with https://).
        required: true
        type: string
      release_version:
        description: SemVer product version without the v prefix; must equal Android versionName.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "1.42.3"
  SYFT_LINUX_AMD64_SHA256: "0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509"
  ANDROID_PROJECT_DIR: "android"
  ANDROID_VERSION_CODE: ${{ inputs.android_version_code || (github.event_name == 'pull_request' && 1 || '') }}
  ANDROID_API_BASE_URL: ${{ inputs.android_api_base_url || (github.event_name == 'pull_request' && 'https://api.eimir.invalid' || '') }}
  RELEASE_VERSION: ${{ inputs.release_version || (github.event_name == 'pull_request' && '0.1.0' || '') }}

jobs:
  build-evidence:
    name: Build artifacts and SPDX SBOMs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release-evidence contract
        run: python3 tools/ci/test_release_evidence.py

      - name: Validate release inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          API_BASE_URL: ${{ env.ANDROID_API_BASE_URL }}
          VERSION_NAME: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import urllib.parse

          event_name = os.environ.get("EVENT_NAME", "")
          raw_url = os.environ.get("API_BASE_URL", "").strip()
          raw_version = os.environ.get("VERSION_NAME", "").strip()

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", raw_version):
              raise SystemExit(f"Invalid release_version format: {raw_version}")

          if re.search(r"\s", raw_url):
              raise SystemExit("android_api_base_url must not contain whitespace")
          parsed = urllib.parse.urlsplit(raw_url)
          if parsed.scheme != "https":
              raise SystemExit("android_api_base_url must use https scheme")
          if not parsed.netloc:
              raise SystemExit("android_api_base_url must include host")
          if parsed.username or parsed.password:
              raise SystemExit("android_api_base_url must not contain userinfo")
          if parsed.query or parsed.fragment:
              raise SystemExit("android_api_base_url must not contain query or fragment")

          canonical_url = raw_url.rstrip("/")
          if event_name != "pull_request":
              if canonical_url == "https://api.eimir.invalid" or ".invalid" in parsed.netloc:
                  raise SystemExit("Non-pull_request release runs must provide an explicit, non-test android_api_base_url")
          print(f"Validated release inputs: version={raw_version}, api_base_url={canonical_url}")
          PY

      - name: Create evidence directories
        run: mkdir -p release-evidence/android release-evidence/sbom

      - name: Build backend runtime image archive
        run: |
          set -euo pipefail
          image="eimir-backend:evidence-$GITHUB_SHA"
          docker build \
            --pull \
            --no-cache \
            --build-arg "EIMIR_BUILD_REVISION=$GITHUB_SHA" \
            --tag "$image" \
            ./backend
          docker image save --output release-evidence/backend-runtime.image.tar "$image"

      - name: Build Web runtime image archive
        run: |
          set -euo pipefail
          image="eimir-web:evidence-$GITHUB_SHA"
          docker build \
            --pull \
            --no-cache \
            --build-arg "EIMIR_BUILD_REVISION=$GITHUB_SHA" \
            --tag "$image" \
            ./web
          docker image save --output release-evidence/web-runtime.image.tar "$image"

      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.21.0"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify pinned Gradle wrapper JAR
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        run: |
          printf '%s  %s\n' \
            '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172' \
            'gradle/wrapper/gradle-wrapper.jar' \
            | sha256sum --check --strict -

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Build and sync Capacitor web bundle
        working-directory: web
        env:
          ANDROID_API_BASE_URL: ${{ env.ANDROID_API_BASE_URL }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          VITE_EIMIR_API_BASE_URL="$ANDROID_API_BASE_URL" npm run cap:build:web
          npm run cap:sync

      - name: Verify generated native wrapper files have not drifted
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            android/capacitor.settings.gradle \
            android/app/capacitor.build.gradle

      - name: Build unsigned Android release artifacts
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --dependency-verification strict \
            -PeimirVersionCode="$ANDROID_VERSION_CODE" \
            -PeimirVersionName="$RELEASE_VERSION" \
            :app:assembleRelease :app:bundleRelease

          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          aab=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)
          test -n "$apk"
          test -n "$aab"
          test -s "$apk"
          test -s "$aab"
          cp -- "$apk" ../release-evidence/android/eimir-release-unsigned.apk
          cp -- "$aab" ../release-evidence/android/eimir-release-unsigned.aab

      - name: Verify APK and AAB packaging and runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          apk_path = Path("release-evidence/android/eimir-release-unsigned.apk")
          aab_path = Path("release-evidence/android/eimir-release-unsigned.aab")

          def inspect_archive(archive_path: Path, prefix: str) -> None:
              with zipfile.ZipFile(archive_path, "r") as z:
                  names = set(z.namelist())
                  index_html_path = f"{prefix}public/index.html"
                  config_path = f"{prefix}capacitor.config.json"
                  if index_html_path not in names:
                      raise SystemExit(f"Missing {index_html_path} in {archive_path.name}")
                  if config_path not in names:
                      raise SystemExit(f"Missing {config_path} in {archive_path.name}")
                  config_data = json.loads(z.read(config_path).decode("utf-8"))
                  server = config_data.get("server", {})
                  if "url" in server:
                      raise SystemExit(f"Forbidden remote server.url in {config_path} of {archive_path.name}")
                  if "allowNavigation" in server:
                      raise SystemExit(f"Forbidden allowNavigation in {config_path} of {archive_path.name}")
                  cap_http = config_data.get("plugins", {}).get("CapacitorHttp", {})
                  if cap_http.get("enabled") is not True:
                      raise SystemExit(f"CapacitorHttp plugin must be enabled in {config_path} of {archive_path.name}")

          inspect_archive(apk_path, "assets/")
          inspect_archive(aab_path, "base/assets/")
          print("Verified offline web bundle, server.url absence, and CapacitorHttp configuration in APK and AAB.")
          PY

      - name: Verify APK badging
        shell: bash
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$aapt"
          badging=$("$aapt" dump badging release-evidence/android/eimir-release-unsigned.apk)
          echo "$badging" | grep -q "package: name='de.sidebyside.app'"
          echo "$badging" | grep -q "versionCode='${ANDROID_VERSION_CODE}'"
          echo "$badging" | grep -q "versionName='${RELEASE_VERSION}'"
          echo "$badging" | grep -q "launchable-activity: name='de.eimir.app.MainActivity'"

      - name: Install verified Syft release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/syft"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SYFT_LINUX_AMD64_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" syft
          "$install_dir/syft" version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Generate SPDX 2.3 JSON SBOMs
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          syft scan "docker-archive:release-evidence/backend-runtime.image.tar" \
            -o "spdx-json=release-evidence/sbom/backend-runtime.spdx.json"
          syft scan "docker-archive:release-evidence/web-runtime.image.tar" \
            -o "spdx-json=release-evidence/sbom/web-runtime.spdx.json"
          syft scan "file:release-evidence/android/eimir-release-unsigned.apk" \
            -o "spdx-json=release-evidence/sbom/android-apk.spdx.json"
          syft scan "file:release-evidence/android/eimir-release-unsigned.aab" \
            -o "spdx-json=release-evidence/sbom/android-aab.spdx.json"

      - name: Validate and index release evidence
        env:
          SOURCE_REVISION: ${{ github.sha }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          ANDROID_API_BASE_URL: ${{ env.ANDROID_API_BASE_URL }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          root = Path("release-evidence")
          subjects = [
              ("backend-runtime", root / "backend-runtime.image.tar", root / "sbom/backend-runtime.spdx.json", ["api", "worker", "migrate"]),
              ("web-runtime", root / "web-runtime.image.tar", root / "sbom/web-runtime.spdx.json", ["web"]),
              ("android-apk", root / "android/eimir-release-unsigned.apk", root / "sbom/android-apk.spdx.json", ["android-apk"]),
              ("android-aab", root / "android/eimir-release-unsigned.aab", root / "sbom/android-aab.spdx.json", ["android-aab"]),
          ]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          artifacts = []
          for artifact_id, artifact, sbom, roles in subjects:
              if not artifact.is_file() or artifact.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty release subject: {artifact}")
              if not sbom.is_file() or sbom.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty SBOM: {sbom}")
              document = json.loads(sbom.read_text(encoding="utf-8"))
              if document.get("spdxVersion") != "SPDX-2.3":
                  raise SystemExit(f"{sbom} is not SPDX 2.3")
              if document.get("SPDXID") != "SPDXRef-DOCUMENT":
                  raise SystemExit(f"{sbom} has no SPDX document identity")
              if not isinstance(document.get("packages"), list):
                  raise SystemExit(f"{sbom} has no SPDX package list")
              artifacts.append(
                  {
                      "id": artifact_id,
                      "roles": roles,
                      "path": artifact.relative_to(root).as_posix(),
                      "sha256": sha256(artifact),
                      "sbom": sbom.relative_to(root).as_posix(),
                      "sbomSha256": sha256(sbom),
                  }
              )

          aapt_bin = Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0/aapt"
          if not aapt_bin.is_file():
              raise SystemExit(f"aapt binary not found at {aapt_bin}")
          apk_path = root / "android/eimir-release-unsigned.apk"
          badging = subprocess.check_output([str(aapt_bin), "dump", "badging", str(apk_path)], text=True)
          pkg_match = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          act_match = re.search(r"launchable-activity: name='([^']+)'", badging)
          if not pkg_match or not act_match:
              raise SystemExit("Could not resolve Android release identity from aapt badging")
          app_id, version_code_str, version_name = pkg_match.group(1), pkg_match.group(2), pkg_match.group(3)
          launchable_activity = act_match.group(1)

          if app_id != "de.sidebyside.app":
              raise SystemExit(f"Unexpected Android applicationId: {app_id}")
          if version_code_str != str(os.environ["ANDROID_VERSION_CODE"]):
              raise SystemExit(f"Android versionCode mismatch: {version_code_str} != {os.environ['ANDROID_VERSION_CODE']}")
          if version_name != os.environ["RELEASE_VERSION"]:
              raise SystemExit(f"Android versionName mismatch: {version_name} != {os.environ['RELEASE_VERSION']}")
          if launchable_activity != "de.eimir.app.MainActivity":
              raise SystemExit(f"Unexpected Android launchableActivity: {launchable_activity}")

          raw_api_url = os.environ["ANDROID_API_BASE_URL"].strip().rstrip("/")
          index = {
              "schemaVersion": 1,
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "sbomFormat": "SPDX-2.3 JSON",
              "artifacts": artifacts,
              "android": {
                  "applicationId": app_id,
                  "versionName": version_name,
                  "versionCode": int(version_code_str),
                  "launchableActivity": launchable_activity,
                  "apiBaseUrl": raw_api_url,
                  "signing": "unsigned-evidence-only",
                  "finalSignedArtifactRequiresFreshAttestation": True,
              },
          }
          (root / "evidence-index.json").write_text(
              json.dumps(index, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          (
            cd release-evidence
            sha256sum \
              backend-runtime.image.tar \
              web-runtime.image.tar \
              android/eimir-release-unsigned.apk \
              android/eimir-release-unsigned.aab \
              sbom/backend-runtime.spdx.json \
              sbom/web-runtime.spdx.json \
              sbom/android-apk.spdx.json \
              sbom/android-aab.spdx.json \
              evidence-index.json \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload release-evidence set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  attest:
    name: Attest exact artifact bytes
    if: github.event_name != 'pull_request'
    needs: build-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout attestation primitive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact evidence set
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence

      - name: Verify transported checksums
        run: (cd release-evidence && sha256sum --check --strict SHA256SUMS)

      - name: Attest backend runtime
        uses: ./.github/actions/attest-release-artifact
        with:
          subject-path: release-evidence/backend-runtime.image.tar
          sbom-path: release-evidence/sbom/backend-runtime.spdx.json
          bundle-directory: release-evidence/attestations
          bundle-prefix: backend-runtime

      - name: Attest Web runtime
        uses: ./.github/actions/attest-release-artifact
        with:
          subject-path: release-evidence/web-runtime.image.tar
          sbom-path: release-evidence/sbom/web-runtime.spdx.json
          bundle-directory: release-evidence/attestations
          bundle-prefix: web-runtime

      - name: Attest Android APK
        uses: ./.github/actions/attest-release-artifact
        with:
          subject-path: release-evidence/android/eimir-release-unsigned.apk
          sbom-path: release-evidence/sbom/android-apk.spdx.json
          bundle-directory: release-evidence/attestations
          bundle-prefix: android-apk

      - name: Attest Android AAB
        uses: ./.github/actions/attest-release-artifact
        with:
          subject-path: release-evidence/android/eimir-release-unsigned.aab
          sbom-path: release-evidence/sbom/android-aab.spdx.json
          bundle-directory: release-evidence/attestations
          bundle-prefix: android-aab

      - name: Capture current trusted roots
        run: gh attestation trusted-root > release-evidence/attestations/trusted_root.jsonl

      - name: Verify retained attestations offline
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          signer="$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml"
          root="release-evidence/attestations/trusted_root.jsonl"

          verify_subject() {
            local subject="$1"
            local prefix="$2"
            gh attestation verify "$subject" -R "$repo" \
              --bundle "release-evidence/attestations/${prefix}-provenance.json" \
              --custom-trusted-root "$root" \
              --signer-workflow "$signer"
            gh attestation verify "$subject" -R "$repo" \
              --bundle "release-evidence/attestations/${prefix}-sbom.json" \
              --custom-trusted-root "$root" \
              --signer-workflow "$signer" \
              --predicate-type "https://spdx.dev/Document/v2.3"
          }

          verify_subject release-evidence/backend-runtime.image.tar backend-runtime
          verify_subject release-evidence/web-runtime.image.tar web-runtime
          verify_subject release-evidence/android/eimir-release-unsigned.apk android-apk
          verify_subject release-evidence/android/eimir-release-unsigned.aab android-aab

      - name: Upload offline-verification bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-attestations-${{ github.sha }}
          path: release-evidence/attestations/
          if-no-files-found: error
          retention-days: 7
