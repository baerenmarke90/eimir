    <text x="28" y="390" font-family="system-ui, sans-serif" font-size="23" font-weight="760" fill="#231e28">For Lea</text>
    <text x="28" y="414" font-family="system-ui, sans-serif" font-size="13.5" fill="#776c7e">Small gestures directly to your partner.</text>

    <g transform="translate(28 443)" font-family="system-ui, sans-serif">
      <rect width="374" height="64" rx="18" fill="#fff" stroke="#eadfd8"/>
      <circle cx="30" cy="32" r="19" fill="#fff0f2"/>
      <text x="30" y="39" text-anchor="middle" font-size="21" fill="#d93d59">♥</text>
      <text x="62" y="28" font-size="16.5" font-weight="720" fill="#231e28">Thinking of you</text>
      <text x="62" y="48" font-size="12.5" fill="#776c7e">Free · existing 30 min cooldown</text>

      <g transform="translate(0 76)">
        <rect width="374" height="64" rx="18" fill="#fff" stroke="#eadfd8"/>
        <circle cx="30" cy="32" r="19" fill="#fff4ef"/>
        <text x="30" y="39" text-anchor="middle" font-size="20">♡</text>
        <text x="62" y="28" font-size="16.5" font-weight="720" fill="#231e28">Send a kiss</text>
        <text x="62" y="48" font-size="12.5" fill="#776c7e">Short affectionate gesture</text>
        <rect x="305" y="18" width="54" height="26" rx="13" fill="#f1e8f6"/>
        <text x="332" y="36" text-anchor="middle" font-size="11.5" font-weight="750" fill="#684b79">PRO</text>
      </g>

      <g transform="translate(0 152)">
        <rect width="374" height="64" rx="18" fill="#fff" stroke="#eadfd8"/>
        <circle cx="30" cy="32" r="19" fill="#edf7f5"/>
        <text x="30" y="39" text-anchor="middle" font-size="19" fill="#207266">?</text>
        <text x="62" y="28" font-size="16.5" font-weight="720" fill="#231e28">How are you?</text>
        <text x="62" y="48" font-size="12.5" fill="#776c7e">Gentle check-in · no vibe is revealed</text>
        <rect x="305" y="18" width="54" height="26" rx="13" fill="#f1e8f6"/>
        <text x="332" y="36" text-anchor="middle" font-size="11.5" font-weight="750" fill="#684b79">PRO</text>
      </g>
    </g>
  </g>

  <!-- Expanded adaptation -->
  <g transform="translate(1035 150)" font-family="system-ui, sans-serif">
    <text x="0" y="0" font-size="16" font-weight="750" fill="#231e28">Expanded adaptation</text>
    <text x="0" y="28" font-size="14" fill="#776c7e">Same trigger, same action order, non-modal popover.</text>
    <rect x="0" y="55" width="300" height="260" rx="24" fill="#fff" stroke="#ded1c8" stroke-width="2"/>
    <text x="22" y="90" font-size="18" font-weight="760" fill="#231e28">For Lea</text>
    <g transform="translate(20 110)">
      <rect width="260" height="46" rx="14" fill="#fff8f5"/>
      <text x="16" y="29" font-size="14.5" font-weight="680" fill="#231e28">♥  Thinking of you</text>
      <rect y="56" width="260" height="46" rx="14" fill="#fff8f5"/>
      <text x="16" y="85" font-size="14.5" font-weight="680" fill="#231e28">♡  Send a kiss</text>
      <text x="218" y="85" font-size="10.5" font-weight="750" fill="#684b79">PRO</text>
      <rect y="112" width="260" height="46" rx="14" fill="#fff8f5"/>
      <text x="16" y="141" font-size="14.5" font-weight="680" fill="#231e28">?  How are you?</text>
      <text x="218" y="141" font-size="10.5" font-weight="750" fill="#684b79">PRO</text>
    </g>
    <text x="0" y="354" font-size="13" fill="#5e5466">Decision: omit “hug” in v1; it duplicates the</text>
    <text x="0" y="374" font-size="13" fill="#5e5466">same affectionate intent as “kiss” without adding</text>
    <text x="0" y="394" font-size="13" fill="#5e5466">a distinct task. Keep the set deliberately small.</text>

    <text x="0" y="450" font-size="14" font-weight="750" fill="#231e28">Acceptance intent</text>
    <text x="0" y="476" font-size="12.5" fill="#5e5466">• larger overlapping avatars; no overlap halo</text>
    <text x="0" y="498" font-size="12.5" fill="#5e5466">• names → duration below the pair</text>
    <text x="0" y="520" font-size="12.5" fill="#5e5466">• whole pair is one discoverable 44px+ trigger</text>
    <text x="0" y="542" font-size="12.5" fill="#5e5466">• Compact sheet / Expanded popover</text>
    <text x="0" y="564" font-size="12.5" fill="#5e5466">• no old standalone Thinking-of-you module</text>
    <text x="0" y="586" font-size="12.5" fill="#5e5466">• Today neighbors remain in current order</text>
  </g>
</svg>