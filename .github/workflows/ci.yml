name: Runner test-channel image benchmark
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  image-benchmark:
    name: Build and push test-channel benchmark images
    runs-on:
    - eimir-kvm-nightly
    - eimir-run-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    env:
      SOURCE_SHA: dec9af90657acbfede2844942ddeb941f46517ca
      RELEASE_VERSION: 0.0.0-test.${{ github.run_id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: dec9af90657acbfede2844942ddeb941f46517ca
        persist-credentials: false
    - name: Create evidence directories
      run: mkdir -p release-evidence
    - name: Verify the test-channel attestation CLI
      run: 'gh --version

        gh attestation trusted-root --help >/dev/null'
    - name: Verify BuildKit is available
      run: docker buildx version
    - name: Start build timing summary
      run: 'printf "| Image | Build and archive seconds |\n| --- | ---: |\n" >> "$GITHUB_STEP_SUMMARY"'
    - name: Build and archive backend image
      run: "export GITHUB_SHA=\"$SOURCE_SHA\"\nstarted=$SECONDS\nset -euo pipefail\n\
        image=\"eimir-backend:evidence-$GITHUB_SHA\"\ndocker build \\\n  --pull \\\
        \n  --no-cache \\\n  --build-arg \"EIMIR_BUILD_REVISION=$GITHUB_SHA\" \\\n\
        \  --label \"org.opencontainers.image.title=eimir backend runtime\" \\\n \
        \ --label \"org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY\"\
        \ \\\n  --label \"org.opencontainers.image.revision=$GITHUB_SHA\" \\\n  --label\
        \ \"org.opencontainers.image.version=$RELEASE_VERSION\" \\\n  --tag \"$image\"\
        \ \\\n  ./backend\ndocker image save --output release-evidence/backend-runtime.image.tar\
        \ \"$image\"\nprintf '| backend | %s |\\n' \"$((SECONDS - started))\" >> \"\
        $GITHUB_STEP_SUMMARY\"\ndf -h \"$GITHUB_WORKSPACE\"\n"
    - name: Build and archive media image
      run: "export GITHUB_SHA=\"$SOURCE_SHA\"\nstarted=$SECONDS\nset -euo pipefail\n\
        python3 tools/media/check-advisories.py\nimage=\"eimir-media:evidence-$GITHUB_SHA\"\
        \ndocker build --file backend/Dockerfile.media \\\n  --build-arg \"EIMIR_BACKEND_IMAGE=eimir-backend:evidence-$GITHUB_SHA\"\
        \ \\\n  --label \"org.opencontainers.image.title=eimir restricted video worker\"\
        \ \\\n  --label \"org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY\"\
        \ \\\n  --label \"org.opencontainers.image.revision=$GITHUB_SHA\" \\\n  --label\
        \ \"org.opencontainers.image.version=$RELEASE_VERSION\" \\\n  --tag \"$image\"\
        \ .\ndocker image save --output release-evidence/media-runtime.image.tar \"\
        $image\"\nprintf '| media | %s |\\n' \"$((SECONDS - started))\" >> \"$GITHUB_STEP_SUMMARY\"\
        \ndf -h \"$GITHUB_WORKSPACE\"\n"
    - name: Build and archive web image
      run: "export GITHUB_SHA=\"$SOURCE_SHA\"\nstarted=$SECONDS\nset -euo pipefail\n\
        image=\"eimir-web:evidence-$GITHUB_SHA\"\ndocker build \\\n  --pull \\\n \
        \ --no-cache \\\n  --build-arg \"EIMIR_BUILD_REVISION=$GITHUB_SHA\" \\\n \
        \ --label \"org.opencontainers.image.title=eimir web runtime\" \\\n  --label\
        \ \"org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY\"\
        \ \\\n  --label \"org.opencontainers.image.revision=$GITHUB_SHA\" \\\n  --label\
        \ \"org.opencontainers.image.version=$RELEASE_VERSION\" \\\n  --tag \"$image\"\
        \ \\\n  ./web\ndocker image save --output release-evidence/web-runtime.image.tar\
        \ \"$image\"\nprintf '| web | %s |\\n' \"$((SECONDS - started))\" >> \"$GITHUB_STEP_SUMMARY\"\
        \ndf -h \"$GITHUB_WORKSPACE\"\n"
    - name: Push benchmark tags to GHCR
      env:
        REGISTRY_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nexport DOCKER_CONFIG=$(mktemp -d)\ntrap 'docker logout\
        \ ghcr.io >/dev/null; rm -rf -- \"$DOCKER_CONFIG\"' EXIT\nprintf '%s' \"$REGISTRY_TOKEN\"\
        \ | docker login ghcr.io -u \"$GITHUB_ACTOR\" --password-stdin\nowner=${GITHUB_REPOSITORY_OWNER,,}\n\
        printf '\\n| Image | Registry push seconds | Benchmark tag |\\n| --- | ---:\
        \ | --- |\\n' >> \"$GITHUB_STEP_SUMMARY\"\nfor image in backend web media;\
        \ do\n    docker load --input \"release-evidence/${image}-runtime.image.tar\"\
        \n    benchmark=\"ghcr.io/${owner}/eimir-${image}:runner-benchmark-${GITHUB_RUN_ID}\"\
        \n    docker tag \"eimir-${image}:evidence-${SOURCE_SHA}\" \"$benchmark\"\n\
        \    started=$SECONDS\n    docker push --platform linux/amd64 \"$benchmark\"\
        \n    printf '| %s | %s | `%s` |\\n' \"$image\" \"$((SECONDS - started))\"\
        \ \"$benchmark\" >> \"$GITHUB_STEP_SUMMARY\"\ndone\n"
