      "healthcheck": {
        "interval": "30s",
        "retries": 3,
        "start_period": "10s",
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health/ready\")"
        ],
        "timeout": "5s"
      },
      "image": "ghcr.io/baerenmarke90/eimir-cloud-backend@sha256:16e591c671075c500976a59a15ef0cfabeac3eac33ba5b7259085340dfa05396",
      "networks": {
        "app": {
          "aliases": [
            "api"
          ]
        },
        "proxy": {
          "aliases": [
            "eimir-test-api"
          ]
        }
      },
      "pull_policy": "always",
      "restart": "unless-stopped",
      "tmpfs": [
        "/tmp:size=1g,mode=0700,uid=10001,gid=10001"
      ],
      "volumes": [
        {
          "source": "cloud_media_data",
          "target": "/var/lib/eimir/media",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "cloud_deletion_journal_data",
          "target": "/var/lib/eimir/deletion-journal",
          "type": "volume",
          "volume": {}
        },
        {
          "bind": {
            "create_host_path": false
          },
          "read_only": true,
          "source": "${EIMIR_PUSH_FCM_CREDENTIALS_HOST_FILE:?Set the existing instance value in Arcane}",
          "target": "/run/secrets/eimir-fcm-sender.json",
          "type": "bind"
        }
      ]
    },
    "cloud-migrate": {
      "command": [
        "alembic",
        "upgrade",
        "head"
      ],
      "entrypoint": null,
      "environment": {
        "EIMIR_DATABASE_URL": "postgresql+psycopg://sidebyside:${POSTGRES_PASSWORD:?Set the existing instance value in Arcane}@eimir-test-postgres:5432/sidebyside",
