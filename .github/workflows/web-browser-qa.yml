name: Web Browser QA

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-browser-qa.yml"
  push:
    branches: [main]
    # Every main revision is a test-channel candidate, including backend changes.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-browser-qa-${{ github.ref }}
  cancel-in-progress: true

# Keep evidence from separate attempts distinct when retrying only failed jobs.
jobs:
  pr-critical:
    if: github.event_name == 'pull_request'
    needs: changed-spec-plan
    name: PR-critical ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    container: node:24.21.0-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked browser QA dependencies
        working-directory: web/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit browser QA dependencies
        working-directory: web/e2e
        run: npm audit --audit-level=high

      - name: Typecheck internal visual proof
        working-directory: web
        run: ./node_modules/.bin/tsc -p e2e/fixtures/tsconfig.json

      - name: Install pinned Chromium runtime
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Validate browser test inventory
        working-directory: web/e2e
        run: npm run test:inventory

      - name: Run PR-critical shard
        working-directory: web/e2e
        env:
          EIMIR_BROWSER_SPECS: ${{ needs.changed-spec-plan.outputs.critical-specs }}
        run: >-
          npm run test:pr --
          --shard=${{ matrix.shard }}/4
          --output=test-results-pr-${{ matrix.shard }}

      - name: Upload PR failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-failure-pr-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: web/e2e/test-results-pr-${{ matrix.shard }}/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload PR product visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-product-visual-evidence-pr-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            web/e2e/test-results-pr-${{ matrix.shard }}/**/planning-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/shell-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/today-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/partner-quick-actions-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/private-area-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/*story-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/wish-detective-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/f1-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/f1-*.json
            web/e2e/test-results-pr-${{ matrix.shard }}/**/f2-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/notification-settings-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/push-consent-*.png
            web/e2e/test-results-pr-${{ matrix.shard }}/**/f2-*.json
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'success' && 1 || 3 }}

  changed-spec-plan:
    if: github.event_name == 'pull_request'
    name: Changed browser spec plan
    runs-on: ubuntu-latest
    container: node:24.21.0-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
    outputs:
      has-specs: ${{ steps.plan.outputs.has-specs }}
      critical-specs: ${{ steps.plan.outputs.critical-specs }}
      additional-specs: ${{ steps.plan.outputs.additional-specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked Web planning dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify browser planning coverage
        run: node --test web/e2e/scripts/*.test.mjs

      - name: Resolve changed browser specs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node web/e2e/scripts/pr-browser-plan.mjs

  changed-specs:
    if: needs.changed-spec-plan.outputs.has-specs == 'true'
    needs: changed-spec-plan
    name: Changed browser specs
    runs-on: ubuntu-latest
    container: node:24.21.0-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked browser QA dependencies
        working-directory: web/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit browser QA dependencies
        working-directory: web/e2e
        run: npm audit --audit-level=high

      - name: Typecheck internal visual proof
        working-directory: web
        run: ./node_modules/.bin/tsc -p e2e/fixtures/tsconfig.json

      - name: Install pinned Chromium runtime
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Validate browser test inventory
        working-directory: web/e2e
        run: npm run test:inventory

      - name: Verify changed browser specs
        working-directory: web/e2e
        env:
          EIMIR_BROWSER_SPECS: ${{ needs.changed-spec-plan.outputs.additional-specs }}
        run: npm run test:full -- --output=test-results-changed-specs

      - name: Upload changed-spec failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-failure-changed-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: web/e2e/test-results-changed-specs/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload changed-spec product visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-product-visual-evidence-changed-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            web/e2e/test-results-changed-specs/**/planning-*.png
            web/e2e/test-results-changed-specs/**/shell-*.png
            web/e2e/test-results-changed-specs/**/today-*.png
            web/e2e/test-results-changed-specs/**/partner-quick-actions-*.png
            web/e2e/test-results-changed-specs/**/private-area-*.png
            web/e2e/test-results-changed-specs/**/*story-*.png
            web/e2e/test-results-changed-specs/**/wish-detective-*.png
            web/e2e/test-results-changed-specs/**/f1-*.png
            web/e2e/test-results-changed-specs/**/f1-*.json
            web/e2e/test-results-changed-specs/**/f2-*.png
            web/e2e/test-results-changed-specs/**/notification-settings-*.png
            web/e2e/test-results-changed-specs/**/push-consent-*.png
            web/e2e/test-results-changed-specs/**/f2-*.json
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'success' && 1 || 3 }}

  full-regression:
    if: github.event_name != 'pull_request'
    name: Full regression ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    container: node:24.21.0-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked browser QA dependencies
        working-directory: web/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit browser QA dependencies
        working-directory: web/e2e
        run: npm audit --audit-level=high

      - name: Typecheck internal visual proof
        working-directory: web
        run: ./node_modules/.bin/tsc -p e2e/fixtures/tsconfig.json

      - name: Install pinned Chromium runtime
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Validate browser test inventory
        working-directory: web/e2e
        run: npm run test:inventory

      - name: Run full-regression shard
        working-directory: web/e2e
        run: >-
          npm run test:full --
          --shard=${{ matrix.shard }}/4
          --output=test-results-full-${{ matrix.shard }}

      - name: Upload full-regression failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-failure-full-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: web/e2e/test-results-full-${{ matrix.shard }}/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload full-regression product visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-product-visual-evidence-full-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            web/e2e/test-results-full-${{ matrix.shard }}/**/planning-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/shell-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/today-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/partner-quick-actions-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/private-area-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/*story-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/wish-detective-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/f1-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/f1-*.json
            web/e2e/test-results-full-${{ matrix.shard }}/**/f2-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/notification-settings-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/push-consent-*.png
            web/e2e/test-results-full-${{ matrix.shard }}/**/f2-*.json
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'success' && 1 || 3 }}

  browser:
    if: always()
    needs:
      - pr-critical
      - changed-spec-plan
      - changed-specs
      - full-regression
    name: Playwright + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify browser QA topology
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_RESULT: ${{ needs.pr-critical.result }}
          PLAN_RESULT: ${{ needs.changed-spec-plan.result }}
          CHANGED_RESULT: ${{ needs.changed-specs.result }}
          FULL_RESULT: ${{ needs.full-regression.result }}
          HAS_SPECS: ${{ needs.changed-spec-plan.outputs.has-specs }}
        run: node web/e2e/scripts/verify-browser-qa.mjs

      - name: Explain targeted retry
        if: failure()
        run: |
          {
            echo '### Retry browser QA for this revision'
            echo
            echo 'Inspect the failed job and its diagnostics first. For a transient failure, choose **Re-run jobs → Re-run failed jobs** on this workflow run.'
            echo 'GitHub reruns failed jobs and their dependent aggregate checks; successful independent jobs stay completed.'
            echo
            echo 'Equivalent GitHub CLI command:'
            echo '```bash'
            printf 'gh run rerun %s --failed --repo %s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
            echo '```'
            echo
            echo 'A code or test fix needs a new commit and fresh checks. A retry uses the original revision.'
          } >> "$GITHUB_STEP_SUMMARY"
