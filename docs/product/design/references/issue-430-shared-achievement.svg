<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7F5"/>
      <stop offset="1" stop-color="#F6EFEA"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF7F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#231E28" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="116" cy="84" r="112" fill="#D93D59" opacity=".08"/>

  <!-- compact global header -->
  <text x="18" y="42" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#231E28">eimir.</text>
  <g fill="none" stroke="#5E5466" stroke-width="2" stroke-linecap="round">
    <circle cx="300" cy="31" r="8"/><path d="m306 37 6 6"/>
    <path d="M328 38h18M332 34c0-8 10-8 10 0M329 38c0 5 17 5 17 0"/>
  </g>
  <circle cx="365" cy="31" r="15" fill="#D6CBE0"/>
  <text x="365" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#231E28">P</text>

  <!-- date + relationship hero -->
  <text x="18" y="92" font-family="Georgia,serif" font-size="31" font-weight="650" fill="#231E28">Montag</text>
  <text x="18" y="114" font-family="Arial,sans-serif" font-size="14" fill="#5E5466">21. September</text>

  <g transform="translate(18 136)">
    <circle cx="26" cy="26" r="26" fill="#F5A882"/>
    <text x="26" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">P</text>
    <circle cx="57" cy="26" r="26" fill="#D6CBE0"/>
    <text x="57" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#231E28">S</text>
    <circle cx="75" cy="43" r="9" fill="#EDF7F5" stroke="#207266" stroke-width="2"/>
    <path d="M71 43h8" stroke="#207266" stroke-width="2"/>
    <text x="97" y="22" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#231E28">Philipp &amp; Sarah</text>
    <text x="97" y="45" font-family="Arial,sans-serif" font-size="13" fill="#5E5466">3 Jahre, 4 Monate zusammen</text>
    <text x="97" y="65" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#207266">Sarah ist gerade hier</text>
  </g>

  <g transform="translate(18 218)">
