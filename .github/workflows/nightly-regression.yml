name: Dispatch nightly runner validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved head of the nightly validation branch
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Start the eight validation workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      TARGET: ci/eimir-nightly-self-hosted
    steps:
      - name: Verify the target and dispatch the branch regression
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET" --jq .object.sha)
          test "$head" = "$EXPECTED_SHA"
          for workflow in ci.yml web-browser-qa.yml android-launcher-icons.yml backend-encrypted.yml media-video.yml codeql.yml self-hosted-deployment-guard.yml self-hosted-recovery.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$TARGET"
            printf '%s dispatched on %s\n' "$workflow" "$head" >> "$GITHUB_STEP_SUMMARY"
          done
