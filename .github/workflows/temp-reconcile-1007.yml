name: Temporary #1007 Conflict Reconcile

on:
  push:
    branches:
      - feat/971-discover-web-integration
    paths:
      - .github/workflows/temp-reconcile-1007.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/971-discover-web-integration
          fetch-depth: 0

      - name: Align canonical Discover CSS-grid selector and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path('web/e2e/tests/story-discover-tapestry.spec.ts')
          text = path.read_text()
          count = text.count("page.locator('.momente-tapestry-columns').first()")
          if count != 2:
              raise SystemExit(f'Expected exactly 2 stale selectors, found {count}')
          text = text.replace(
              "page.locator('.momente-tapestry-columns').first()",
              "page.locator('.momente-tapestry').first()",
          )
          path.write_text(text)
          PY
          rm .github/workflows/temp-reconcile-1007.yml
          git add -A
          git commit -m "fix(test): target canonical Discover CSS grid"
          git push origin HEAD:feat/971-discover-web-integration
