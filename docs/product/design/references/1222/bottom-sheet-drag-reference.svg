<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880">
  <rect width="1440" height="880" fill="#f6f0ec"/>
  <style>
    .title{font:700 30px system-ui,sans-serif;fill:#2d2530}
    .sub{font:500 17px system-ui,sans-serif;fill:#6e6270}
    .phone{fill:#fbf8f6;stroke:#d8cfd5;stroke-width:2}
    .shell{fill:#fff;stroke:#e4dbe1;stroke-width:1.5}
    .muted{fill:#7d727e}
    .copy{font:600 17px system-ui,sans-serif;fill:#342b36}
    .small{font:500 13px system-ui,sans-serif;fill:#7a6f7b}
    .pink{fill:#d83e5b}
    .pinkSoft{fill:#f9e8ec}
    .sheet{fill:#fffdfc;stroke:#ddced6;stroke-width:1.5;filter:url(#shadow)}
    .scrim{fill:#1d1820;opacity:.38}
    .nav{fill:#fff;stroke:#ddd3d9;stroke-width:1.2;filter:url(#shadow)}
    .line{stroke:#d9cfd5;stroke-width:2;stroke-linecap:round}
    .dash{stroke:#d83e5b;stroke-width:3;stroke-dasharray:8 8;fill:none}
    .arrow{stroke:#d83e5b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d1820" flood-opacity=".12"/>
    </filter>
  </defs>

  <text x="60" y="58" class="title">#1222 — Compact bottom-sheet motion reference</text>
  <text x="60" y="88" class="sub">Baseline main 911d3061 · preserve Today content and floating navigation; change only sheet motion/gesture ownership.</text>

  <!-- Phone 1 -->
  <g transform="translate(60 125)">
    <text x="170" y="-18" text-anchor="middle" class="copy">1 · Closed</text>
    <rect x="0" y="0" rx="36" ry="36" width="340" height="690" class="phone"/>
    <rect x="0" y="0" rx="36" ry="36" width="340" height="62" fill="#241e27"/>
    <text x="26" y="39" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#fff">eimir.</text>

    <circle cx="145" cy="120" r="34" fill="#f0d9df"/>
    <circle cx="190" cy="120" r="34" fill="#edd3da" stroke="#fbf8f6" stroke-width="5"/>
    <text x="170" y="176" text-anchor="middle" class="copy">Ihr zwei</text>
    <text x="170" y="198" text-anchor="middle" class="small">4 Jahre zusammen</text>

    <rect x="22" y="228" rx="22" width="296" height="102" class="shell"/>
    <text x="42" y="258" class="copy">Wie geht es euch heute?</text>
    <rect x="42" y="278" rx="14" width="95" height="28" class="pinkSoft"/>
    <rect x="148" y="278" rx="14" width="70" height="28" fill="#eee8ec"/>
    <rect x="230" y="278" rx="14" width="66" height="28" fill="#eee8ec"/>

    <rect x="22" y="347" rx="22" width="296" height="115" class="shell"/>
    <text x="42" y="379" class="copy">Eure Woche</text>
    <line x1="42" y1="402" x2="282" y2="402" class="line"/>
    <line x1="42" y1="424" x2="232" y2="424" class="line"/>

    <rect x="22" y="479" rx="22" width="296" height="92" class="shell"/>
    <text x="42" y="511" class="copy">Gemeinsame Liste</text>
    <line x1="42" y1="536" x2="262" y2="536" class="line"/>

    <rect x="22" y="610" rx="28" width="296" height="58" class="nav"/>
    <circle cx="56" cy="639" r="8" fill="#8f838f"/>
    <circle cx="112" cy="639" r="8" fill="#8f838f"/>
    <circle cx="170" cy="632" r="25" class="pink"/>
    <path d="M170 620v24M158 632h24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="228" cy="639" r="8" fill="#8f838f"/>
    <circle cx="284" cy="639" r="8" fill="#8f838f"/>
  </g>

  <!-- Phone 2 -->
  <g transform="translate(550 125)">
    <text x="170" y="-18" text-anchor="middle" class="copy">2 · Open</text>
    <rect x="0" y="0" rx="36" ry="36" width="340" height="690" class="phone"/>
    <rect x="0" y="0" rx="36" ry="36" width="340" height="690" class="scrim"/>
    <rect x="22" y="610" rx="28" width="296" height="58" class="nav" opacity=".6"/>
    <circle cx="170" cy="632" r="25" class="pink" opacity=".55"/>

    <rect x="14" y="246" rx="30" width="312" height="348" class="sheet"/>
    <rect x="136" y="260" rx="4" width="68" height="7" fill="#b8afb5"/>
    <text x="34" y="308" class="copy">Neu erstellen</text>

    <g transform="translate(34 332)">
      <rect x="0" y="0" rx="16" width="272" height="52" fill="#f8f4f5"/>
      <circle cx="28" cy="26" r="16" class="pinkSoft"/>
      <text x="54" y="31" class="copy">Erinnerung</text>

      <rect x="0" y="62" rx="16" width="272" height="52" fill="#f8f4f5"/>
      <circle cx="28" cy="88" r="16" class="pinkSoft"/>
      <text x="54" y="93" class="copy">Herzmoment</text>

      <rect x="0" y="124" rx="16" width="272" height="52" fill="#f8f4f5"/>
      <circle cx="28" cy="150" r="16" fill="#ece7e9"/>
      <text x="54" y="155" class="copy">Plan</text>

      <rect x="0" y="186" rx="16" width="272" height="52" fill="#f8f4f5"/>
      <circle cx="28" cy="212" r="16" fill="#ece7e9"/>
      <text x="54" y="217" class="copy">Wunsch</text>
    </g>

    <path d="M366 308v160" class="dash"/>
    <path d="M353 455l13 18 13-18" class="arrow"/>
    <text x="394" y="388" class="small">Enter from bottom</text>
    <text x="394" y="408" class="small">using shared tokens</text>
  </g>

  <!-- Phone 3 -->
  <g transform="translate(1040 125)">
    <text x="170" y="-18" text-anchor="middle" class="copy">3 · Drag / dismiss</text>
    <rect x="0" y="0" rx="36" ry="36" width="340" height="690" class="phone"/>
    <rect x="0" y="0" rx="36" ry="36" width="340" height="690" fill="#1d1820" opacity=".24"/>
    <rect x="22" y="610" rx="28" width="296" height="58" class="nav" opacity=".72"/>

    <rect x="14" y="358" rx="30" width="312" height="348" class="sheet"/>
    <rect x="136" y="372" rx="4" width="68" height="7" fill="#b8afb5"/>
    <text x="34" y="420" class="copy">Neu erstellen</text>
    <g transform="translate(34 444)">
      <rect x="0" y="0" rx="16" width="272" height="52" fill="#f8f4f5"/>
      <circle cx="28" cy="26" r="16" class="pinkSoft"/>
      <text x="54" y="31" class="copy">Erinnerung</text>
      <rect x="0" y="62" rx="16" width="272" height="52" fill="#f8f4f5"/>
      <circle cx="28" cy="88" r="16" class="pinkSoft"/>
      <text x="54" y="93" class="copy">Herzmoment</text>
      <rect x="0" y="124" rx="16" width="272" height="52" fill="#f8f4f5"/>
      <circle cx="28" cy="150" r="16" fill="#ece7e9"/>
      <text x="54" y="155" class="copy">Plan</text>
    </g>

    <circle cx="170" cy="474" r="17" fill="none" stroke="#d83e5b" stroke-width="3"/>
    <path d="M170 492v88" class="arrow"/>
    <path d="M158 566l12 16 12-16" class="arrow"/>

    <text x="0" y="740" class="small">Pointer can start on usable sheet surface.</text>
    <text x="0" y="762" class="small">Controls keep taps; scroll owns gesture until top edge.</text>
    <text x="0" y="784" class="small">Release: dismiss past threshold, otherwise settle back.</text>
  </g>

  <text x="60" y="848" class="sub">Reduced motion: keep modality and gesture semantics, remove spatial enter/exit travel; direct drag remains only as needed for manipulation feedback.</text>
</svg>