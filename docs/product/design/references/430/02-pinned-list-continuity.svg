<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#fbf3ef"/>
  <text x="20" y="42" font-family="sans-serif" font-size="12" font-weight="700" fill="#c52548">GEMEINSAME LISTE</text>
  <text x="20" y="76" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#2b2130">Fürs Wochenende am See</text>
  <text x="300" y="42" font-family="sans-serif" font-size="13" font-weight="700" fill="#6d5a69">Liste öffnen →</text>
  <g font-family="sans-serif" font-size="17" fill="#2b2130">
    <circle cx="38" cy="126" r="11" fill="#c52548"/><path d="M33 126l4 4 7-8" fill="none" stroke="white" stroke-width="2"/><text x="62" y="132" text-decoration="line-through" fill="#756974">Picknickdecke einpacken</text>
    <circle cx="38" cy="170" r="11" fill="#c52548"/><path d="M33 170l4 4 7-8" fill="none" stroke="white" stroke-width="2"/><text x="62" y="176" text-decoration="line-through" fill="#756974">Thermoskanne mitnehmen</text>
    <circle cx="38" cy="214" r="11" fill="none" stroke="#c52548" stroke-width="1.5"/><text x="62" y="220">Badesachen einpacken</text>
    <circle cx="38" cy="258" r="11" fill="none" stroke="#c52548" stroke-width="1.5"/><text x="62" y="264">Kartenspiel einstecken</text>
  </g>
  <rect x="20" y="300" width="350" height="44" rx="18" fill="#fff8f5" stroke="#eadbd3"/><text x="195" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6d5a69">2 weitere Einträge anzeigen</text>
  <rect x="20" y="378" width="350" height="92" rx="20" fill="#edf8f4" stroke="#b9ded2"/>
  <circle cx="52" cy="424" r="18" fill="#ffffff" stroke="#83bfae"/><path d="M44 424l6 6 11-13" fill="none" stroke="#2a8b79" stroke-width="3"/>
  <text x="82" y="413" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b2130">Gemeinsam geschafft!</text>
  <text x="82" y="439" font-family="sans-serif" font-size="14" fill="#6d5a69">Die Liste bleibt sichtbar und bedienbar.</text>
  <text x="20" y="514" font-family="sans-serif" font-size="13" fill="#6d5a69">Celebration ist transient, nicht blockierend und verschwindet selbstständig.</text>
</svg>