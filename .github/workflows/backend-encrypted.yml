name: Backend Encrypted Mode

# The default CI lanes run with EIMIR_ENCRYPTION_AT_REST=disabled (the test and
# development default). Cloud Production must run `required`, so the code path that
# production uses would otherwise be exercised only by the dedicated
# test_encryption_at_rest_* suites. This workflow runs the complete backend suite
# (unit and integration) with `required` and freshly generated random keys, to catch
# a feature that works in plaintext mode but breaks once payloads and media are
# ciphertext (issue #797, docs/ENCRYPTION-AT-REST.md).
#
# It is deliberately NOT a required status check. A failure is reported as a red run
# and must be triaged; it is never hidden with continue-on-error. Promote it to a
# required check only after it has been stable for a representative period.

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - backend/src/eimir/security/**
      - backend/src/eimir/db/protected_payload.py
      - backend/src/eimir/media/**
      - backend/src/eimir/config.py
      - backend/tests/support/encryption.py
      - backend/tests/conftest.py
      - .github/workflows/backend-encrypted.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.8"
  UV_VERSION: "0.12.15"

jobs:
  unit:
    name: Backend Encrypted Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EIMIR_ENVIRONMENT: test
      EIMIR_ENCRYPTION_AT_REST: required
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Random keys for this run only
        # Generated per run and masked; never stored, never reused, never a
        # value that could be mistaken for a production key.
        run: python ../tools/ci/encryption_test_keys.py "$GITHUB_ENV"

      - name: Unit tests with encryption required
        run: uv run --frozen pytest -m "not integration" -q

  integration:
    name: Backend Encrypted Integration Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eimir
          POSTGRES_PASSWORD: eimir
          POSTGRES_DB: eimir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eimir -d eimir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      EIMIR_ENVIRONMENT: test
      EIMIR_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
      EIMIR_TEST_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
      EIMIR_ENCRYPTION_AT_REST: required

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen

      - name: Random keys for this run only
        run: python ../tools/ci/encryption_test_keys.py "$GITHUB_ENV"

      - name: Migrations
        # Several migration tests assume a database at head, exactly as in the
        # Backend Integration gate.
        run: uv run --frozen alembic upgrade head

      - name: Integration tests with encryption required
        # Same deterministic sharding and no-skips guarantee as the Backend
        # Integration gate, so a silently unreachable database cannot pass.
        run: |
          collection=$(mktemp)
          selected_file=$(mktemp)
          report=$(mktemp)
          uv run --frozen pytest -m integration --collect-only -q > "$collection"
          python ../tools/ci/pytest_shard.py \
            --shard "${{ matrix.shard }}" \
            --shard-count 4 \
            < "$collection" > "$selected_file"
          mapfile -t selected < "$selected_file"
          expected="${#selected[@]}"
          if [ "$expected" -eq 0 ]; then
            echo "Encrypted integration shard ${{ matrix.shard }}/4 selected no tests."
            exit 1
          fi
          echo "Encrypted integration shard ${{ matrix.shard }}/4 selected $expected tests."
          uv run --frozen pytest -m integration -q --durations=20 \
            --junitxml="$report" "${selected[@]}"
          uv run --frozen python - "$report" "$expected" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          expected = int(sys.argv[2])
          testcases = root.findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in testcases)

          if len(testcases) != expected:
              raise SystemExit(
                  f"Expected {expected} integration tests, but JUnit contains {len(testcases)}."
              )
          if skipped:
              raise SystemExit(
                  f"{skipped} integration test(s) were skipped - "
                  "is the database unavailable?"
              )
          PY
