  <!-- status-surface: secondary-roadmap-visual -->
  <title id="title">eimir. Roadmap – release the Core before optional expansion</title>
  <desc id="desc">M0 through M5 form the Core delivery path through G4. M6 Operate and Launch leads to G5 Launch-ready. M7 Relationship Depth, M8 Discover and Integrations, and M9 Context and Presence follow after launch. This diagram shows sequence, not current execution status. E2EE remains a separate strategic track.</desc>
