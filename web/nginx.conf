server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 100m;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' blob:; font-src 'self'; connect-src 'self'${EIMIR_WEB_CSP_CONNECT_ORIGINS}; media-src 'none'; manifest-src 'none'; worker-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /.well-known/eimir-revision {
        access_log off;
        default_type text/plain;
        try_files $uri =404;
    }

    # Temporary compatibility endpoint for pre-rename deployment tooling.
    location = /.well-known/sidebyside-revision {
        access_log off;
        default_type text/plain;
        try_files $uri =404;
    }

    # Only the local loopback test uses this hop. In production, the trusted
    # TLS proxy routes /api/ directly to the API.
    #
    # access_log is off here for the same reason as /healthz: the stock
    # nginx `main` log format records "$request", the raw request line
    # including the query string. API query parameters can carry
    # ProtectedPayload-derived content (for example the Search `q` value),
    # so this proxy hop must not write it to nginx's access log even for
    # this local/test hop (see issue #696).
    location /api/ {
        access_log off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
