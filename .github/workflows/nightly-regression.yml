name: Nightly Regression

# Pull requests run a cheap tier by default (#2096). This dispatcher runs the
# complete regression on main once per night, but only for workflows whose
# current main revision has not been tested by a dispatched run yet. A failed
# run for the same revision is not repeated automatically; the Nightly
# Regression Report workflow opens an issue instead, and a manual dispatch of
# this workflow or of a single workflow re-runs it on demand.
on:
  schedule:
    # 01:17 UTC = 02:17 Europe/Berlin in winter, 03:17 in summer.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Dispatch every workflow even if this main revision was already tested.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly-regression
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch full regression on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the capability probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the code-scanning state of this repository
        # Decision 0019, D5: a private personal repository has no CodeQL; the
        # probe refuses that state unless the Product Owner's acceptance is set.
        id: supply_chain
        env:
          GH_TOKEN: ${{ github.token }}
          EIMIR_SUPPLY_CHAIN_EXCEPTION: ${{ vars.EIMIR_SUPPLY_CHAIN_EXCEPTION }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}" > "$RUNNER_TEMP/repository.json"
          python3 scripts/supply_chain_state.py assess \
            --repository-json "$RUNNER_TEMP/repository.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch workflows whose main revision is untested
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
          CODE_SCANNING: ${{ steps.supply_chain.outputs.code_scanning }}
        run: |
          set -euo pipefail
          case "$CODE_SCANNING" in
            available | unavailable) ;;
            *) echo "Unknown code-scanning state: ${CODE_SCANNING}" >&2; exit 1 ;;
          esac

          # Keep this list in sync with the Nightly Regression Report triggers and
          # tools/ci/test_nightly_regression.py.
          workflows=(
            ci.yml
            web-browser-qa.yml
            android-launcher-icons.yml
            backend-encrypted.yml
            media-video.yml
            codeql.yml
            self-hosted-deployment-guard.yml
            self-hosted-recovery.yml
          )

          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "main is at ${main_sha}" | tee -a "$GITHUB_STEP_SUMMARY"

          for workflow in "${workflows[@]}"; do
            if [ "$workflow" = codeql.yml ] && [ "$CODE_SCANNING" = unavailable ]; then
              echo "- ${workflow}: not dispatched, code scanning is unavailable on ${GITHUB_REPOSITORY} (Decision 0019, D5)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Any dispatched run of this revision that was not cancelled counts:
            # green needs no repeat, red is reported once instead of nightly.
            tested=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&head_sha=${main_sha}&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion != "cancelled")] | length')
            if [ "$FORCE" != "true" ] && [ "$tested" -gt 0 ]; then
              echo "- ${workflow}: already tested at this revision, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            echo "- ${workflow}: dispatched" >> "$GITHUB_STEP_SUMMARY"
          done
