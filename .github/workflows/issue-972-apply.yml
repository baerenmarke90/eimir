name: Apply issue 972 implementation

on:
  push:
    branches:
      - feat/972-momente-browse-layer

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Apply the scoped Momente browse-layer change
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function read(file) {
            return fs.readFileSync(file, 'utf8');
          }

          function write(file, content) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, content);
          }

          function replaceOnce(content, before, after, label) {
            const first = content.indexOf(before);
            if (first < 0) throw new Error(`Missing replacement anchor: ${label}`);
            if (content.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Replacement anchor is not unique: ${label}`);
            }
            return content.slice(0, first) + after + content.slice(first + before.length);
          }

          const browseComponent = `import { Link } from 'react-router-dom';
          import {
            STORY_CHAPTERS_ROUTE,
            STORY_YEARS_ROUTE,
          } from '../client/routes';
          import { useTranslation } from '../i18n';

          const MILESTONES_BROWSE_ROUTE = '/story?tab=timeline&type=MILESTONE';

          export function StoryBrowseLayer() {
            const { t } = useTranslation();

            return (
              <nav
                className="momente-browse-layer eimir-motion-reveal"
                aria-label={t('story.browseTitle')}
              >
                <p className="momente-browse-heading">{t('story.browseTitle')}</p>
                <div className="momente-browse-links">
                  <Link to={MILESTONES_BROWSE_ROUTE} className="momente-browse-link">
                    <svg
                      className="momente-browse-icon"
                      viewBox="0 0 24 24"
                      width="18"
                      height="18"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="2"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M5 21V4" />
                      <path d="M5 5h11l-2 4 2 4H5" />
                    </svg>
                    <span>{t('story.browseMilestones')}</span>
                  </Link>
                  <Link to={STORY_CHAPTERS_ROUTE} className="momente-browse-link">
                    <svg
                      className="momente-browse-icon"
                      viewBox="0 0 24 24"
                      width="18"
                      height="18"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="2"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                      <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z" />
                    </svg>
                    <span>{t('story.browseChapters')}</span>
                  </Link>
                  <Link to={STORY_YEARS_ROUTE} className="momente-browse-link">
                    <svg
                      className="momente-browse-icon"
                      viewBox="0 0 24 24"
                      width="18"
                      height="18"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="2"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      aria-hidden="true"
                    >
                      <rect x="3" y="4" width="18" height="18" rx="2" />
                      <path d="M16 2v4M8 2v4M3 10h18" />
                    </svg>
                    <span>{t('story.browseYears')}</span>
                  </Link>
                </div>
              </nav>
            );
          }
          `;
          write('web/src/components/StoryBrowseLayer.tsx', browseComponent);

          const browseTest = `import { renderToStaticMarkup } from 'react-dom/server';
          import { MemoryRouter } from 'react-router-dom';
          import de from '../i18n/locales/de';
          import { StoryBrowseLayer } from './StoryBrowseLayer';

          describe('StoryBrowseLayer', () => {
            it('exposes the three structural destinations as navigation, not primary tabs', () => {
              const html = renderToStaticMarkup(
                <MemoryRouter>
                  <StoryBrowseLayer />
                </MemoryRouter>,
              );

              expect(html).toContain('momente-browse-layer');
              expect(html).toContain(de.story.browseTitle);
              expect(html).toContain(de.story.browseMilestones);
              expect(html).toContain(de.story.browseChapters);
              expect(html).toContain(de.story.browseYears);
              expect(html).toContain('href="/story?tab=timeline&amp;type=MILESTONE"');
              expect(html).toContain('href="/story/chapters"');
              expect(html).toContain('href="/story/years"');
              expect(html).not.toContain('role="tab"');
            });
          });
          `;
          write('web/src/components/StoryBrowseLayer.test.tsx', browseTest);

          let storyPage = read('web/src/components/StoryProductPage.tsx');
          storyPage = storyPage.replace('  STORY_CHAPTERS_ROUTE,\n  STORY_YEARS_ROUTE,\n  storyYearPath,\n', '');
          storyPage = replaceOnce(
            storyPage,
            "import { ShortTaskSheet, type ShortTaskSheetHandle } from './ShortTaskSheet';\n",
            "import { ShortTaskSheet, type ShortTaskSheetHandle } from './ShortTaskSheet';\nimport { StoryBrowseLayer } from './StoryBrowseLayer';\n",
            'StoryBrowseLayer import',
          );
          storyPage = replaceOnce(
            storyPage,
            "  const milestones = useMemo(\n    () => items.filter((item) => item.kind === 'MILESTONE'),\n    [items],\n  );\n",
            '',
            'milestones landing-page projection',
          );
          storyPage = replaceOnce(
            storyPage,
            "      </div>\n\n      {storyQuery.isLoading ? (",
            "      </div>\n\n      <StoryBrowseLayer />\n\n      {storyQuery.isLoading ? (",
            'browse layer placement',
          );
          const oldStructureStart = storyPage.indexOf(
            '          {/* 3. Milestones & Chapters archive entries',
          );
          const timelineBoundary =
            "        </div>\n      ) : combinedStory && activeView === 'timeline' ? (";
          const oldStructureEnd = storyPage.indexOf(timelineBoundary, oldStructureStart);
          if (oldStructureStart < 0 || oldStructureEnd < 0) {
            throw new Error('Could not isolate the old lower Momente structure blocks');
          }
          storyPage =
            storyPage.slice(0, oldStructureStart) +
            timelineBoundary +
            storyPage.slice(oldStructureEnd + timelineBoundary.length);
          write('web/src/components/StoryProductPage.tsx', storyPage);

          let locale = read('web/src/i18n/locales/de.ts');
          locale = replaceOnce(
            locale,
            "    viewToggleAria: 'Ansicht wählen',\n",
            "    viewToggleAria: 'Ansicht wählen',\n    browseTitle: 'Durchstöbern',\n    browseMilestones: 'Meilensteine',\n    browseChapters: 'Kapitel',\n    browseYears: 'Jahre',\n",
            'German browse labels',
          );
          write('web/src/i18n/locales/de.ts', locale);

          let css = read('web/src/components/StoryProductPages.css');
          css = replaceOnce(
            css,
            '  margin: var(--space-2) 0 var(--space-6);\n',
            '  margin: var(--space-2) 0 var(--space-3);\n',
            'Momente tab spacing',
          );
          const archiveCssStart = css.indexOf(
            '/* Milestones & Chapters archive entries (#790/#791):',
          );
          const timelineCssMarker = `/* =====================================================================
           * Momente > Zeitleiste: Header & Filter Chips (#860)
           * ===================================================================== */`;
          const archiveCssEnd = css.indexOf(timelineCssMarker, archiveCssStart);
          if (archiveCssStart < 0 || archiveCssEnd < 0) {
            throw new Error('Could not isolate the old Momente archive CSS');
          }
          const browseCss = `/* Momente structural browse layer (#972): compact secondary navigation.
           * Content is experienced in Discover/Timeline; structure is navigated here. */
          .momente-browse-layer {
            display: grid;
            width: min(100%, 42rem);
            gap: var(--space-2);
            margin: 0 auto var(--space-6);
          }

          .momente-browse-heading {
            margin: 0;
            color: var(--color-text-secondary);
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1.3;
          }

          .momente-browse-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
            gap: var(--space-1);
            padding: 4px;
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-large);
            background: var(--color-surface-subtle);
          }

          .momente-browse-link {
            display: inline-flex;
            min-width: 0;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-medium);
            background: transparent;
            color: var(--color-text-secondary);
            font-size: 0.88rem;
            font-weight: 650;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
            transition:
              background-color var(--motion-duration-short) ease,
              color var(--motion-duration-short) ease;
          }

          .momente-browse-link:hover {
            background: var(--color-surface-raised);
            color: var(--color-text);
          }

          .momente-browse-link:focus-visible {
            outline: 3px solid var(--color-focus);
            outline-offset: 2px;
          }

          .momente-browse-icon {
            flex: 0 0 auto;
          }

          @media (max-width: 359px) {
            .momente-browse-links {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .momente-browse-link:last-child {
              grid-column: 1 / -1;
            }
          }

          `;
          css = css.slice(0, archiveCssStart) + browseCss + css.slice(archiveCssEnd);
          write('web/src/components/StoryProductPages.css', css);

          let unit = read('web/src/components/StoryProductPage.test.tsx');
          const oldUnitStart = unit.indexOf(
            "  it('renders clickable milestone card with updated non-achievement copy linking to timeline filter', () => {",
          );
          const nextUnitMarker =
            "  describe('regression #790/#791: Momente Discover newest-first month bands', () => {";
          const oldUnitEnd = unit.indexOf(nextUnitMarker, oldUnitStart);
          if (oldUnitStart < 0 || oldUnitEnd < 0) {
            throw new Error('Could not isolate the old milestone landing-page test');
          }
          const newUnit = `  it('keeps milestone story content distinct from the compact structural navigation', () => {
            const html = renderStoryPage('/story', {
              items: [
                {
                  kind: 'MILESTONE',
                  effectiveDate: new Date('2026-08-20T00:00:00Z'),
                  milestone: {
                    id: 'mile-1',
                    title: 'Moved in together',
                    happenedOn: new Date('2026-08-20T00:00:00Z'),
                    createdAt: new Date('2026-08-20T00:00:00Z'),
                    author: { id: 'author-1', displayName: 'Alex' },
                    creator: { id: 'author-1', displayName: 'Alex' },
                  },
                },
              ],
              availableYears: [2026],
              hasMore: false,
              nextCursor: null,
            });

            expect(html).toContain('momente-tapestry-milestone');
            expect(html).toContain('Moved in together');
            expect(html).toContain('momente-browse-layer');
            expect(html).toContain(de.story.browseMilestones);
            expect(html).toContain(de.story.browseChapters);
            expect(html).toContain(de.story.browseYears);
            expect(html).toContain('href="/story?tab=timeline&amp;type=MILESTONE"');
            expect(html).toContain('href="/story/chapters"');
            expect(html).toContain('href="/story/years"');
            expect(html).not.toContain(de.story.milestonesDesc);
            expect(html).not.toContain('momente-archive-links');
            expect(html).not.toContain('momente-year-archive');
          });

          `;
          unit = unit.slice(0, oldUnitStart) + newUnit + unit.slice(oldUnitEnd);
          write('web/src/components/StoryProductPage.test.tsx', unit);

          let e2e = read('web/e2e/tests/story-discover-tapestry.spec.ts');
          e2e = replaceOnce(
            e2e,
            "import AxeBuilder from '@axe-core/playwright';\n",
            "import path from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport AxeBuilder from '@axe-core/playwright';\n",
            'browser evidence path imports',
          );
          e2e = replaceOnce(
            e2e,
            "const PROFILE_ID = '33333333-3333-4333-8333-333333333333';\n",
            "const PROFILE_ID = '33333333-3333-4333-8333-333333333333';\nconst BROWSE_EVIDENCE_DIR = path.join(\n  path.dirname(fileURLToPath(import.meta.url)),\n  '..',\n  '..',\n  '..',\n  'docs',\n  'product',\n  'design',\n  'evidence',\n  '972-momente-browse-layer',\n);\n",
            'browser evidence directory',
          );
          const browseE2e = `

          test('Momente browse layer keeps three structural destinations compact and secondary at 390px', async ({
            page,
          }) => {
            await installDiscoverApiMocks(page);
            await page.emulateMedia({ colorScheme: 'light' });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto('/story?tab=discover');
            await signIn(page);
            await page.goto('/story?tab=discover');

            const browse = page.getByRole('navigation', { name: de.story.browseTitle });
            await expect(browse).toBeVisible();
            await expect(
              browse.getByRole('link', { name: de.story.browseMilestones }),
            ).toHaveAttribute('href', '/story?tab=timeline&type=MILESTONE');
            await expect(
              browse.getByRole('link', { name: de.story.browseChapters }),
            ).toHaveAttribute('href', '/story/chapters');
            await expect(
              browse.getByRole('link', { name: de.story.browseYears }),
            ).toHaveAttribute('href', '/story/years');

            await expect(page.getByRole('tab')).toHaveCount(2);
            await expect(page.locator('.momente-archive-links')).toHaveCount(0);
            await expect(page.locator('.momente-year-archive')).toHaveCount(0);
            await expect(page.getByText(de.story.milestonesDesc)).toHaveCount(0);
            await expect(page.getByText(de.story.yearArchiveSubtitle)).toHaveCount(0);
            await expect(page.getByText(de.story.yearArchiveAll)).toHaveCount(0);

            const browseBox = await browse.boundingBox();
            const heroBox = await page.locator('.momente-hero-highlight').boundingBox();
            expect(browseBox).not.toBeNull();
            expect(heroBox).not.toBeNull();
            expect(browseBox?.y ?? Number.POSITIVE_INFINITY).toBeLessThan(
              heroBox?.y ?? Number.NEGATIVE_INFINITY,
            );

            const linkBoxes = await browse.getByRole('link').evaluateAll((links) =>
              links.map((link) => {
                const rect = link.getBoundingClientRect();
                return { width: rect.width, height: rect.height };
              }),
            );
            for (const box of linkBoxes) {
              expect(box.width).toBeGreaterThanOrEqual(44);
              expect(box.height).toBeGreaterThanOrEqual(44);
            }

            const dimensions = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(dimensions.scrollWidth).toBeLessThanOrEqual(dimensions.clientWidth);

            const milestoneEntry = browse.getByRole('link', {
              name: de.story.browseMilestones,
            });
            await milestoneEntry.focus();
            await expect(milestoneEntry).toBeFocused();
            await expectNoWcagViolations(page);

            fs.mkdirSync(BROWSE_EVIDENCE_DIR, { recursive: true });
            await page.screenshot({
              path: path.join(BROWSE_EVIDENCE_DIR, '972-browse-390-light.png'),
              fullPage: false,
            });
          });

          test('Momente browse layer reflows at 320px with enlarged text in dark mode', async ({
            page,
          }) => {
            await installDiscoverApiMocks(page);
            await page.emulateMedia({ colorScheme: 'dark' });
            await page.setViewportSize({ width: 320, height: 720 });
            await page.goto('/story?tab=discover');
            await signIn(page);
            await page.goto('/story?tab=discover');
            await page.addStyleTag({ content: 'html { font-size: 125%; }' });

            const browse = page.getByRole('navigation', { name: de.story.browseTitle });
            await expect(browse).toBeVisible();
            await expect(browse.getByRole('link')).toHaveCount(3);

            const dimensions = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(dimensions.scrollWidth).toBeLessThanOrEqual(dimensions.clientWidth);

            const linkBoxes = await browse.getByRole('link').evaluateAll((links) =>
              links.map((link) => {
                const rect = link.getBoundingClientRect();
                return { width: rect.width, height: rect.height };
              }),
            );
            for (const box of linkBoxes) {
              expect(box.width).toBeGreaterThanOrEqual(44);
              expect(box.height).toBeGreaterThanOrEqual(44);
            }

            await expectNoWcagViolations(page);
            fs.mkdirSync(BROWSE_EVIDENCE_DIR, { recursive: true });
            await page.screenshot({
              path: path.join(
                BROWSE_EVIDENCE_DIR,
                '972-browse-320-dark-large-text.png',
              ),
              fullPage: false,
            });
          });
          `;
          e2e += browseE2e;
          e2e = replaceOnce(
            e2e,
            "import path from 'node:path';\n",
            "import fs from 'node:fs';\nimport path from 'node:path';\n",
            'browser evidence fs import',
          );
          write('web/e2e/tests/story-discover-tapestry.spec.ts', e2e);

          const evidenceReadme = `# #972 — Momente compact browse layer visual evidence

          This folder contains exact-build Web/Mobile Web evidence for issue #972.

          - \`972-browse-390-light.png\`: 390 × 844, light theme.
          - \`972-browse-320-dark-large-text.png\`: 320 × 720, dark theme, root text enlarged to 125%.

          Both captures exercise the real Web client with the deterministic Momente browser fixture. The browser assertions verify all three structural destinations, two primary tabs only, browse-before-content placement, 44px minimum targets, keyboard focus, no horizontal overflow, removal of the old lower structural blocks, and axe WCAG A/AA checks (with only the two documented pre-existing Discover exclusions already present in this spec).

          Scope is Web/Mobile Web only for #972. Native Android is deliberately outside the regular feature scope for this slice and was not changed.
          `;
          write(
            'docs/product/design/evidence/972-momente-browse-layer/README.md',
            evidenceReadme,
          );
          NODE

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked browser QA dependencies
        working-directory: web/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format touched Web sources
        working-directory: web
        run: npm run format

      - name: Web typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web lint
        working-directory: web
        run: npm run lint

      - name: Web unit tests
        working-directory: web
        run: npm test -- src/components/StoryBrowseLayer.test.tsx src/components/StoryProductPage.test.tsx

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Install pinned Chromium runtime
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Momente browser regression and visual evidence
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright test tests/story-discover-tapestry.spec.ts --project=chromium --workers=1

      - name: Commit implementation and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-972-apply.yml
          git add web/src/components/StoryBrowseLayer.tsx \
            web/src/components/StoryBrowseLayer.test.tsx \
            web/src/components/StoryProductPage.tsx \
            web/src/components/StoryProductPage.test.tsx \
            web/src/components/StoryProductPages.css \
            web/src/i18n/locales/de.ts \
            web/e2e/tests/story-discover-tapestry.spec.ts \
            docs/product/design/evidence/972-momente-browse-layer
          git commit -m "feat(product): add compact Momente browse layer (#972)"
          git push origin HEAD:feat/972-momente-browse-layer
