name: CI

on:
  # Pushes to main start no run; the nightly regression dispatches main (#2096).
  # Pull requests run the cheap tier unless they are ready for review and carry
  # ci:full or touch a risk path (tools/ci/change_scope.py, #2096). A re-run reads
  # labels live, so adding ci:full and re-running the failed or skipped jobs applies it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly and manual runs come from the nightly regression dispatcher.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.15.2"
  UV_VERSION: "0.12.15"

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Labels and draft state are read live so a re-run after adding ci:full applies it.
      pull-requests: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      backend_integration: ${{ steps.scope.outputs.backend_integration }}
      self_hosted: ${{ steps.scope.outputs.self_hosted }}
      api_clients: ${{ steps.scope.outputs.api_clients }}
      supply_chain: ${{ steps.scope.outputs.supply_chain }}
      supply_chain_backend: ${{ steps.scope.outputs.supply_chain_backend }}
      supply_chain_web: ${{ steps.scope.outputs.supply_chain_web }}
      supply_chain_backend_build: ${{ steps.scope.outputs.supply_chain_backend_build }}
      supply_chain_web_build: ${{ steps.scope.outputs.supply_chain_web_build }}
      web: ${{ steps.scope.outputs.web }}
      tier: ${{ steps.scope.outputs.tier }}
      label_required: ${{ steps.scope.outputs.label_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test change-scope filter logic
        run: python3 tools/ci/test_change_scope.py

      - name: Test pull-request change range
        run: python3 tools/ci/test_pr_change_range.py

      - name: Test nightly regression wiring
        run: python3 tools/ci/test_nightly_regression.py

      - name: Test codec advisory review issue wiring
        run: python3 tools/ci/test_codec_advisory_issue.py

      - name: Test encryption test-key generator
        run: python3 tools/ci/test_encryption_test_keys.py

      - name: Test Google Photos Picker read-only probe
        run: python3 tools/ci/test_google_photos_picker_probe.py

      - name: Test cloud Google Photos Picker OAuth callback
        run: python3 tools/ci/test_google_photos_picker_web_probe.py

      - name: Test static eimir.de main site
        run: python3 tools/ci/test_main_site.py

      - name: Audit migrated engineering-language surfaces
        run: |
          python3 tools/ci/test_engineering_language_audit.py
          python3 tools/ci/engineering_language_audit.py

      - name: Classify legacy project-identity references
        run: |
          python3 tools/ci/test_project_identity_scan.py
          python3 tools/ci/test_project_identity_migration.py
          python3 tools/ci/project_identity_scan.py

      - name: Determine relevant change scopes
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          enable_all() {
            for scope in backend backend_integration self_hosted api_clients supply_chain supply_chain_backend supply_chain_web supply_chain_backend_build supply_chain_web_build web; do
              echo "$scope=true" >> "$GITHUB_OUTPUT"
            done
            echo "tier=full" >> "$GITHUB_OUTPUT"
            echo "label_required=false" >> "$GITHUB_OUTPUT"
          }

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              ;;
            *)
              enable_all
              echo "Scheduled/manual run: all expensive CI gates remain active."
              exit 0
              ;;
          esac

          if [ -z "$base_sha" ] || [ -z "$head_sha" ] \
            || [[ "$base_sha" =~ ^0+$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            enable_all
            echo "Change range unavailable; failing closed to all expensive CI gates."
            exit 0
          fi

          # Treat renames as delete+add intentionally. Moving a file out of a
          # runtime path therefore still activates the originally affected gate,
          # and deletions remain covered as well.
          # A pull request compares against the merge base. A plain two-commit diff
          # would count newer base-branch commits that the head lacks as changes of
          # this pull request and select the full tier for an unrelated change (#2096).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if ! git merge-base "$base_sha" "$head_sha" >/dev/null 2>&1; then
              enable_all
              echo "Pull-request merge base unavailable; failing closed to all expensive CI gates."
              exit 0
            fi
            git diff --name-only --no-renames "$base_sha...$head_sha" > /tmp/changed-files.txt
          else
            git diff --name-only --no-renames "$base_sha" "$head_sha" > /tmp/changed-files.txt
          fi
          echo "Changed files:"
          cat /tmp/changed-files.txt

          tier_args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pr_state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '{draft: .draft, labels: [.labels[].name] | join(",")}')
            tier_args=(--pull-request
              --draft "$(jq -r '.draft' <<< "$pr_state")"
              --labels "$(jq -r '.labels' <<< "$pr_state")"
              --head-ref "$GITHUB_HEAD_REF")
          fi
          python3 tools/ci/change_scope.py /tmp/changed-files.txt "${tier_args[@]}" > /tmp/scope-outputs.txt
          cat /tmp/scope-outputs.txt >> "$GITHUB_OUTPUT"
          cat /tmp/scope-outputs.txt
          grep -E '^(tier|tier_reason)=' /tmp/scope-outputs.txt \
            | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

          # Label-gated workflows only see labels, not paths, so a changed
          # definition must carry ci:full to run before merge.
          if grep -qx 'label_required=true' /tmp/scope-outputs.txt; then
            echo "::error::This pull request changes a workflow or tooling that only runs with the ci:full label."
            echo "Add the ci:full label, then re-run this job; the changed workflow then runs before merge (#2096)."
            exit 1
          fi

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      EIMIR_ENVIRONMENT: test
      # Core plus the Pro plugin, as in the released image (#2182).
      EIMIR_PLUGINS: pro
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen --all-packages

      - name: Safe Self-Hosted configuration
        working-directory: .
        run: |
          docker compose --env-file .env.example config --quiet
          host_ip=$(docker compose --env-file .env.example config --format json \
            | jq -r '.services.api.ports[0].host_ip')
          if [ "$host_ip" != "127.0.0.1" ]; then
            echo "The API is not restricted to loopback by default: $host_ip"
            exit 1
          fi

      - name: No source file is hidden by .gitignore
        # An unanchored pattern such as "media/" matches every directory with
        # that name. This is invisible locally because the file remains on disk;
        # only a fresh CI checkout exposes the missing file.
        working-directory: .
        run: |
          missing_files=$(comm -23 \
            <(find backend/src backend/pro/src backend/admin/src web -name "*.py" -o -name "*.ts" \
                -o -name "*.tsx" 2>/dev/null | sort) \
            <(git ls-files backend/src backend/pro/src backend/admin/src web | sort))
          if [ -n "$missing_files" ]; then
            echo "These source files are not tracked:"
            echo "$missing_files"
            exit 1
          fi

      - name: Lint
        run: uv run --frozen ruff check src tests scripts alembic pro admin

      - name: Formatting
        run: uv run --frozen ruff format --check src tests scripts alembic pro admin

      - name: Type checking
        run: uv run --frozen mypy

      - name: OpenAPI contract
        # The versioned contract is complete: Pro and the operator plugin loaded.
        env:
          EIMIR_PLUGINS: pro,admin
        run: uv run --frozen python scripts/openapi_contract.py check

      - name: Tests without integration
        run: uv run --frozen pytest -m "not integration" -q

  web:
    name: Web Reference Flow
    needs: changes
    # Required check: unrelated pull requests report it as skipped (#2096).
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore npm download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: web-gate-npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: web-gate-npm-${{ runner.os }}-

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        run: node scripts/audit-gate.mjs

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Capacitor foundation check
        run: npm run cap:check

      - name: Production build
        run: npm run build

  backend_integration_shards:
    name: Backend Integration Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.backend_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    # Each shard gets its own runner and PostgreSQL service. The deterministic
    # selector partitions the collected integration node IDs exactly once, so
    # the gate keeps full coverage while lowering the time spent waiting for
    # the slowest shard.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eimir
          POSTGRES_PASSWORD: eimir
          POSTGRES_DB: eimir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eimir -d eimir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      EIMIR_ENVIRONMENT: test
      EIMIR_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
      EIMIR_TEST_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
      # Core plus the Pro plugin, as in the released image (#2182).
      EIMIR_PLUGINS: pro

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --frozen --all-packages

      - name: Migrations
        run: uv run --frozen alembic upgrade head

      - name: Schema matches the committed fingerprint
        # Decision 0017, Phase 2 (#2182): moving the Pro code must not change the
        # schema a fresh database reaches, with or without the plugin.
        run: uv run --frozen python -m scripts.schema_fingerprint check

      - name: Migrations are complete
        # A model/schema difference indicates a missing migration and would
        # otherwise surface only during deployment.
        run: |
          uv run --frozen alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE "op\.(create|drop|alter|add)_" alembic/versions/drift_check_*.py; then
            echo "Models and migrations differ:"
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm alembic/versions/drift_check_*.py

      - name: Integration tests actually ran
        # Collect once per isolated shard, split node IDs deterministically, and
        # retain the existing no-skips guarantee. --durations keeps the slowest
        # tests visible so future fixture regressions can be optimized directly.
        run: |
          collection=$(mktemp)
          selected_file=$(mktemp)
          report=$(mktemp)
          uv run --frozen pytest -m integration --collect-only -q > "$collection"
          python ../tools/ci/pytest_shard.py \
            --shard "${{ matrix.shard }}" \
            --shard-count "${{ strategy.job-total }}" \
            < "$collection" > "$selected_file"
          mapfile -t selected < "$selected_file"
          expected="${#selected[@]}"
          if [ "$expected" -eq 0 ]; then
            echo "Integration shard ${{ matrix.shard }}/${{ strategy.job-total }} selected no tests."
            exit 1
          fi
          echo "Integration shard ${{ matrix.shard }}/${{ strategy.job-total }} selected $expected tests."
          uv run --frozen pytest -m integration -q --durations=20 \
            --junitxml="$report" "${selected[@]}"
          uv run --frozen python - "$report" "$expected" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          expected = int(sys.argv[2])
          testcases = root.findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in testcases)

          if len(testcases) != expected:
              raise SystemExit(
                  f"Expected {expected} integration tests, but JUnit contains {len(testcases)}."
              )
          if skipped:
              raise SystemExit(
                  f"{skipped} integration test(s) were skipped - "
                  "is the database unavailable?"
              )
          PY

  backend-integration:
    name: Backend Integration
    needs: [changes, backend_integration_shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The repository ruleset requires the exact "Backend Integration" context.
    # Keep that stable while the expensive work fans out into matrix shards.
    steps:
      - name: Verify integration shards
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.backend_integration }}
          SHARDS_RESULT: ${{ needs.backend_integration_shards.result }}
        run: |
          if [ "$CHANGE_RESULT" != "success" ]; then
            echo "Change Detection did not succeed: $CHANGE_RESULT"
            exit 1
          fi
          if [ "$INTEGRATION_REQUIRED" != "true" ]; then
            echo "Backend integration is not required for this change set."
            exit 0
          fi
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "One or more Backend Integration shards did not succeed: $SHARDS_RESULT"
            exit 1
          fi
          echo "All Backend Integration shards succeeded."

  backend_core_only_shards:
    name: Backend Core-only Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.backend_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # Decision 0017: the backend suite also runs without the Pro plugin. The
    # Pro feature modules are not collected and `requires_pro` tests skip;
    # everything else, including the Core-only assertions of #2082, runs here.
    # Migration and drift check also run without the plugin, so a Core-only
    # `migrate` starts and autogenerate never proposes dropping plugin tables.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eimir
          POSTGRES_PASSWORD: eimir
          POSTGRES_DB: eimir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eimir -d eimir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      EIMIR_ENVIRONMENT: test
      EIMIR_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
      EIMIR_TEST_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
      EIMIR_PLUGINS: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          # Core only: the Pro distribution (backend/pro, #2182) is not
          # installed, so nothing here can import or load Pro code.
          uv sync --frozen

      - name: Core-only migrations
        run: uv run --frozen alembic upgrade head

      - name: Core-only schema matches the committed fingerprint
        run: uv run --frozen python -m scripts.schema_fingerprint check

      - name: Core-only autogenerate keeps plugin tables
        run: |
          uv run --frozen alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE "op\.(create|drop|alter|add)_" alembic/versions/drift_check_*.py; then
            echo "Core-only models and migrations differ:"
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm alembic/versions/drift_check_*.py

      - name: Core-only tests actually ran
        # Unit and integration tests run in separate pytest processes, as in
        # the Backend and Backend Integration jobs; mixing them in one process
        # leaks process-wide state between the two layers. Like the Backend job,
        # the unit layer runs without a database. Integration skips are accepted
        # only with the Core-only reason, so a missing database still fails.
        run: |
          status=0
          for layer in unit integration; do
            if [ "$layer" = unit ]; then
              marker="not integration"
              runner=(env -u EIMIR_DATABASE_URL -u EIMIR_TEST_DATABASE_URL uv run --frozen)
            else
              marker="integration"
              runner=(uv run --frozen)
            fi
            collection=$(mktemp)
            selected_file=$(mktemp)
            report=$(mktemp)
            "${runner[@]}" pytest -m "$marker" --collect-only -q > "$collection"
            python ../tools/ci/pytest_shard.py \
              --shard "${{ matrix.shard }}" \
              --shard-count "${{ strategy.job-total }}" \
              < "$collection" > "$selected_file"
            mapfile -t selected < "$selected_file"
            expected="${#selected[@]}"
            if [ "$expected" -eq 0 ]; then
              echo "Core-only $layer shard ${{ matrix.shard }}/${{ strategy.job-total }} selected no tests."
              exit 1
            fi
            echo "Core-only $layer shard ${{ matrix.shard }}/${{ strategy.job-total }} selected $expected tests."
            "${runner[@]}" pytest -m "$marker" -q --durations=20 \
              --junitxml="$report" "${selected[@]}" || status=1
            uv run --frozen python - "$report" "$expected" "$layer" <<'PY' || status=1
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          expected = int(sys.argv[2])
          layer = sys.argv[3]
          testcases = root.findall(".//testcase")
          unexpected = [
              case.get("name")
              for case in testcases
              if (skip := case.find("skipped")) is not None
              and "Core-only configuration" not in (skip.get("message") or "")
          ]
          if len(testcases) != expected:
              raise SystemExit(
                  f"Expected {expected} Core-only {layer} tests, but JUnit contains {len(testcases)}."
              )
          if layer == "integration" and unexpected:
              raise SystemExit(
                  f"{len(unexpected)} Core-only integration test(s) were skipped for another "
                  "reason - is the database unavailable?"
              )
          PY
          done
          exit "$status"

  backend-core-only:
    name: Backend Core-only
    needs: [changes, backend_core_only_shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Core-only shards
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          CORE_ONLY_REQUIRED: ${{ needs.changes.outputs.backend_integration }}
          SHARDS_RESULT: ${{ needs.backend_core_only_shards.result }}
        run: |
          if [ "$CHANGE_RESULT" != "success" ]; then
            echo "Change Detection did not succeed: $CHANGE_RESULT"
            exit 1
          fi
          if [ "$CORE_ONLY_REQUIRED" != "true" ]; then
            echo "The Core-only backend suite is not required for this change set."
            exit 0
          fi
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "One or more Backend Core-only shards did not succeed: $SHARDS_RESULT"
            exit 1
          fi
          echo "All Backend Core-only shards succeeded."

  pro_extraction_dry_run:
    name: Pro extraction dry run
    needs: changes
    if: needs.changes.outputs.backend_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Decision 0017, Phase 2 (#2182): backend/pro installs from a clean copy on
    # top of a Core wheel built from this checkout, and its tests pass there.
    # Nothing is published; no other repository is involved.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eimir
          POSTGRES_PASSWORD: eimir
          POSTGRES_DB: eimir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eimir -d eimir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      EIMIR_ENVIRONMENT: test
      EIMIR_TEST_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pinned uv
        run: python -m pip install "uv==$UV_VERSION"

      # Decision 0019 (#2183): the Core comes from the allow-listed export tree
      # and Pro from the eimir-pro export tree, the way the private repository
      # will pin a public eimir-core revision.
      - name: Export the public Core tree and the private Pro tree
        run: |
          python tools/cutover/core_export.py export --rev HEAD \
            --out "$RUNNER_TEMP/core-tree" --manifest "$RUNNER_TEMP/core-manifest.json"
          python tools/cutover/core_export.py --allowlist tools/cutover/pro-allowlist.toml export --rev HEAD \
            --out "$RUNNER_TEMP/pro-tree" --manifest "$RUNNER_TEMP/pro-manifest.json"

      - name: Pro tests from the Pro tree on top of the exported Core wheel
        env:
          EIMIR_CORE_ROOT: ${{ runner.temp }}/core-tree
          EIMIR_PRO_ROOT: ${{ runner.temp }}/pro-tree
        run: tools/ci/pro_extraction_dry_run.sh -m ""

  core_export:
    name: Core Export Dry Run
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Decision 0019 (#2183): every pull request proves that the allow-listed
    # public eimir-core tree is clean (coverage, no plugin import, contract,
    # licence, no operator runner, secret scan), that the private eimir-pro
    # tree is clean, that both together split every tracked file, and that a
    # single-commit snapshot can be made from each. The snapshots stay in the
    # runner; nothing is pushed anywhere.
    permissions:
      contents: read
    env:
      # The pinned image of the Secret Scan job.
      EIMIR_CUTOVER_GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pinned uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Export tool tests (including the negative gates)
        run: python tools/cutover/test_core_export.py

      - name: Export both trees, gates and local snapshots
        run: |
          python tools/cutover/core_export.py dry-run --rev HEAD --with-pro \
            --work "$RUNNER_TEMP/core-export"

      - name: Report
        if: always()
        run: |
          for report in "$RUNNER_TEMP/core-export/report/report.md" "$RUNNER_TEMP/core-export/pro-report/report.md"; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done

  core_export_backend:
    name: Core Export Backend
    needs: changes
    if: needs.changes.outputs.backend_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Decision 0019 (#2183): the backend of the export tree installs and starts
    # without the plugin distributions, builds a Core wheel without plugin
    # files, passes the Core-only unit lane and migrates a fresh database. The
    # Core-only integration lane runs on the checkout (Backend Core-only); the
    # exported backend sources are byte-identical to it (coverage gate).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eimir
          POSTGRES_PASSWORD: eimir
          POSTGRES_DB: eimir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eimir -d eimir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EIMIR_TEST_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Pinned uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Export the public Core tree
        run: |
          python tools/cutover/core_export.py export --rev HEAD \
            --out "$RUNNER_TEMP/core-tree" --manifest "$RUNNER_TEMP/core-manifest.json"

      - name: Core-only install, start, wheel, unit lane and migrations
        run: |
          python tools/cutover/core_export.py check-backend \
            --tree "$RUNNER_TEMP/core-tree" --manifest "$RUNNER_TEMP/core-manifest.json" \
            --work "$RUNNER_TEMP/core-work"

  self-hosted:
    name: Self-Hosted Start
    needs: changes
    if: needs.changes.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    # The failure from #110 passed every gate because CI only parsed the Compose
    # file and ran Alembic under EIMIR_ENVIRONMENT=test. No gate executed the
    # documented startup path. This job follows docs/SELF-HOSTING.md exactly.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the documented first startup
        # Follow the guide: copy, replace the password, build local Development
        # images, and then start the single canonical Compose topology. The test
        # value is a CI-only value and not a secret.
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-for-the-test-run/' .env
          docker compose config --quiet
          python3 scripts/build_self_hosted_source.py --env-file .env

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Migration completed
        run: |
          status=$(docker compose ps -a --format json migrate | jq -r '.ExitCode')
          if [ "$status" != "0" ]; then
            echo "migrate did not exit cleanly (ExitCode $status):"
            docker compose logs migrate
            exit 1
          fi

      - name: Health checks through published ports
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -Fq "<title>eimir."
          web/scripts/check_csp_header.sh http://127.0.0.1:8080/

      - name: CSP origins are narrowly and fail-closed configurable
        run: |
          rendered=$(docker compose run --rm --no-deps \
            -e EIMIR_WEB_CSP_CONNECT_ORIGINS="https://api.example.test https://s3.example.test:9443" \
            web nginx -T 2>&1)
          printf '%s\n' "$rendered" \
            | grep -Fq "connect-src 'self' https://tiles.openfreemap.org https://api.example.test https://s3.example.test:9443;"

          set +e
          docker compose run --rm --no-deps \
            -e EIMIR_WEB_CSP_CONNECT_ORIGINS="https://example.test; add_header X-Injected true" \
            web nginx -t >/tmp/invalid-csp-origin.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "The Web container accepted an injectable CSP origin."
            exit 1
          fi
          grep -Fq "does not contain a valid exact HTTP(S) origin" /tmp/invalid-csp-origin.log

      - name: No runtime service failed on configuration
        # A missing Settings value exits the process immediately. With
        # restart: unless-stopped, this soon looks like a restart loop instead of
        # a clear failure.
        run: |
          for service in api worker web; do
            status=$(docker compose ps --format json "$service" | jq -r '.State')
            if [ "$status" != "running" ]; then
              echo "$service is not running ($status):"
              docker compose logs "$service"
              exit 1
            fi
          done
          if docker compose logs api worker | grep -q "validation error for Settings"; then
            echo "A service logged a Settings error:"
            docker compose logs api worker
            exit 1
          fi

      - name: Migration is repeatable
        run: |
          docker compose run --rm migrate
          echo "Second run against the existing schema succeeded"

      - name: Production continues to reject unsafe configuration
        # Test operation is the baseline, not an excuse. This check ensures that
        # production invariants remain unchanged; otherwise weakening them would
        # be the easiest path to green CI.
        run: |
          set +e
          for unsafe_setting in "EIMIR_MAIL_TRANSPORT=log" "EIMIR_PUBLIC_BASE_URL=http://insecure.invalid" "EIMIR_CURSOR_SIGNING_KEY="; do
            output=$(docker compose run --rm --no-deps \
              -e EIMIR_ENVIRONMENT=production \
              -e EIMIR_ENCRYPTION_AT_REST=disabled \
              -e EIMIR_CURSOR_SIGNING_KEY=ci-test-value-with-at-least-32-characters \
              -e EIMIR_MAIL_TRANSPORT=smtp \
              -e EIMIR_PUBLIC_BASE_URL=https://ci.invalid \
              -e "$unsafe_setting" \
              api python -c "from eimir.config import Settings; Settings()" 2>&1)
            if [ $? -eq 0 ]; then
              echo "Production accepted an unsafe configuration: $unsafe_setting"
              exit 1
            fi
            echo "Rejected as expected: $unsafe_setting"
          done
          set -e

      - name: Production without a mail server is valid
        # SMTP access is not a startup requirement (ADR 0002). Only "log" is
        # forbidden because it writes one-time tokens to logs.
        run: |
          docker compose run --rm --no-deps \
            -e EIMIR_ENVIRONMENT=production \
            -e EIMIR_ENCRYPTION_AT_REST=disabled \
            -e EIMIR_CURSOR_SIGNING_KEY=ci-test-value-with-at-least-32-characters \
            -e EIMIR_MAIL_TRANSPORT=none \
            -e EIMIR_PUBLIC_BASE_URL=https://ci.invalid \
            api python -c "from eimir.config import Settings; Settings()"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v

  api-clients:
    name: API Clients
    needs: changes
    if: needs.changes.outputs.api_clients == 'true'
    runs-on: ubuntu-latest
    # The contract is the single source of truth for the canonical Web client,
    # which the Capacitor Android wrapper packages unchanged (ADR 0011).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generated client code matches the contract
        run: tools/openapi/generate.sh --check-web

      - name: The TypeScript client has no runtime dependency
        # The generator uses `typescript-fetch` so no HTTP package enters the
        # Web client. This check preserves that boundary: a configuration change
        # could otherwise add a dependency that surfaces only in the Web project.
        run: |
          if find web/src/api/generated -name package.json | grep -q .; then
            echo "The generated TypeScript client includes a package.json."
            exit 1
          fi
          external_imports=$(grep -rhoE "from '[^.][^']*'" web/src/api/generated || true)
          if [ -n "$external_imports" ]; then
            echo "The generated TypeScript client imports external packages:"
            echo "$external_imports" | sort -u
            exit 1
          fi

  supply-chain:
    name: Supply Chain
    needs: changes
    if: needs.changes.outputs.supply_chain == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Supply Chain subscopes
        env:
          BACKEND_REQUIRED: ${{ needs.changes.outputs.supply_chain_backend }}
          WEB_REQUIRED: ${{ needs.changes.outputs.supply_chain_web }}
        run: |
          if [ "$BACKEND_REQUIRED" != "true" ] && [ "$WEB_REQUIRED" != "true" ]; then
            echo "Supply Chain was enabled without an internal build surface."
            exit 1
          fi
          echo "Backend Supply Chain required: $BACKEND_REQUIRED"
          echo "Web Supply Chain required: $WEB_REQUIRED"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.supply_chain_backend == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install exact uv version
        if: needs.changes.outputs.supply_chain_backend == 'true'
        run: python -m pip install "uv==$UV_VERSION"

      - name: Lockfile is current
        if: needs.changes.outputs.supply_chain_backend == 'true'
        run: uv lock --check

      - name: Dependency and vulnerability scan
        if: needs.changes.outputs.supply_chain_backend == 'true'
        # Policy: every known OSV finding or adverse package status fails the
        # job. Exceptions must be explicit, justified, and time-limited in
        # pyproject.toml; none currently exist.
        run: uv audit --preview --frozen

      - name: Dependency inventory
        if: needs.changes.outputs.supply_chain_backend == 'true'
        run: |
          uv sync --frozen --all-packages
          uv run --frozen python scripts/check_dependency_inventory.py ../docs/DEPENDENCIES.md

      - name: Build backend wheel without cache
        if: needs.changes.outputs.supply_chain_backend_build == 'true'
        run: uv build --no-cache --wheel --out-dir /tmp/eimir-dist

      - name: Core wheel carries no Pro code
        if: needs.changes.outputs.supply_chain_backend_build == 'true'
        # Decision 0017, Phase 2 (#2182): the Core distribution must not ship
        # the Pro plugin, its object or its editorial data. The Core export
        # (tools/cutover) runs the same check on the wheel of the export tree.
        run: python ../tools/ci/check_core_wheel.py /tmp/eimir-dist

      - name: Build backend production container from scratch
        if: needs.changes.outputs.supply_chain_backend_build == 'true'
        run: docker build --pull --no-cache --tag eimir-backend:ci .

      - name: Core image without Pro, Pro image with it
        if: needs.changes.outputs.supply_chain_backend_build == 'true'
        # The default target is the image with the Pro plugin; the `core`
        # stage is the Core alone (Decision 0017, Phase 2, #2182).
        run: |
          docker build --tag eimir-backend:core --target core .
          docker run --rm --entrypoint python eimir-backend:core -c "
          import importlib.util, os
          from eimir.plugins.loader import loaded_plugins
          assert not os.path.exists('/app/pro/src')
          assert importlib.util.find_spec('eimir_pro') is None
          assert importlib.util.find_spec('eimir_admin') is None
          assert not os.path.exists('/app/admin/src')
          assert loaded_plugins().names == ()
          print('Core image: Core only.')
          "
          docker run --rm --entrypoint python eimir-backend:ci -c "
          from eimir.plugins.loader import loaded_plugins
          assert loaded_plugins().names == ('pro',)
          print('Pro image: Core with the Pro plugin.')
          "
          # The operator plugin ships in the same image but is opt-in: it loads
          # when named and carries its migration chain as package data (#2189).
          docker run --rm --env EIMIR_PLUGINS=pro,admin --entrypoint python eimir-backend:ci -c "
          import pathlib
          import eimir_admin
          from eimir.plugins.loader import loaded_plugins
          assert loaded_plugins().names == ('pro', 'admin'), loaded_plugins().names
          versions = pathlib.Path(eimir_admin.__file__).parent / 'alembic' / 'versions'
          assert list(versions.glob('0001_*.py')), versions
          print('Pro image: operator plugin loads and carries its migration.')
          "

      - name: Build Web production container from scratch
        if: needs.changes.outputs.supply_chain_web_build == 'true'
        run: docker build --pull --no-cache --tag eimir-web:ci ../web

  secrets:
    name: Secret Scan
    # Forks and manually dispatched regressions keep the GitHub-hosted runner.
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          vars.EIMIR_PR_RUNNER != 'github-hosted' &&
          'eimir-kvm-pr' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run gitleaks directly instead of through the action. The action scans
      # <previous commit>..HEAD and fails on the first push because the first
      # commit has no predecessor. The direct invocation scans the complete
      # history, which is the appropriate scope for a secret scan.
      #
      # --log-opts="HEAD" pins that history to the checked-out ref's own
      # ancestry. Without it, gitleaks' git log defaults to --all, which
      # walks every ref this fetch-depth: 0 checkout knows about — including
      # unrelated, unmerged branches that happen to share this remote. A
      # false-positive-triggering string on one such branch then fails
      # Secret Scan for every other open PR, with no relation to that PR's
      # own content.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            detect --source . --log-opts="HEAD" --redact --verbose --exit-code 1

  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required documents are present
        run: |
          for file in PROVENANCE.md docs/DEPENDENCIES.md \
                       docs/SECURITY.md docs/PRIVACY-MODEL.md \
                       specification/PRODUCT-SPEC.md LICENSE \
                       COMMERCIAL-LICENSE.md CONTRIBUTING.md CLA.md \
                       TRADEMARKS.md; do
            test -f "$file" || { echo "missing: $file"; exit 1; }
          done
      - name: Licensing decision is consistent
        # LICENSE is mandatory since the explicit licensing decision. CI ensures
        # that the license, provenance, and commercial policy do not accidentally
        # regress to the earlier open state.
        run: |
          grep -Fq "# PolyForm Noncommercial License 1.0.0" LICENSE
          grep -Fq "PolyForm Noncommercial License 1.0.0" PROVENANCE.md
          grep -Fq "Commercial use requires a separate commercial license" COMMERCIAL-LICENSE.md
