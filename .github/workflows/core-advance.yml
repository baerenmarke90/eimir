name: Core Advance

# Decision 0019, runbook D2: the private Pro repository follows the public Core
# repository's main branch for the private test channel. About every 30 minutes
# this workflow compares Core main with the Core revision the channel selects;
# for a newer one it runs the Pro tests against exactly that Core revision and,
# only when they pass, dispatches the publisher with both identities. The
# publisher rechecks the pair through the Actions API before it builds.
#
# - A failed test or publication is reported once in the issue "Core advance
#   blocked" and fails this run; the revision is not tested again until that
#   issue is closed or the workflow is dispatched with retest.
# - Nothing here needs a secret in the Core repository. GITHUB_TOKEN of this
#   repository reads the public Core; only a private Core (the rehearsal) needs
#   EIMIR_CORE_READ_TOKEN here, a fine-grained token with Contents read on that
#   one repository.
# - Without the variable EIMIR_CORE_REPOSITORY (the monorepo) every job is
#   skipped at no runner cost.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      retest:
        description: Test the current Core main again even if it is reported as blocked.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One advance at a time; a newer schedule waits instead of racing the pin.
  group: core-advance
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.15.2"
  UV_VERSION: "0.12.15"

jobs:
  plan:
    name: Compare Core main with the selected Core
    if: >-
      vars.EIMIR_CORE_REPOSITORY != '' &&
      vars.EIMIR_TEST_CHANNEL_ENABLED == 'true' &&
      github.repository == vars.EIMIR_TEST_CHANNEL_REPOSITORY &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      core_revision: ${{ steps.plan.outputs.core_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether a Core revision needs the Pro tests
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EIMIR_TEST_CHANNEL_REPOSITORY: ${{ vars.EIMIR_TEST_CHANNEL_REPOSITORY }}
          EIMIR_TEST_CHANNEL_INSTANCE: ${{ vars.EIMIR_TEST_CHANNEL_INSTANCE }}
          EIMIR_CORE_REPOSITORY: ${{ vars.EIMIR_CORE_REPOSITORY }}
          EIMIR_CORE_READ_TOKEN: ${{ secrets.EIMIR_CORE_READ_TOKEN }}
          EIMIR_CORE_ADVANCE_RETEST: ${{ inputs.retest == true }}
        run: >-
          python3 scripts/test_deployment_channel.py advance-plan
          --revision "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  pro-tests:
    # The publisher finds the tested Core revision by this exact name.
    name: Pro tests against Core ${{ needs.plan.outputs.core_revision }}
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eimir
          POSTGRES_PASSWORD: eimir
          POSTGRES_DB: eimir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eimir -d eimir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EIMIR_ENVIRONMENT: test
      EIMIR_TEST_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout the Core revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.EIMIR_CORE_REPOSITORY }}
          ref: ${{ needs.plan.outputs.core_revision }}
          path: .eimir-core-source
          persist-credentials: false
          token: ${{ secrets.EIMIR_CORE_READ_TOKEN || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pinned uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Pro tests from a clean copy on top of the Core wheel of that revision
        env:
          EIMIR_CORE_ROOT: ${{ github.workspace }}/.eimir-core-source
          CORE_REVISION: ${{ needs.plan.outputs.core_revision }}
        run: |
          set -euo pipefail
          test "$(git -C "$EIMIR_CORE_ROOT" rev-parse HEAD)" = "$CORE_REVISION"
          # The extraction dry run of #2182: Pro from this checkout, Core wheel,
          # Core test support and demo assets from the Core revision under test.
          bash "$EIMIR_CORE_ROOT/tools/ci/pro_extraction_dry_run.sh" -m ""

  report:
    name: Advance or report Core ${{ needs.plan.outputs.core_revision }}
    needs: [plan, pro-tests]
    # A cancelled run reports nothing; the next schedule tests the revision again.
    if: ${{ !cancelled() && needs.plan.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch the publisher after green Pro tests, or report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          EIMIR_TEST_CHANNEL_REPOSITORY: ${{ vars.EIMIR_TEST_CHANNEL_REPOSITORY }}
          EIMIR_TEST_CHANNEL_INSTANCE: ${{ vars.EIMIR_TEST_CHANNEL_INSTANCE }}
          EIMIR_CORE_REPOSITORY: ${{ vars.EIMIR_CORE_REPOSITORY }}
          CORE_REVISION: ${{ needs.plan.outputs.core_revision }}
          TESTS_RESULT: ${{ needs.pro-tests.result }}
        run: >-
          python3 scripts/test_deployment_channel.py advance-report
          --revision "$GITHUB_SHA" --core-revision "$CORE_REVISION"
          --tests-result "$TESTS_RESULT"
