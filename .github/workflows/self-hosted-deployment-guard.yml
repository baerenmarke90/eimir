name: Self-Hosted Deployment Guard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    outputs:
      deployment_guard: ${{ steps.scope.outputs.deployment_guard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test change-scope filter logic
        run: python3 tools/ci/test_change_scope.py

      - name: Determine relevant change scopes
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              ;;
            *)
              echo "deployment_guard=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled/manual run: Deployment Guard remains fully active."
              exit 0
              ;;
          esac

          if [ -z "$base_sha" ] || [ -z "$head_sha" ] \
            || [[ "$base_sha" =~ ^0+$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            echo "deployment_guard=true" >> "$GITHUB_OUTPUT"
            echo "Change range unavailable; failing closed to Deployment Guard."
            exit 0
          fi

          git diff --name-only --no-renames "$base_sha" "$head_sha" > /tmp/changed-files.txt
          echo "Changed files:"
          cat /tmp/changed-files.txt
          python3 tools/ci/change_scope.py /tmp/changed-files.txt >> "$GITHUB_OUTPUT"

  upgrade-rehearsal:
    name: Install, upgrade, rollback and Demo rehearsal
    needs: changes
    if: needs.changes.outputs.deployment_guard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build local source images
        run: |
          set -euo pipefail
          cp .env.example .env-rehearsal
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-for-the-test-run/' .env-rehearsal
          python3 scripts/build_self_hosted_source.py --env-file .env-rehearsal

      - name: Rehearse install, upgrade, refused rollback and Demo lifecycle (#827)
        run: python3 scripts/self_hosted_upgrade_rehearsal.py

      - name: Remove leftover rehearsal resources
        if: always()
        run: |
          docker ps -aq --filter name=eimir-rehearsal | xargs -r docker rm -f
          docker volume ls -q --filter name=eimir-rehearsal | xargs -r docker volume rm -f
          docker network ls -q --filter name=eimir-rehearsal | xargs -r docker network rm

  deployment-guard:
    name: Network and Port Guard
    needs: changes
    if: needs.changes.outputs.deployment_guard == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare and validate canonical Compose profiles
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-for-the-test-run/' .env
          sed -i 's/^API_PORT=.*/API_PORT=18081/' .env
          sed -i 's/^WEB_PORT=.*/WEB_PORT=18082/' .env
          sed -i 's|^EIMIR_PUBLIC_BASE_URL=.*|EIMIR_PUBLIC_BASE_URL=http://localhost:18082|' .env
          printf '%s\n' 'COMPOSE_PROJECT_NAME=eimir-verified-ci' >> .env

          docker compose --profile self-hosted --env-file .env config --quiet
          docker compose --profile self-hosted \
            --env-file deploy/self-hosted-release.env.example config --quiet
          docker compose --profile cloud --env-file deploy/cloud-managed.env.example config --quiet
          docker compose --profile dev-db config --quiet

      - name: Released Self-Hosted is image-only (#827)
        run: |
          set -euo pipefail
          docker compose --profile self-hosted \
            --env-file deploy/self-hosted-release.env.example config --format json \
            > /tmp/compose-self-hosted-release.json

          jq -e '
            (.services | has("demo-init") | not) and
            (.services.api.image == "ghcr.io/baerenmarke90/eimir-backend:v0.1.0") and
            (.services.worker.image == .services.api.image) and
            (.services.migrate.image == .services.api.image) and
            (.services.web.image == "ghcr.io/baerenmarke90/eimir-web:v0.1.0") and
            (.services.api.pull_policy == "always") and
            (.services.web.pull_policy == "always") and
            (.services.api | has("build") | not) and
            (.services.worker | has("build") | not) and
            (.services.migrate | has("build") | not) and
            (.services.web | has("build") | not) and
            (.services.api.depends_on.migrate.condition == "service_completed_successfully") and
            (.services.worker.depends_on.migrate.condition == "service_completed_successfully")
          ' /tmp/compose-self-hosted-release.json

          EIMIR_SELF_HOSTED_BACKEND_IMAGE='ghcr.io/baerenmarke90/eimir-backend:v0.1.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
          EIMIR_SELF_HOSTED_WEB_IMAGE='ghcr.io/baerenmarke90/eimir-web:v0.1.0@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' \
          docker compose --profile self-hosted \
            --env-file deploy/self-hosted-release.env.example config --format json \
            > /tmp/compose-self-hosted-digest.json
          jq -e '
            (.services.api.image | contains("@sha256:")) and
            (.services.worker.image == .services.api.image) and
            (.services.migrate.image == .services.api.image) and
            (.services.web.image | contains("@sha256:"))
          ' /tmp/compose-self-hosted-digest.json

      - name: Deployment helper syntax and isolation contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/build_self_hosted_source.py \
            scripts/deployment_smoke.py \
            scripts/check_environment_isolation.py \
            scripts/check_runtime_environment.py \
            scripts/compose_checked.py \
            scripts/test_deployment_smoke.py \
            scripts/test_check_runtime_environment.py \
            scripts/test_compose_checked.py
          python3 -m unittest scripts.test_deployment_smoke
          python3 -m unittest scripts.test_check_runtime_environment
          python3 -m unittest scripts.test_compose_checked

          if python3 scripts/deployment_smoke.py \
            --base-url http://127.0.0.1:9 \
            --expected-revision main; then
            echo "Release smoke accepted a mutable ref as revision evidence."
            exit 1
          fi

          cat >/tmp/production.env <<'EOF'
          COMPOSE_PROJECT_NAME=eimir-production-ci
          COMPOSE_PROFILES=self-hosted
          EIMIR_ENVIRONMENT=production
          EIMIR_PUBLIC_BASE_URL=https://production.example.invalid
          POSTGRES_PASSWORD=production-only-ci-secret
          EIMIR_CURSOR_SIGNING_KEY=production-only-ci-cursor-signing-key-1234567890
          EIMIR_MEDIA_STORE=local
          EOF

          python3 scripts/check_environment_isolation.py \
            deploy/persistent-development.env.example /tmp/production.env

          cp /tmp/production.env /tmp/unsafe-production.env
          printf '%s\n' 'EIMIR_CURSOR_SIGNING_KEY=replace-with-development-only-signing-key-at-least-32-chars' \
            >> /tmp/unsafe-production.env
          if python3 scripts/check_environment_isolation.py \
            deploy/persistent-development.env.example /tmp/unsafe-production.env; then
            echo "Environment isolation accepted a reused signing key."
            exit 1
          fi

      - name: Cloud/Managed deployment profile contract (#521)
        run: python3 tools/ci/test_cloud_managed_topology.py -v

      - name: Self-Hosted runtime topology contract (#827)
        run: |
          set -euo pipefail
          python3 tools/ci/test_self_hosted_topology.py -v
          python3 -m unittest scripts.test_self_hosted_release scripts.test_self_hosted_upgrade_rehearsal

      - name: Verified checkout revision contract
        run: |
          set -euo pipefail
          revision=$(python3 scripts/compose_checked.py --print-revision)
          short_revision=${revision:0:12}
          test "$revision" = "$(git rev-parse HEAD)"

          python3 scripts/compose_checked.py \
            --expected-revision "$revision" \
            config --format json > /tmp/compose-verified.json

          jq -e --arg backend "eimir-backend:verified-${short_revision}" \
                --arg web "eimir-web:verified-${short_revision}" '
            (.services | has("demo-init") | not) and
            (.services.api.image == $backend) and
            (.services.worker.image == $backend) and
            (.services.migrate.image == $backend) and
            (.services.web.image == $web) and
            (.services.api.pull_policy == "never") and
            (.services.web.pull_policy == "never") and
            (.services.api | has("build") | not) and
            (.services.web | has("build") | not)
          ' /tmp/compose-verified.json

          cp compose.yaml /tmp/compose-verified-source.yaml
          cleanup_hidden_compose_change() {
            cp /tmp/compose-verified-source.yaml compose.yaml
            git update-index --no-assume-unchanged compose.yaml
          }
          trap cleanup_hidden_compose_change EXIT
          git update-index --assume-unchanged compose.yaml
          sed -i 's/driver: bridge/driver: overlay/' compose.yaml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 scripts/compose_checked.py \
            --expected-revision "$revision" \
            config --format json > /tmp/compose-index-hidden.json
          jq -e '.networks.app.driver == "bridge"' /tmp/compose-index-hidden.json

          cleanup_hidden_compose_change
          trap - EXIT

          trap 'rm -f .eimir-dirty-check' EXIT
          touch .eimir-dirty-check
          if python3 scripts/compose_checked.py --print-revision; then
            echo "Verified Compose accepted a dirty checkout."
            exit 1
          fi
          rm -f .eimir-dirty-check
          trap - EXIT

          wrong_revision=0000000000000000000000000000000000000000
          if python3 scripts/compose_checked.py \
            --expected-revision "$wrong_revision" --print-revision; then
            echo "Verified Compose accepted the wrong expected revision."
            exit 1
          fi

      - name: Arcane remote source build uses local image boundary
        run: |
          set -euo pipefail
          cp .env .env-arcane
          cat >>.env-arcane <<'EOF'
          EIMIR_BACKEND_BUILD_CONTEXT=https://github.com/baerenmarke90/eimir.git#main:backend
          EIMIR_WEB_BUILD_CONTEXT=https://github.com/baerenmarke90/eimir.git#main:web
          EIMIR_BUILD_REVISION=main
          EIMIR_SELF_HOSTED_BACKEND_IMAGE=eimir-backend:source-arcane
          EIMIR_SELF_HOSTED_WEB_IMAGE=eimir-web:source-arcane
          EIMIR_SELF_HOSTED_PULL_POLICY=never
          EOF

          python3 scripts/build_self_hosted_source.py --env-file .env-arcane --print-plan \
            > /tmp/source-build-plan.json
          jq -e '
            (.revision == "main") and
            (.backendContext | startswith("https://github.com/baerenmarke90/eimir.git#main:backend")) and
            (.webContext | startswith("https://github.com/baerenmarke90/eimir.git#main:web")) and
            (.backendImage == "eimir-backend:source-arcane") and
            (.webImage == "eimir-web:source-arcane")
          ' /tmp/source-build-plan.json

      - name: Bind address is safe and explicitly configurable
        run: |
          set -euo pipefail

          docker compose --profile self-hosted --env-file .env config --format json > /tmp/compose-default.json
          jq -e '
            .services.api.ports[0].host_ip == "127.0.0.1" and
            .services.web.ports[0].host_ip == "127.0.0.1"
          ' /tmp/compose-default.json

          cp .env .env-bind
          sed -i 's/^EIMIR_BIND_IP=.*/EIMIR_BIND_IP=127.0.0.2/' .env-bind
          docker compose --profile self-hosted --env-file .env-bind config --format json > /tmp/compose-bind.json
          jq -e '
            .services.api.ports[0].host_ip == "127.0.0.2" and
            .services.web.ports[0].host_ip == "127.0.0.2"
          ' /tmp/compose-bind.json

      - name: Build local source images for integration checks
        run: python3 scripts/build_self_hosted_source.py --env-file .env

      - name: Occupied API port fails clearly
        run: |
          cp .env .env-conflict
          sed -i 's/^API_PORT=.*/API_PORT=18080/' .env-conflict

          python3 -m http.server 18080 --bind 0.0.0.0 >/tmp/occupied-api-port.log 2>&1 &
          blocker_pid=$!
          trap 'kill "$blocker_pid" 2>/dev/null || true; docker compose -p eimir-port-conflict --profile self-hosted --env-file .env-conflict down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          sleep 1

          set +e
          output=$(timeout 300 docker compose -p eimir-port-conflict --profile self-hosted --env-file .env-conflict up -d api 2>&1)
          status=$?
          set -e

          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "The stack accepted an occupied host port."
            exit 1
          fi

          api_id=$(docker compose -p eimir-port-conflict --profile self-hosted --env-file .env-conflict ps -aq api)
          if [ -n "$api_id" ]; then
            state=$(docker inspect "$api_id" --format '{{.State.Status}}')
            networks=$(docker inspect "$api_id" --format '{{len .NetworkSettings.Networks}}')
            echo "API after expected failed startup: state=$state networks=$networks"
            if [ "$state" = "running" ]; then
              echo "No running API container may remain after the port conflict."
              exit 1
            fi
          fi

          kill "$blocker_pid" 2>/dev/null || true
          docker compose -p eimir-port-conflict --profile self-hosted --env-file .env-conflict down -v --remove-orphans
          trap - EXIT

      - name: Start source-built Self-Hosted test stack
        run: docker compose --profile self-hosted --env-file .env up -d --wait --wait-timeout 300

      - name: Shared Compose network is active
        run: |
          for service in postgres api worker web; do
            id=$(docker compose --profile self-hosted --env-file .env ps -q "$service")
            if [ -z "$id" ]; then
              echo "$service has no running container."
              exit 1
            fi
            networks=$(docker inspect "$id" --format '{{len .NetworkSettings.Networks}}')
            echo "$service: $networks network(s)"
            if [ "$networks" -lt 1 ]; then
              echo "$service is not connected to a Docker network."
              exit 1
            fi
          done

          migrate_id=$(docker compose --profile self-hosted --env-file .env ps -aq migrate)
          if [ -z "$migrate_id" ]; then
            echo "migrate container is missing."
            exit 1
          fi
          migrate_networks=$(docker inspect "$migrate_id" --format '{{len .NetworkSettings.Networks}}')
          echo "migrate: $migrate_networks network(s)"
          if [ "$migrate_networks" -lt 1 ]; then
            echo "migrate is not connected to a Docker network."
            exit 1
          fi

      - name: API can reach postgres through Docker DNS
        run: |
          docker compose --profile self-hosted --env-file .env exec -T api python - <<'PY'
          import socket
          address = socket.gethostbyname("postgres")
          if not address:
              raise SystemExit("postgres was not resolved through Docker DNS")
          print(f"postgres -> {address}")
          PY

      - name: Readiness through published port
        run: |
          headers=$(mktemp)
          response=$(curl --fail --silent --show-error -D "$headers" http://127.0.0.1:18081/api/v1/health/ready)
          printf '%s\n' "$response"
          printf '%s\n' "$response" | jq -e '.status == "ok" and .database == "ok"'
          tr -d '\r' < "$headers" | grep -Fqi 'X-Eimir-Revision: unverified-local-checkout'

      - name: Web proof of concept through published port
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18082/healthz
          test "$(curl --fail --silent --show-error http://127.0.0.1:18082/.well-known/eimir-revision)" = "unverified-local-checkout"
          curl --fail --silent --show-error http://127.0.0.1:18082/ | grep -Fq "<title>eimir."

      - name: Deployment smoke helper against running stack
        run: |
          python3 scripts/deployment_smoke.py \
            --base-url http://127.0.0.1:18082 \
            --allow-unverified-local

      - name: Runtime containers are healthy
        run: |
          for service in api web; do
            id=$(docker compose --profile self-hosted --env-file .env ps -q "$service")
            health=$(docker inspect "$id" --format '{{.State.Health.Status}}')
            test "$health" = "healthy" || {
              echo "$service health=$health"
              docker compose --profile self-hosted --env-file .env logs "$service"
              exit 1
            }
          done

      - name: Logs on failure
        if: failure()
        run: docker compose --profile self-hosted --env-file .env logs

      - name: Clean up
        if: always()
        run: docker compose --profile self-hosted --env-file .env down -v --remove-orphans
