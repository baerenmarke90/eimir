[project]
name = "eimir"
version = "0.1.0"
description = "eimir. — Application Core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0",
    "alembic>=1.19",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "uuid6>=2025.0.1",
    "argon2-cffi>=25.1",
    # Ausgehendes HTTP fuer OIDC: Discovery, JWKS und Token-Endpunkt.
    "httpx>=0.28",
    # ID-Token-Pruefung. Signaturverfahren selbst zu schreiben waere im
    # Auth-Pfad genau der falsche Ort fuer Eigenbau.
    "pyjwt[crypto]>=2.10",
    # Application-controlled encryption at rest (#797): AES-256-GCM only. No
    # cryptographic primitive is implemented in this repository. Already
    # present transitively through pyjwt[crypto]; declared because the
    # application now imports it directly.
    "cryptography>=46.0",
    # UnifiedPush uses RFC 8291 Web Push encryption and optional VAPID auth.
    # Protocol cryptography stays in the maintained Web Push library.
    "pywebpush>=2.3,<3",
    # WebAuthn: CBOR, COSE und Attestation von Hand zu lesen waere
    # Eigenbau an der empfindlichsten Stelle.
    "webauthn>=2.5",
    # Bildvalidierung, Metadaten-Entfernung und Thumbnails (M2-D14/D15).
    # Ein eigener Dekoder fuer JPEG/PNG/WebP waere Eigenbau an der
    # groessten Angriffsflaeche des Produkts.
    "pillow>=12.0",
    # HEIC/HEIF steht in der M2-D04-Allowlist und ist ohne libheif nicht
    # zu dekodieren. Registriert sich als Plugin in Pillow.
    "pillow-heif>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx2>=0.1",
    # Nur fuer den virtuellen Authenticator in den WebAuthn-Tests: er baut
    # attestationObject und COSE-Schluessel selbst, damit die Suite echte
    # Signaturen prueft statt aufgezeichneter Beispieldaten.
    "cbor2>=5.6",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.uv]
# The lockfile and installation behavior are part of the build. A different uv
# version may use another lockfile format or different resolution rules.
required-version = "==0.12.15"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: benoetigt eine erreichbare PostgreSQL-Instanz",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py312"
# 0001-0007 sind bereits angewandte historische Migrationen und werden nicht
# nachtraeglich nur fuer Stil umgeschrieben. Die Liste ist absichtlich exakt:
# jede neue Migration faellt automatisch unter Ruff. Siehe alembic/README.md.
extend-exclude = [
    "alembic/versions/0001_outbox_and_jobs_foundation.py",
    "alembic/versions/0002_identity_and_relationship.py",
    "alembic/versions/0003_auth_and_invitations.py",
    "alembic/versions/0004_instance_bootstrap.py",
    "alembic/versions/0005_auth_architecture.py",
    "alembic/versions/0006_refresh_token_family.py",
    "alembic/versions/0007_absolute_session_lifetime.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Ausdruecklich, nicht geraten: in der CI ist das Paket installiert und
# waere sonst Fremdcode, lokal liegt es unter src und waere eigener.
known-first-party = ["eimir", "tests", "scripts"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = []

[[tool.mypy.overrides]]
module = "uuid6.*"
ignore_missing_imports = true

# pillow-heif liefert keine py.typed-Markierung. Es wird nur einmal
# aufgerufen, um sich als Pillow-Plugin zu registrieren.
[[tool.mypy.overrides]]
module = "pillow_heif.*"
ignore_missing_imports = true
