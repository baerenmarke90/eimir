name: Media Video

on:
  # Pull requests run the restricted-codec acceptance only when the code it
  # exercises changes. Ordinary Backend changes are covered by the regular
  # Backend Integration suite, whose codec-dependent cases skip without the
  # pinned binaries. Every push to main still runs this workflow completely
  # and the immutable release publisher waits for that result.
  pull_request:
    paths:
      # Media storage, attachment, processing-job and API surfaces, plus the
      # exact security/database modules the media path imports. The model
      # registry and field-encryption tooling stay out: every feature edits them.
      - "backend/src/eimir/media/**"
      - "backend/src/eimir/attachments/**"
      - "backend/src/eimir/jobs/**"
      - "backend/src/eimir/heart_moments/**"
      - "backend/src/eimir/memories/models.py"
      - "backend/src/eimir/memories/service.py"
      - "backend/src/eimir/security/errors.py"
      - "backend/src/eimir/security/keyring.py"
      - "backend/src/eimir/security/runtime.py"
      - "backend/src/eimir/security/lifecycle.py"
      - "backend/src/eimir/db/base.py"
      - "backend/src/eimir/db/locks.py"
      - "backend/src/eimir/db/mixins.py"
      - "backend/src/eimir/db/protected_payload.py"
      - "backend/src/eimir/db/session.py"
      - "backend/src/eimir/api/v1/attachments.py"
      - "backend/src/eimir/api/v1/memories.py"
      - "backend/src/eimir/api/v1/heart_moments.py"
      - "backend/src/eimir/api/v1/video.py"
      - "backend/src/eimir/config.py"
      - "backend/src/eimir/main.py"
      # Build inputs of the backend and optional media images.
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "backend/.python-version"
      - "backend/Dockerfile"
      - "backend/Dockerfile.media"
      # The acceptance tests, their fixtures and the test support they import.
      - "backend/tests/support/video.py"
      - "backend/tests/support/s3_reads.py"
      - "backend/tests/fixtures/media/**"
      - "backend/tests/media/**"
      - "backend/tests/unit/test_video_*.py"
      - "backend/tests/unit/test_audio_*.py"
      - "backend/tests/unit/test_media_*.py"
      - "backend/tests/unit/test_codec_*.py"
      - "backend/tests/integration/test_video_*.py"
      - "backend/tests/integration/test_heart_voice_notes.py"
      - "backend/tests/integration/test_heart_moments.py"
      - "tools/media/**"
      - "compose.yaml"
      - "web/e2e/tests/video-attachments.spec.ts"
      - "web/src/components/Video*.tsx"
      - "web/src/components/MediaGallery*"
      - "web/src/client/video*"
      - "web/src/client/compressVideo.ts"
      - "web/src/client/backgroundVideoUploads.ts"
      - "web/src/client/memoryAttachmentDraft.ts"
      - ".github/workflows/media-video.yml"
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  processing:
    name: Restricted codec and video lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: eimir
          POSTGRES_PASSWORD: eimir
          POSTGRES_DB: eimir_test
        options: >-
          --health-cmd "pg_isready -U eimir -d eimir_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EIMIR_ENVIRONMENT: test
      EIMIR_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
      EIMIR_TEST_DATABASE_URL: postgresql+psycopg://eimir:eimir@localhost:5432/eimir_test
      EIMIR_TEST_FFMPEG: /tmp/eimir-codecs/bin/ffmpeg
      EIMIR_TEST_FFPROBE: /tmp/eimir-codecs/bin/ffprobe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - name: Build the pinned restricted codec
        run: |
          sudo apt-get update
          # The system encoder generates synthetic test input only. Acceptance
          # still uses the separately built, pinned and patched restricted codec.
          sudo apt-get install -y --no-install-recommends nasm autoconf automake libtool pkg-config ffmpeg
          python3 tools/media/generate-video-quality-fixtures.py backend/tests/fixtures/media
          bash tools/media/build-video-dependencies.sh /tmp/eimir-codec-dependencies /tmp/eimir-codecs
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/FFmpeg/FFmpeg/archive/946fcce07b6dcd0331c8cc609192aeff5e1924f8.tar.gz \
            --output /tmp/ffmpeg.tar.gz
          echo "0aa2b1de2a5698b20a23e93d539a9a8e82ca0117496c5bdf05d198805f42bb3b  /tmp/ffmpeg.tar.gz" | sha256sum --check
          mkdir /tmp/ffmpeg-source
          tar -xzf /tmp/ffmpeg.tar.gz --strip-components=1 -C /tmp/ffmpeg-source
          bash tools/media/build-ffmpeg.sh /tmp/ffmpeg-source /tmp/eimir-codecs
      - name: Verify the recorded build inventory against the real build
        run: python3 tools/media/build-inventory.py /tmp/ffmpeg-source --check tools/media/built-sources.txt
      - name: Locked dependencies and migrations
        working-directory: backend
        run: |
          python -m pip install "uv==0.12.15"
          uv sync --locked
          uv run --frozen alembic upgrade head
      - name: Real codec, ranges, streaming and database lifecycle
        working-directory: backend
        run: |
          uv run --frozen pytest -q --junitxml=/tmp/video-results.xml \
            tests/unit/test_video_processing.py tests/unit/test_audio_processing.py tests/unit/test_media_content.py \
            tests/unit/test_media_streaming.py tests/unit/test_codec_advisories.py \
            tests/integration/test_video_playback.py \
            tests/integration/test_video_lifecycle.py tests/integration/test_heart_voice_notes.py \
            tests/media/acceptance_video_lifecycle.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("/tmp/video-results.xml").findall(".//testcase")
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Video acceptance must execute without skips.")
          PY

  image:
    name: Optional media image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the same-revision backend and optional derivative
        run: |
          docker build -t eimir-backend:video-ci --build-arg EIMIR_BUILD_REVISION="$GITHUB_SHA" backend
          docker build -f backend/Dockerfile.media --build-arg EIMIR_BACKEND_IMAGE=eimir-backend:video-ci -t eimir-media:video-ci .
          docker run --rm --entrypoint /opt/eimir-media/bin/ffmpeg eimir-media:video-ci -version
          docker run --rm --entrypoint /opt/eimir-media/bin/ffprobe eimir-media:video-ci -version
          docker compose --env-file .env.example --profile self-hosted --profile video config --quiet

  browser:
    name: Video browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: node:24.21.0-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locked Web and browser dependencies
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web/e2e ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned browser
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Video journeys without automatic retries
        working-directory: web/e2e
        run: |
          npm run test:inventory
          ./node_modules/.bin/playwright test tests/video-attachments.spec.ts --workers=1 --retries=0
      - name: Visual evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: video-browser-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: web/e2e/test-results/
          if-no-files-found: error
          retention-days: 7
