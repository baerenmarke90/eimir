<div id="momente-kompakt" class="viz-dotted-background">
  <div class="moment-phone">
    <header class="moment-top">
      <div class="moment-back"><i data-lucide="chevron-left" aria-hidden="true"></i><span>Momente</span></div>
      <i data-lucide="ellipsis" aria-hidden="true"></i>
    </header>
    <main class="moment-content">
      <h1>27. Oktober 2026</h1>
      <div class="moment-photo-wrap">
        <button class="moment-photo cursor-interaction" type="button" aria-label="Foto anzeigen. Gedrückt halten für Reaktionen." aria-pressed="false">
          <span class="moment-scene" aria-hidden="true">
            <span class="moment-sun"></span><span class="moment-hill moment-hill-back"></span><span class="moment-hill moment-hill-front"></span>
            <span class="moment-house"><span class="moment-roof"></span><span class="moment-window"></span><span class="moment-door"></span></span>
            <span class="moment-path"></span><span class="moment-tree moment-tree-left"></span><span class="moment-tree moment-tree-right"></span>
          </span>
          <span class="moment-veil" aria-hidden="true"></span>
          <span class="moment-privacy" aria-hidden="true"><i data-lucide="eye-off"></i></span>
        </button>
        <div class="moment-picker" role="group" aria-label="Reaktion auswählen" hidden>
          <button type="button" data-reaction="❤️" aria-label="Liebe" class="cursor-interaction">❤️</button>
          <button type="button" data-reaction="😂" aria-label="Lachen" class="cursor-interaction">😂</button>
          <button type="button" data-reaction="😮" aria-label="Staunen" class="cursor-interaction">😮</button>
          <button type="button" data-reaction="😢" aria-label="Traurig" class="cursor-interaction">😢</button>
          <button type="button" data-reaction="🙌" aria-label="Feiern" class="cursor-interaction">🙌</button>
          <button type="button" data-reaction="👍" aria-label="Gefällt mir" class="cursor-interaction">👍</button>
        </div>
        <button class="moment-react cursor-interaction" type="button" aria-label="Auf dieses Foto reagieren" aria-expanded="false"><i data-lucide="smile-plus" aria-hidden="true"></i></button>
      </div>
      <div class="moment-reaction-row" hidden>
        <button class="moment-reaction-chip cursor-interaction" type="button" aria-label="Deine Reaktion entfernen" hidden></button>
      </div>
      <div class="moment-location">
        <i data-lucide="map-pin" aria-hidden="true"></i>
        <div><strong>Beispielort</strong><span>Musterstraße 1</span><span>12345 Beispielort</span><span class="moment-credit">© OpenStreetMap</span></div>
      </div>
      <div class="moment-comment"><i data-lucide="message-circle" aria-hidden="true"></i><span>Kommentieren</span></div>
    </main>
    <nav class="moment-nav" aria-label="Hauptnavigation">
      <div><i data-lucide="blend" aria-hidden="true"></i><span>Wir</span></div>
      <div class="moment-nav-active"><i data-lucide="heart" aria-hidden="true"></i><span>Momente</span></div>
      <div class="moment-nav-add"><i data-lucide="plus" aria-hidden="true"></i></div>
      <div><i data-lucide="calendar-days" aria-hidden="true"></i><span>Planen</span></div>
      <div><i data-lucide="grid-3x3" aria-hidden="true"></i><span>Mehr</span></div>
    </nav>
    <span class="moment-live" aria-live="polite"></span>
  </div>
</div>
<style>
  #momente-kompakt { padding:24px 12px; display:flex; justify-content:center; }
  #momente-kompakt .moment-phone { --m-bg:light-dark(#f7f8fc,#151a28); --m-paper:light-dark(#ffffff,#20283a); --m-text:light-dark(#202b45,#e9ecf6); --m-muted:light-dark(#64718a,#acb7d0); --m-line:light-dark(#e5e9f2,#313d54); --m-blue:light-dark(#395fc0,#a6bdff); --m-soft:light-dark(#e9eefc,#2d3b5d); --m-pink:light-dark(#ad528d,#ef9bcc); color-scheme:light dark; background:var(--m-bg); color:var(--m-text); border:1px solid var(--m-line); border-radius:30px; box-shadow:0 16px 45px light-dark(#253b6120,#00000040); width:390px; max-width:100%; overflow:hidden; font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; position:relative; }
  #momente-kompakt * { box-sizing:border-box; }
  #momente-kompakt button { font:inherit; -webkit-tap-highlight-color:transparent; color:inherit; }
  #momente-kompakt .moment-top { display:flex; justify-content:space-between; align-items:center; padding:20px 22px 8px 16px; color:var(--m-muted); }
  #momente-kompakt .moment-back { display:flex; align-items:center; gap:3px; color:var(--m-blue); }
  #momente-kompakt svg { width:21px; height:21px; stroke-width:1.7; flex-shrink:0; }
  #momente-kompakt .moment-content { padding:10px 18px 6px; }
  #momente-kompakt h1 { margin:0 0 20px; font:500 25px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:-.6px; }
  #momente-kompakt .moment-photo-wrap { position:relative; }
  #momente-kompakt .moment-photo { width:100%; display:block; aspect-ratio:1; border:0; padding:0; position:relative; border-radius:20px; overflow:hidden; background:#b8c8d4; isolation:isolate; touch-action:pan-y; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #momente-kompakt .moment-scene { position:absolute; inset:-12px; display:block; background:linear-gradient(#91b9d5,#e1d4ad 65%,#798b65); filter:blur(12px); transform:scale(1.045); transition:filter .18s ease; }
  #momente-kompakt .moment-sun { position:absolute; width:65px; height:65px; border-radius:50%; background:#f9e4b6; top:28px; right:45px; }
  #momente-kompakt .moment-hill { position:absolute; width:145%; height:65%; border-radius:50%; }
  #momente-kompakt .moment-hill-back { background:#809887; left:-20%; top:38%; transform:rotate(-14deg); }
  #momente-kompakt .moment-hill-front { background:#9a9e6d; left:-10%; top:68%; transform:rotate(18deg); }
  #momente-kompakt .moment-house { position:absolute; width:111px; height:85px; background:#ece0c2; left:32%; top:48%; box-shadow:inset -24px 0 #d3bfa1; }
  #momente-kompakt .moment-roof { position:absolute; width:131px; height:62px; left:-10px; top:-48px; background:#9e6452; clip-path:polygon(50% 0,100% 100%,0 100%); }
  #momente-kompakt .moment-window { position:absolute; background:#6b7e85; top:22px; left:20px; width:23px; height:27px; }
  #momente-kompakt .moment-door { position:absolute; background:#8b7964; bottom:0; right:31px; width:23px; height:41px; }
  #momente-kompakt .moment-path { position:absolute; background:#d2bb92; width:120px; height:190px; top:70%; left:25%; transform:rotate(23deg); clip-path:polygon(50% 0,75% 0,100% 100%,0 100%); }
  #momente-kompakt .moment-tree { position:absolute; border-radius:46% 50% 39% 45%; background:#a5683e; width:97px; height:145px; top:30%; box-shadow:9px 18px 0 -4px #bf874d; }
  #momente-kompakt .moment-tree-left { left:-20px; transform:rotate(-8deg); }
  #momente-kompakt .moment-tree-right { right:-14px; top:41%; background:#7b8153; transform:rotate(10deg); }
  #momente-kompakt .moment-veil { position:absolute; inset:0; background:light-dark(#d9e0f329,#101b383d); transition:opacity .18s; }
  #momente-kompakt .moment-privacy { position:absolute; top:calc(50% - 24px); left:calc(50% - 24px); display:grid; place-items:center; width:48px; height:48px; border-radius:50%; background:var(--m-paper); color:var(--m-text); box-shadow:0 3px 12px #152a3f1a; }
  #momente-kompakt .moment-photo.is-revealed .moment-scene { filter:blur(0); }
  #momente-kompakt .moment-photo.is-revealed .moment-veil { opacity:0; }
  #momente-kompakt .moment-photo.is-revealed .moment-privacy { top:12px; right:12px; left:auto; width:36px; height:36px; }
  #momente-kompakt .moment-picker { position:absolute; z-index:5; left:9px; right:9px; bottom:16px; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); padding:6px; background:var(--m-paper); border:1px solid var(--m-line); border-radius:30px; box-shadow:0 7px 24px #0f203733; }
  #momente-kompakt [hidden] { display:none !important; }
  #momente-kompakt .moment-picker button { border:0; background:transparent; border-radius:50%; min-height:44px; min-width:0; padding:0; font-size:25px; }
  #momente-kompakt .moment-picker button, #momente-kompakt .moment-reaction-chip { font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  #momente-kompakt .moment-picker button:hover, #momente-kompakt .moment-picker button[aria-pressed="true"] { background:var(--m-soft); }
  #momente-kompakt .moment-reaction-row { display:flex; align-items:center; gap:6px; margin-top:8px; }
  #momente-kompakt .moment-reaction-chip { border:1px solid var(--m-blue); border-radius:18px; background:var(--m-soft); padding:3px 11px; min-height:36px; }
  #momente-kompakt .moment-react { position:absolute; right:10px; bottom:10px; z-index:3; border:1px solid var(--m-line); background:var(--m-paper); color:var(--m-muted); width:44px; height:44px; display:grid; place-items:center; border-radius:50%; box-shadow:0 2px 8px #152a3f12; }
  #momente-kompakt .moment-react:hover { background:var(--m-soft); }
  #momente-kompakt .moment-location { display:flex; align-items:flex-start; gap:12px; padding:12px 2px 14px; }
  #momente-kompakt .moment-location > svg { color:var(--m-pink); margin-top:3px; }
  #momente-kompakt .moment-location strong { display:block; font-weight:500; margin-bottom:3px; }
  #momente-kompakt .moment-location span { display:block; color:var(--m-muted); font-size:13px; }
  #momente-kompakt .moment-location .moment-credit { font-size:11px; margin-top:8px; }
  #momente-kompakt .moment-comment { display:flex; gap:9px; align-items:center; color:var(--m-muted); padding:15px 2px 17px; border-top:1px solid var(--m-line); }
  #momente-kompakt .moment-nav { margin:0 10px 12px; display:grid; grid-template-columns:1fr 1.15fr .95fr 1fr 1fr; align-items:center; background:var(--m-paper); border:1px solid var(--m-line); border-radius:35px; padding:6px; min-height:68px; }
  #momente-kompakt .moment-nav > div { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--m-muted); font-size:11px; padding:7px 2px; }
  #momente-kompakt .moment-nav .moment-nav-active { background:var(--m-soft); border-radius:23px; color:var(--m-text); font-weight:500; }
  #momente-kompakt .moment-nav-active svg { color:var(--m-pink); fill:var(--m-pink); }
  #momente-kompakt .moment-nav .moment-nav-add { background:light-dark(#3e63c3,#668ae9); color:#fff; border-radius:50%; width:48px; height:48px; justify-self:center; }
  #momente-kompakt .moment-nav-add svg { width:26px; height:26px; }
  #momente-kompakt .moment-live { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  @media (max-width:360px) { #momente-kompakt { padding:16px 0; } #momente-kompakt .moment-content { padding-left:14px; padding-right:14px; } #momente-kompakt .moment-picker { left:5px; right:5px; padding:3px; } #momente-kompakt .moment-picker button { font-size:23px; } }
  @media (prefers-reduced-motion:reduce) { #momente-kompakt .moment-scene, #momente-kompakt .moment-veil { transition:none; } }
</style>
<script>
(() => {
  const root = document.getElementById('momente-kompakt');
  const photo = root.querySelector('.moment-photo');
  const picker = root.querySelector('.moment-picker');
  const react = root.querySelector('.moment-react');
  const chip = root.querySelector('.moment-reaction-chip');
  const reactionRow = root.querySelector('.moment-reaction-row');
  const live = root.querySelector('.moment-live');
  const options = [...picker.querySelectorAll('button')];
  let selected = '', timer = null, origin = null, held = false, revealed = false;
  const cancelHold = () => { clearTimeout(timer); timer = null; };
  const closePicker = (focus = false) => {
    picker.hidden = true;
    react.setAttribute('aria-expanded', 'false');
    if (focus) react.focus();
  };
  const openPicker = (focus = false) => {
    cancelHold();
    picker.hidden = false;
    react.setAttribute('aria-expanded', 'true');
    if (focus) (options.find(b => b.dataset.reaction === selected) || options[0]).focus();
  };
  photo.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    held = false;
    origin = {x:e.clientX, y:e.clientY};
    timer = setTimeout(() => { held = true; openPicker(); }, 450);
  });
  photo.addEventListener('pointermove', e => {
    if (origin && Math.hypot(e.clientX-origin.x,e.clientY-origin.y) > 10) cancelHold();
  });
  photo.addEventListener('pointerup', cancelHold);
  photo.addEventListener('pointercancel', cancelHold);
  photo.addEventListener('pointerleave', cancelHold);
  photo.addEventListener('contextmenu', e => { e.preventDefault(); held = true; openPicker(); });
  photo.addEventListener('click', () => {
    cancelHold();
    if (held) { held = false; return; }
    if (!picker.hidden) { closePicker(); return; }
    revealed = !revealed;
    photo.classList.toggle('is-revealed', revealed);
    photo.setAttribute('aria-pressed', String(revealed));
    photo.setAttribute('aria-label', (revealed ? 'Foto verbergen.' : 'Foto anzeigen.') + ' Gedrückt halten für Reaktionen.');
    live.textContent = revealed ? 'Foto sichtbar.' : 'Foto verborgen.';
  });
  react.addEventListener('click', () => picker.hidden ? openPicker(true) : closePicker());
  const updateReaction = (next) => {
    selected = next;
    reactionRow.hidden = !selected;
    chip.hidden = !selected;
    chip.textContent = selected ? selected + ' 1' : '';
    options.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.reaction === selected)));
    live.textContent = selected ? 'Deine Reaktion: ' + selected : 'Reaktion entfernt.';
  };
  options.forEach(b => b.addEventListener('click', () => {
    updateReaction(selected === b.dataset.reaction ? '' : b.dataset.reaction);
    closePicker(true);
  }));
  chip.addEventListener('click', () => { updateReaction(''); react.focus(); });
  root.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(true); });
  document.addEventListener('pointerdown', e => {
    if (!picker.hidden && !picker.contains(e.target) && !react.contains(e.target) && !photo.contains(e.target)) closePicker();
  });
})();
</script>
