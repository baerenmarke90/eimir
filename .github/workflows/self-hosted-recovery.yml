name: Self-Hosted Recovery

on:
  # Nightly and manual runs always execute the recovery checks.
  workflow_dispatch:
  # PR CI calls this when its shared change detection selects recovery.
  workflow_call:

concurrency:
  group: self-hosted-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Backup, Restore, and Upgrade
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EIMIR_SELF_HOSTED_BACKEND_IMAGE: eimir-backend:source-recovery
      EIMIR_SELF_HOSTED_WEB_IMAGE: eimir-web:source-recovery
      EIMIR_SELF_HOSTED_PULL_POLICY: never
      EIMIR_BUILD_REVISION: unverified-local-checkout

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recovery helper syntax and archive contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/build_self_hosted_source.py \
            scripts/self_hosted_recovery.py \
            scripts/self_hosted_deletion_reconcile.py \
            scripts/self_hosted_recovery_acceptance.py \
            scripts/account_deletion_recovery_acceptance.py \
            scripts/test_self_hosted_recovery.py \
            scripts/test_self_hosted_deletion_reconcile.py \
            backend/scripts/recovery_fixture.py \
            backend/src/eimir/identity/deletion_reconcile.py
          python3 -m unittest \
            scripts.test_self_hosted_recovery \
            scripts.test_self_hosted_deletion_reconcile

      - name: Build local source images for recovery acceptance
        run: python3 scripts/build_self_hosted_source.py

      - name: Fresh restore and prior-schema upgrade acceptance
        run: python3 scripts/self_hosted_recovery_acceptance.py

      - name: Account deletion survives older restore
        run: python3 scripts/account_deletion_recovery_acceptance.py
