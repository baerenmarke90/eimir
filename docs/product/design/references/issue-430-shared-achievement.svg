  <g transform="translate(14 764)" filter="url(#shadow)">
    <rect width="362" height="64" rx="32" fill="#FFFCFA" fill-opacity=".96" stroke="#E7DAD2"/>
    <g font-family="Arial,sans-serif" font-size="11" text-anchor="middle">
      <text x="37" y="42" fill="#BE2340" font-weight="700">Wir</text>
      <circle cx="37" cy="19" r="7" fill="#D93D59"/>
      <text x="109" y="42" fill="#5E5466">Momente</text>
      <rect x="98" y="13" width="22" height="14" rx="4" fill="none" stroke="#5E5466" stroke-width="2"/>
      <circle cx="181" cy="31" r="24" fill="#D93D59"/>
      <path d="M181 21v20M171 31h20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="253" y="42" fill="#5E5466">Planen</text>
      <path d="M245 17h16v16h-16zM248 13v8M258 13v8" fill="none" stroke="#5E5466" stroke-width="2"/>
      <text x="325" y="42" fill="#5E5466">Mehr</text>
      <circle cx="315" cy="22" r="2" fill="#5E5466"/><circle cx="325" cy="22" r="2" fill="#5E5466"/><circle cx="335" cy="22" r="2" fill="#5E5466"/>
    </g>
  </g>
</svg>