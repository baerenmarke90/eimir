<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">eimir. M2 Screenflow</title>
  <desc id="desc">Screenflow from Heute and Story through timeline, detail, comments, and creation of Memory, HeartMoment, and Milestone with shared and private destinations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9FD"/>
      <stop offset="0.6" stop-color="#F7F3FC"/>
      <stop offset="1" stop-color="#F2F8F7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6638DC"/>
      <stop offset="1" stop-color="#9B6DFF"/>
    </linearGradient>
    <linearGradient id="privateBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE7EE"/>
      <stop offset="1" stop-color="#FFF7F9"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#D7CFE0" opacity="0.38"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#211A2B" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#211A2B" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#7C4DFF"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#237A65"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#A61F51"/>
    </marker>
    <style>
      .h1{font:700 46px 'Segoe UI',Arial,sans-serif;fill:#211A2B}.sub{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#61586A}
      .eyebrow{font:700 14px 'Segoe UI',Arial,sans-serif;letter-spacing:2px}.section{font:700 14px 'Segoe UI',Arial,sans-serif;letter-spacing:1.6px}
      .title{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#211A2B}.body{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#61586A}
      .small{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#6A6072}.micro{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:.4px}
      .whiteTitle{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#FFF}.whiteBody{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#F6F1FF}
      .pLine{fill:none;stroke:#7C4DFF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.gLine{fill:none;stroke:#237A65;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.rLine{fill:none;stroke:#A61F51;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.nLine{fill:none;stroke:#C4B8CF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#dots)"/>
  <circle cx="1500" cy="50" r="230" fill="#EEE7FF" opacity="0.65"/>
  <circle cx="20" cy="1050" r="180" fill="#E3F6F1" opacity="0.58"/>

  <!-- Header -->
  <g transform="translate(82 60)">
    <rect width="238" height="34" rx="17" fill="#EEE7FF"/>
    <circle cx="18" cy="17" r="5" fill="#7C4DFF"/>
    <text x="34" y="23" class="eyebrow" fill="#6638DC">M2 · CLIENT HANDOFF</text>
    <text x="0" y="92" class="h1">One shared flow – intentionally private when needed</text>
    <text x="0" y="130" class="sub">Read Story, capture moments, and represent every system state honestly.</text>
  </g>
  <g transform="translate(1383 80)">
    <circle cx="31" cy="31" r="31" fill="url(#brand)" filter="url(#soft)"/>
    <path d="M17 32 C17 22 29 20 34 29 C39 20 51 22 51 32 C51 42 34 52 34 52 C34 52 17 42 17 32Z" fill="#FFF"/>
    <text x="76" y="27" class="small" fill="#211A2B">eimir.</text>
    <text x="76" y="47" class="micro" fill="#6A6072">WEB + ANDROID</text>
  </g>

  <!-- app shell -->
  <text x="82" y="231" class="section" fill="#6638DC">APP SHELL</text>
  <g filter="url(#soft)">
    <rect x="82" y="250" width="1436" height="80" rx="24" fill="#FFFFFF" stroke="#E0D8E8"/>
  </g>
  <g transform="translate(104 267)">
    <g><rect width="214" height="46" rx="15" fill="#F2EEF5"/><text x="74" y="29" class="title" font-size="18">Heute</text><circle cx="42" cy="23" r="13" fill="#7C4DFF" opacity=".18"/><path d="M36 24 h12 M42 18 v12" stroke="#6638DC" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(230 0)"><rect width="214" height="46" rx="15" fill="#EEE7FF"/><text x="74" y="29" class="title" font-size="18">Story</text><circle cx="42" cy="23" r="13" fill="#7C4DFF"/><path d="M35 17 h14 M35 23 h10 M35 29 h14" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/></g>
    <g transform="translate(460 0)"><rect width="214" height="46" rx="15" fill="#F2EEF5"/><text x="74" y="29" class="title" font-size="18">Planen</text><circle cx="42" cy="23" r="13" fill="#FFF2D5"/><path d="M36 23 l4 4 l8 -9" fill="none" stroke="#7A5100" stroke-width="2.8" stroke-linecap="round"/></g>
    <g transform="translate(690 0)"><rect width="214" height="46" rx="15" fill="#F2EEF5"/><text x="74" y="29" class="title" font-size="18">Entdecken</text><circle cx="42" cy="23" r="13" fill="#FFF2D5"/><path d="M42 14 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1z" fill="#7A5100"/></g>
    <g transform="translate(920 0)"><rect width="214" height="46" rx="15" fill="#F2EEF5"/><text x="74" y="29" class="title" font-size="18">Mehr</text><circle cx="42" cy="23" r="13" fill="#FFE7EE"/><circle cx="36" cy="23" r="2.3" fill="#A61F51"/><circle cx="42" cy="23" r="2.3" fill="#A61F51"/><circle cx="48" cy="23" r="2.3" fill="#A61F51"/></g>
    <rect x="1160" y="0" width="248" height="46" rx="15" fill="url(#brand)"/>
    <path d="M1185 23 h18 M1194 14 v18" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <text x="1214" y="29" class="whiteTitle" font-size="16">Moment festhalten</text>
  </g>

  <!-- Browse lane -->
  <text x="82" y="386" class="section" fill="#1769AA">READ &amp; EXPLORE</text>
  <g filter="url(#soft)">
    <rect x="82" y="408" width="1436" height="202" rx="28" fill="#E7F2FF" stroke="#C2DDF2"/>
  </g>
  <g transform="translate(112 439)">
    <rect width="210" height="136" rx="22" fill="#FFFFFF"/>
    <rect x="22" y="20" width="70" height="28" rx="14" fill="#EEE7FF"/>
    <text x="41" y="39" class="micro" fill="#6638DC">ENTRY</text>
    <text x="22" y="79" class="title">Heute / Story</text>
    <text x="22" y="106" class="body">contextual or direct</text>
  </g>
  <g transform="translate(385 439)" filter="url(#shadow)">
    <rect width="288" height="136" rx="22" fill="#FFFFFF" stroke="#AFCFE8"/>
    <text x="24" y="42" class="title">Story Timeline</text>
    <text x="24" y="69" class="body">Month · Cursor · Filter · Search</text>
    <rect x="24" y="88" width="107" height="27" rx="13.5" fill="#E7F2FF"/>
    <text x="39" y="106" class="micro" fill="#1769AA">SHARED ONLY</text>
    <rect x="143" y="88" width="116" height="27" rx="13.5" fill="#F2EEF5"/>
    <text x="158" y="106" class="micro" fill="#61586A">STATEFUL BACK</text>
  </g>
  <g transform="translate(738 439)">
    <rect width="250" height="136" rx="22" fill="#FFFFFF"/>
    <text x="24" y="42" class="title">Detail</text>
    <text x="24" y="69" class="body">Page or Side Pane</text>
    <text x="24" y="98" class="small">re-authorized</text>
  </g>
  <g transform="translate(1053 439)">
    <rect width="205" height="136" rx="22" fill="#E3F6F1"/>
    <text x="22" y="42" class="title">Comment</text>
    <text x="22" y="69" class="body">shared target only</text>
    <text x="22" y="98" class="small" fill="#237A65">minimal event</text>
  </g>
  <g transform="translate(1323 439)">
    <rect width="165" height="136" rx="22" fill="#FFF2D5"/>
    <text x="20" y="42" class="title">Back</text>
    <text x="20" y="69" class="body">Filter, cursor,</text>
    <text x="20" y="92" class="body">scroll, focus</text>
  </g>
  <path d="M322 507 H372" class="pLine" marker-end="url(#arrowPurple)"/>
  <path d="M673 507 H725" class="pLine" marker-end="url(#arrowPurple)"/>
  <path d="M988 507 H1040" class="gLine" marker-end="url(#arrowGreen)"/>
  <path d="M1258 507 H1310" class="nLine" marker-end="url(#arrowPurple)"/>

  <!-- Create lane -->
  <text x="82" y="660" class="section" fill="#6638DC">CREATE</text>
  <g filter="url(#soft)">
    <rect x="82" y="682" width="1436" height="264" rx="28" fill="#FFFFFF" stroke="#DED5E8"/>
  </g>
  <g transform="translate(112 713)">
    <rect width="220" height="196" rx="23" fill="url(#brand)"/>
    <circle cx="110" cy="52" r="28" fill="#FFFFFF" opacity=".18"/>
    <path d="M96 52 h28 M110 38 v28" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <text x="27" y="105" class="whiteTitle">Moment festhalten</text>
    <text x="27" y="136" class="whiteBody">intentional type choice</text>
    <text x="27" y="163" class="whiteBody">no remembered default</text>
  </g>

  <g transform="translate(398 704)">
    <rect width="270" height="70" rx="20" fill="#EEE7FF"/>
    <circle cx="38" cy="35" r="20" fill="#7C4DFF"/>
    <path d="M27 37 C27 29 36 26 39 33 C42 26 51 29 51 37 C51 44 39 51 39 51 C39 51 27 44 27 37Z" fill="#FFF"/>
    <text x="72" y="31" class="title">Memory</text><text x="72" y="53" class="body">Text · Date · Media</text>
    <rect y="82" width="270" height="70" rx="20" fill="url(#privateBg)" stroke="#F2B9CA"/>
    <circle cx="38" cy="117" r="20" fill="#A61F51"/>
    <path d="M27 119 C27 111 36 108 39 115 C42 108 51 111 51 119 C51 126 39 133 39 133 C39 133 27 126 27 119Z" fill="#FFF"/>
    <text x="72" y="113" class="title">HeartMoment</text><text x="72" y="135" class="body">Privacy required</text>
    <rect y="164" width="270" height="70" rx="20" fill="#FFF2D5"/>
    <circle cx="38" cy="199" r="20" fill="#B87800"/>
    <path d="M38 183 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#FFF"/>
    <text x="72" y="195" class="title">Milestone</text><text x="72" y="217" class="body">distinct type</text>
  </g>

  <g transform="translate(744 713)">
    <rect width="272" height="196" rx="23" fill="#F8F5FA" stroke="#DED5E8"/>
    <text x="24" y="40" class="title">Form + Status</text>
    <text x="24" y="69" class="body">Fields · Privacy · Media</text>
    <rect x="24" y="91" width="224" height="33" rx="16.5" fill="#FFFFFF"/>
    <circle cx="44" cy="108" r="7" fill="#B87800"/><text x="60" y="113" class="micro" fill="#7A5100">VALIDATING / UPLOAD</text>
    <rect x="24" y="136" width="224" height="33" rx="16.5" fill="#FFFFFF"/>
    <circle cx="44" cy="153" r="7" fill="#237A65"/><text x="60" y="158" class="micro" fill="#237A65">READY TO SAVE</text>
  </g>

  <g transform="translate(1085 704)">
    <rect width="194" height="96" rx="22" fill="#E3F6F1"/>
    <text x="24" y="39" class="title">SHARED</text>
    <text x="24" y="65" class="body">Detail → Story</text>
    <rect y="114" width="194" height="120" rx="22" fill="url(#privateBg)" stroke="#F2B9CA"/>
    <text x="24" y="154" class="title">PRIVATE</text>
    <text x="24" y="181" class="body">Owner-only Detail</text>
    <text x="24" y="207" class="small" fill="#A61F51">never shared Story</text>
  </g>

  <g transform="translate(1344 713)">
    <rect width="144" height="196" rx="22" fill="#211A2B"/>
    <path d="M45 52 v-9 a17 17 0 0 1 34 0 v9 M38 52 h48 v38 H38z" fill="none" stroke="#9BE0CC" stroke-width="4"/>
    <text x="20" y="123" class="whiteTitle" font-size="17">Server</text>
    <text x="20" y="149" class="whiteBody">enforces</text>
    <text x="20" y="173" class="whiteBody">visibility</text>
  </g>

  <path d="M332 811 H384" class="pLine" marker-end="url(#arrowPurple)"/>
  <path d="M668 811 H730" class="pLine" marker-end="url(#arrowPurple)"/>
  <path d="M1016 778 H1071" class="gLine" marker-end="url(#arrowGreen)"/>
  <path d="M1016 840 H1055 Q1068 840 1068 853 V878 H1071" class="rLine" marker-end="url(#arrowPink)"/>
  <path d="M1279 811 H1330" class="nLine" marker-end="url(#arrowPurple)"/>

  <!-- System guardrail -->
  <text x="82" y="997" class="section" fill="#1769AA">SYSTEM STATES</text>
  <g transform="translate(82 1017)">
    <rect width="1436" height="55" rx="18" fill="#211A2B" filter="url(#soft)"/>
    <g transform="translate(28 13)"><circle cx="14" cy="14" r="10" fill="#1769AA"/><text x="34" y="19" class="micro" fill="#FFF">LOADING · EMPTY · PARTIAL</text></g>
    <g transform="translate(328 13)"><circle cx="14" cy="14" r="10" fill="#7A5100"/><text x="34" y="19" class="micro" fill="#FFF">OFFLINE READ · WRITE BLOCKED</text></g>
    <g transform="translate(708 13)"><circle cx="14" cy="14" r="10" fill="#A61F51"/><text x="34" y="19" class="micro" fill="#FFF">401 · PRIVACY-SAFE 404 · 409</text></g>
    <g transform="translate(1080 13)"><circle cx="14" cy="14" r="10" fill="#237A65"/><text x="34" y="19" class="micro" fill="#FFF">FOCUS · TALKBACK · RETRY</text></g>
  </g>

  <text x="82" y="1092" class="micro" fill="#6A6072">COMPACT: new page · EXPANDED: list + detail pane · PRIVATE: personal area under “Mehr”</text>
  <text x="1380" y="1092" class="micro" fill="#6A6072">V1.0 · 24.08.2026</text>
</svg>
