# Allow-list of the private `eimir-pro` snapshot (Decision 0019, #2183).
#
# Same format and rules as core-allowlist.toml; this file is data, not code.
# It describes the second half of the split: everything the public Core tree
# excludes for the private repository, the files both repositories need, and
# the files only the private repository has.
#
# Layout: the paths stay the paths of today's repository (no [[map]] entry).
# A checkout of a pinned eimir-core revision with the eimir-pro tree on top is
# then the complete source tree of the official images, and patches made
# before the split apply unchanged (runbook C9). A [[map]] entry
# (from = "a/", to = "b/") would move a directory if that is ever decided.
#
# The split gate checks both trees together: every tracked file lands in
# exactly one tree, in both only by an [[overlap]] rule, or in neither only
# when its Core exclude rule is listed in [split] archive_only.

schema = 1
name = "pro"

[split]
core_allowlist = "core-allowlist.toml"
# Kept only in the archive (decision D3 of core-allowlist.toml).
archive_only = ["design-reference-media", "historical-checksum-evidence"]
# Files the official publisher requires from the Pro tree when it lays the Pro
# tree over the pinned Core checkout (scripts/test_deployment_channel.py,
# PRO_WORKSPACE_FILES and PRO_REQUIRED_FILES); the split gate fails without them.
publisher_requires = [
  "backend/pyproject.toml",
  "backend/uv.lock",
  "backend/pro/pyproject.toml",
  "backend/admin/pyproject.toml",
]
# The publisher refuses a Pro workspace whose [project] differs from Core's.
same_project = "backend/pyproject.toml"

# --------------------------------------------------------------------------
# What the Core tree excludes for the private repository (same patterns)
# --------------------------------------------------------------------------

[[include]]
id = "pro-distribution"
reason = "The Pro server package eimir_pro with the date-idea and daily-saying catalogs, its archive and its tests."
core_exclude = "pro-distribution"

[[include]]
id = "operator-plugin"
reason = "The operator plugin eimir_admin and its tests (decision D1)."
decision = "D1"
core_exclude = "operator-plugin"

[[include]]
id = "official-release-pipeline"
reason = "The official build, attest, evidence and publish workflows, their scripts and tests, the release notes and the release agent skill (decision D2)."
decision = "D2"
core_exclude = "official-release-pipeline"

[[include]]
id = "pro-coupled-core-tests"
reason = "Core test modules that import eimir_pro at module level (decision D5); they run here against a pinned Core."
decision = "D5"
core_exclude = "pro-coupled-core-tests"

# --------------------------------------------------------------------------
# Files both repositories carry (each needs an [[overlap]] rule below)
# --------------------------------------------------------------------------

[[include]]
id = "official-uv-workspace"
reason = "The official uv workspace (members pro and admin) and its full lockfile, unchanged: the publisher skips Core's workspace files and takes these from the Pro tree (compose_source in scripts/test_deployment_channel.py)."
patterns = ["backend/pyproject.toml", "backend/uv.lock"]

[[include]]
id = "shared-repository-configuration"
reason = "Line endings, ignore rules and the Secret Scan configuration apply to both repositories."
patterns = [".gitattributes", ".gitignore", ".gitleaks.toml"]

[[include]]
id = "pull-request-template"
reason = "The review gates of both repositories read the same pull request body sections (runbook C20)."
patterns = [".github/pull_request_template.md"]

[[include]]
id = "pro-extraction-tooling"
reason = "Runs the Pro tests from a clean copy on top of a Core wheel; the private CI starts from it (runbook 6.1 adapts it to a pinned eimir-core checkout)."
decision = "P3"
patterns = ["tools/ci/pro_extraction_dry_run.sh"]

[[include]]
id = "supply-chain-capability-probe"
reason = "The release evidence and publish workflows read it to record that attestations and CodeQL are unavailable on the private repository (runbook D5, #2294); the Core CI and nightly regression use it too."
patterns = ["scripts/supply_chain_state.py", "tools/ci/test_supply_chain_state.py"]

[[include]]
id = "shared-release-manifest"
reason = "The release manifest builder and its test: the release candidate and publisher use them here, and the Core CI uses them for the project-identity scan and the Cloud topology tests."
patterns = ["scripts/release_manifest.py", "tools/ci/test_release_manifest.py"]

[[include]]
id = "pro-provenance"
reason = "The provenance sections of the editorial Pro catalogs (decision D4); the transform below keeps only them."
patterns = ["PROVENANCE.md"]

[[overlap]]
id = "shared-repository-configuration"
reason = "Same file in both repositories by design."
patterns = [".gitattributes", ".gitignore", ".gitleaks.toml", ".github/pull_request_template.md"]

[[overlap]]
id = "pro-extraction-tooling"
reason = "The Core CI runs it against the export trees before the cut-over; the private CI after it."
patterns = ["tools/ci/pro_extraction_dry_run.sh"]

[[overlap]]
id = "supply-chain-capability-probe"
reason = "One probe for both repositories: public eimir-core keeps attestations and CodeQL, private eimir-pro records their absence."
patterns = ["scripts/supply_chain_state.py", "tools/ci/test_supply_chain_state.py"]

[[overlap]]
id = "uv-workspace"
reason = "Two versions of one pair: the Core tree carries the Core-only workspace (transformed, re-locked), the Pro tree the official workspace with the plugin members. Their [project] tables are equal (checked by the split gate)."
patterns = ["backend/pyproject.toml", "backend/uv.lock"]

[[overlap]]
id = "shared-release-manifest"
reason = "Same files in both repositories: Core tests read them, the private release pipeline runs them."
patterns = ["scripts/release_manifest.py", "tools/ci/test_release_manifest.py"]

[[overlap]]
id = "provenance-split"
reason = "One source file, two different files: the Core tree drops the two Pro sections, this tree keeps only them (D4)."
patterns = ["PROVENANCE.md"]

# --------------------------------------------------------------------------
# Files only the private repository has (read from this repository at the revision)
# --------------------------------------------------------------------------

[[add]]
path = "LICENSE"
from = "tools/cutover/pro/LICENSE"
reason = "Proprietary, all rights reserved (Decision 0019 addendum); the wording is a placeholder for legal review (P1)."

[[add]]
path = "README.md"
from = "tools/cutover/pro/README.md"
reason = "What the repository holds and how its layout relates to eimir-core."

# --------------------------------------------------------------------------
# Hard guards
# --------------------------------------------------------------------------

[[forbidden]]
id = "signing-material"
reason = "Signing keys and store credentials are never committed, also not to the private repository; they live in repository secrets."
patterns = [
  "**/*.jks",
  "**/*.keystore",
  "**/*.p12",
  "**/*.pfx",
  "**/*.pem",
  "**/*.key",
  "**/*.mobileprovision",
  "**/google-services.json",
  "**/GoogleService-Info.plist",
  "**/keystore.properties",
  "**/signing.properties",
  "**/.env",
]

[[forbidden]]
id = "public-licensing"
reason = "The private repository has no CLA and no PolyForm licence (Decision 0019 addendum)."
patterns = ["CLA.md", "COMMERCIAL-LICENSE.md"]

[[forbidden]]
id = "core-sources"
reason = "Core sources come from the pinned eimir-core revision, never from a copy here."
patterns = ["backend/src/**", "backend/alembic/**", "web/**", "android/**", "ios/**"]

# --------------------------------------------------------------------------
# Transforms
# --------------------------------------------------------------------------

[[transform]]
path = "PROVENANCE.md"
reason = "Keeps only the provenance of the editorial Pro catalogs (decision D4); the general provenance stays in eimir-core."
decision = "D4"
keep_markdown_sections = ["Date-idea catalog and images", "Daily Saying catalog"]
header = """
# Provenance of eimir-pro

The provenance statement, the clean-room rule, the dependency records and the licence of the public code of eimir.
are in `PROVENANCE.md` of the public `eimir-core` repository. This file records the assets that live only in this
private repository.

"""

# --------------------------------------------------------------------------
# Repository identity (P5), as in core-allowlist.toml
# --------------------------------------------------------------------------

[identity]
source = "baerenmarke90/eimir"
archive = "baerenmarke90/eimir-archive"
issue_map = "issue-map.toml"

[[rewrite]]
id = "issue-links"
reason = "Issue and pull request links point at the archive, or at the new item listed in issue-map.toml (the Pro and operator READMEs, the photo-source acceptance issue of the Google setup state)."
kind = "issue-links"
paths = ["**"]
minimum = 1

[[rewrite]]
id = "catalog-history-sources"
reason = "The source_url of the archived and the current daily-saying catalog names a file of the old history."
kind = "regex"
paths = [
  "backend/pro/src/eimir_pro/quotes/daily_sayings.json",
  "backend/pro/archive/quotes/daily_sayings.before-ai-sayings-2026-11-18.json",
]
pattern = '(?<=github\.com/baerenmarke90/)eimir(?=/blob/)'
replacement = 'eimir-archive'
minimum = 2

# --------------------------------------------------------------------------
# Gates
# --------------------------------------------------------------------------

[gates]
[[gates.required_file]]
path = "LICENSE"
contains = ["All rights reserved"]
lacks = ["PolyForm"]
[[gates.required_file]]
path = "README.md"
[[gates.required_file]]
path = "PROVENANCE.md"
contains = ["## Date-idea catalog and images", "## Daily Saying catalog"]
lacks = ["## Contributors", "PolyForm"]

[[gates.forbidden_text]]
id = "old-repository-name"
pattern = 'baerenmarke90/eimir(?![\w-])'
paths = ["**"]
reason = "The private tree names the old repository only where its publisher still needs the monorepository default."
[[gates.forbidden_text.allow]]
path = ".github/workflows/release-publish.yml"
reason = "test-checked-main defaults EIMIR_TEST_CHANNEL_REPOSITORY to the monorepository (test channel publisher, P2); set the variable in eimir-pro."
[[gates.forbidden_text.allow]]
path = "scripts/test_deployment_channel.py"
reason = "DEFAULT_REPOSITORY reproduces the monorepository behaviour until the variable is set (P2)."
[[gates.forbidden_text.allow]]
path = "tools/ci/test_release_publish_workflow.py"
reason = "Asserts the test-checked-main default above (P2)."
[[gates.forbidden_text.allow]]
path = "tools/ci/test_test_deployment_channel.py"
reason = "Tests the default and the rejected look-alike names of the publishing repository (P2)."
