name: R1 Temporary Web Evidence

on:
  push:
    branches:
      - feat/964-r1-memory-capture
    paths:
      - .github/workflows/r1-temp-web-evidence.yml

permissions:
  contents: write

jobs:
  evidence:
    name: Exact-build R1 Web evidence
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    steps:
      - name: Install Git
        shell: sh
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/964-r1-memory-capture
          fetch-depth: 0

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked browser QA dependencies
        working-directory: web/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact Web client
        working-directory: web
        run: npm run build

      - name: Install pinned Chromium runtime
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Capture R1 exact-build evidence
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright test tests/r1-memory-capture-evidence.spec.ts --workers=1

      - name: Record source and commit evidence
        shell: sh
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD > docs/product/design/evidence/r1/r1-web-source-commit.txt
          git rm .github/workflows/r1-temp-web-evidence.yml
          git add docs/product/design/evidence/r1/r1-*.png docs/product/design/evidence/r1/r1-web-source-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(web): refresh final R1 visual evidence'
          git push origin HEAD:feat/964-r1-memory-capture

      - name: Upload R1 exact-build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-web-final-${{ github.sha }}
          path: |
            docs/product/design/evidence/r1/r1-*.png
            docs/product/design/evidence/r1/r1-web-source-commit.txt
          if-no-files-found: error
          retention-days: 3