name: PR 998 detail source fixup

on:
  push:
    branches:
      - fix/memory-detail-content-first

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/memory-detail-content-first
          fetch-depth: 0

      - name: Remove duplicate successful-detail back controls and share first-name provenance
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          author_path = Path('web/src/client/authorPresentation.ts')
          author = author_path.read_text()
          anchor = """export function authorProfileAttachmentId(\n"""
          helper = """export function authorFirstName(author: PresentableAuthor): string {\n  if (author.isFormerMember === true) return authorDisplayName(author);\n  const trimmed = author.displayName.trim();\n  return trimmed.split(/\\s+/u)[0] || trimmed;\n}\n\n"""
          if helper not in author:
              if author.count(anchor) != 1:
                  raise SystemExit('author presentation insertion anchor mismatch')
              author = author.replace(anchor, helper + anchor, 1)
              author_path.write_text(author)

          memory_path = Path('web/src/components/MemoryProductPage.tsx')
          memory = memory_path.read_text()
          old = """      <PageHeader\n        before={returnControl}\n        eyebrow={memoryEyebrow}\n"""
          new = """      <PageHeader\n        eyebrow={memoryEyebrow}\n"""
          if memory.count(old) != 1:
              raise SystemExit(f'Memory success PageHeader anchor mismatch: {memory.count(old)}')
          memory_path.write_text(memory.replace(old, new, 1))

          heart_path = Path('web/src/components/HeartMomentProductPage.tsx')
          heart = heart_path.read_text()
          if heart.count("import { authorDisplayName } from '../client/authorPresentation';") != 1:
              raise SystemExit('HeartMoment author import mismatch')
          heart = heart.replace(
              "import { authorDisplayName } from '../client/authorPresentation';",
              "import { authorFirstName } from '../client/authorPresentation';",
              1,
          )
          old = """      <PageHeader\n        before={returnControl}\n        eyebrow={heartMomentEyebrow}\n"""
          new = """      <PageHeader\n        eyebrow={heartMomentEyebrow}\n"""
          if heart.count(old) != 1:
              raise SystemExit(f'HeartMoment success PageHeader anchor mismatch: {heart.count(old)}')
          heart = heart.replace(old, new, 1)
          old = 'author: authorDisplayName(heartMoment.author),'
          new = 'author: authorFirstName(heartMoment.author),'
          if heart.count(old) != 1:
              raise SystemExit(f'HeartMoment provenance anchor mismatch: {heart.count(old)}')
          heart_path.write_text(heart.replace(old, new, 1))

          milestone_path = Path('web/src/components/MilestoneProductPage.tsx')
          milestone = milestone_path.read_text()
          if milestone.count("import { authorDisplayName } from '../client/authorPresentation';") != 1:
              raise SystemExit('Milestone author import mismatch')
          milestone = milestone.replace(
              "import { authorDisplayName } from '../client/authorPresentation';",
              "import { authorFirstName } from '../client/authorPresentation';",
              1,
          )
          old = """      <PageHeader\n        before={returnControl}\n        eyebrow={milestoneEyebrow}\n"""
          new = """      <PageHeader\n        eyebrow={milestoneEyebrow}\n"""
          if milestone.count(old) != 1:
              raise SystemExit(f'Milestone success PageHeader anchor mismatch: {milestone.count(old)}')
          milestone = milestone.replace(old, new, 1)
          old = 'author: authorDisplayName(milestone.author),'
          new = 'author: authorFirstName(milestone.author),'
          if milestone.count(old) != 1:
              raise SystemExit(f'Milestone provenance anchor mismatch: {milestone.count(old)}')
          milestone_path.write_text(milestone.replace(old, new, 1))
          PY

      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr998-detail-source-fixup.yml
          git add web/src/client/authorPresentation.ts web/src/components/MemoryProductPage.tsx web/src/components/HeartMomentProductPage.tsx web/src/components/MilestoneProductPage.tsx
          git diff --cached --check
          git commit -m "fix(web): make Story detail back and provenance canonical"
          git push origin HEAD:fix/memory-detail-content-first
