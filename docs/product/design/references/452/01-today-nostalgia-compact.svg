<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1320" viewBox="0 0 390 1320" role="img" aria-labelledby="title desc">
<title id="title">eimir. Today Compact — retrospective Polaroid with daily dismissal</title>
<desc id="desc">A full 390-pixel eimir. Today composition. Preserves the shell, couple presence, a large focal shared moment, the near-future plan, the contextual relationship module, recent shared content and the four root destinations. Only the contextual retrospective gains an editorial paper-photo treatment and a quiet For today dismiss button. Content labels are illustrative fixture data, not generated memories.</desc>
