name: Web Browser QA

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-browser-qa.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright + axe
    runs-on: ubuntu-latest
    container: node:22.19.0-bookworm-slim@sha256:4a4884e8a44826194dff92ba316264f392056cbe243dcc9fd3551e71cea02b90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked browser QA dependencies
        working-directory: web/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit browser QA dependencies
        working-directory: web/e2e
        run: npm audit --audit-level=high

      - name: Typecheck internal visual proof
        working-directory: web
        run: ./node_modules/.bin/tsc -p e2e/fixtures/tsconfig.json

      - name: Install pinned Chromium runtime
        working-directory: web/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Validate browser test inventory
        working-directory: web/e2e
        run: npm run test:inventory

      - name: PR-critical browser E2E and accessibility gate
        if: github.event_name == 'pull_request'
        working-directory: web/e2e
        run: npm run test:pr

      - name: Verify changed browser specs
        if: github.event_name == 'pull_request'
        working-directory: web/e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          changed_specs="$(node scripts/changed-specs.mjs)"
          if [ -z "$changed_specs" ]; then
            echo "No browser spec files changed."
            exit 0
          fi
          printf 'Changed browser specs:\n%s\n' "$changed_specs"
          # Spec filenames are repository-controlled and contain no whitespace.
          # Intentional word splitting passes each changed spec as one Playwright argument.
          npm run test:full -- $changed_specs --output=test-results-changed-specs

      - name: Full browser regression
        if: github.event_name != 'pull_request'
        working-directory: web/e2e
        run: npm run test:full

      - name: Upload product visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-product-visual-evidence-${{ github.sha }}
          path: |
            web/e2e/test-results/**/planning-*.png
            web/e2e/test-results/**/shell-*.png
            web/e2e/test-results/**/today-*.png
            web/e2e/test-results/**/private-area-*.png
            web/e2e/test-results/**/*story-*.png
            web/e2e/test-results/**/wish-detective-*.png
            web/e2e/test-results/**/f1-*.png
            web/e2e/test-results/**/f1-*.json
            web/e2e/test-results/**/f2-*.png
            web/e2e/test-results/**/f2-*.json
            web/e2e/test-results-changed-specs/**/planning-*.png
            web/e2e/test-results-changed-specs/**/shell-*.png
            web/e2e/test-results-changed-specs/**/today-*.png
            web/e2e/test-results-changed-specs/**/private-area-*.png
            web/e2e/test-results-changed-specs/**/*story-*.png
            web/e2e/test-results-changed-specs/**/wish-detective-*.png
            web/e2e/test-results-changed-specs/**/f1-*.png
            web/e2e/test-results-changed-specs/**/f1-*.json
            web/e2e/test-results-changed-specs/**/f2-*.png
            web/e2e/test-results-changed-specs/**/f2-*.json
          if-no-files-found: error
          retention-days: 3
