name: Artifact Cleanup

# Manually started report and cleanup of Actions artifacts (#2096). Every run
# first summarizes all current artifacts grouped by kind (count and size), so
# storage can be attributed without waiting for the billing report. The default
# run is a dry run that only lists the artifacts matching the prefix and cutoff.
on:
  workflow_dispatch:
    inputs:
      name_prefix:
        description: Delete only artifacts whose name starts with this prefix.
        required: true
        default: android-launcher-verification-
        type: string
      created_before:
        description: Delete only artifacts created before this UTC timestamp.
        required: true
        default: "2026-11-20T11:01:00Z"
        type: string
      dry_run:
        description: List the matching artifacts without deleting them.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Report and clean up artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Report all current artifacts by kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Group names by stripping commit SHAs, retry attempts and trailing
          # shard or API numbers, e.g. web-browser-failure-pr-3-<sha>-attempt-1.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.expired | not)
              | [(.name
                  | gsub("-[0-9a-f]{40}"; "")
                  | gsub("-attempt-[0-9]+"; "")
                  | gsub("-[0-9]+(\\.[0-9]+)?$"; "")),
                 .size_in_bytes, .created_at] | @tsv' \
            > all.tsv

          sort -t$'\t' -k1,1 all.tsv | awk -F'\t' '
            { count[$1]++; bytes[$1] += $2; total += $2; n++
              if (!($1 in oldest) || $3 < oldest[$1]) oldest[$1] = $3 }
            END {
              printf "### Current artifacts: %d (%.1f GiB)\n\n", n, total / 1073741824
              print "| Kind | Count | GiB | Oldest |"
              print "|---|---:|---:|---|"
              for (k in bytes) printf "%.0f\t| `%s` | %d | %.2f | %s |\n", bytes[k], k, count[k], bytes[k] / 1073741824, substr(oldest[k], 1, 10)
            }' > report.txt
          cache=$(gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" \
            --jq '"\(.active_caches_count) caches, \(.active_caches_size_in_bytes / 1073741824 * 10 | floor / 10) GiB"')
          {
            head -n 4 report.txt
            tail -n +5 report.txt | sort -t$'\t' -k1,1nr | head -n 40 | cut -f2-
            echo
            echo "Actions cache (not artifacts): ${cache}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: List and delete matching artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NAME_PREFIX: ${{ inputs.name_prefix }}
          CREATED_BEFORE: ${{ inputs.created_before }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "$NAME_PREFIX" ]; then
            echo "::error::An empty name prefix would match every artifact."
            exit 1
          fi
          if ! [[ "$CREATED_BEFORE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::created_before must look like 2026-11-20T11:01:00Z."
            exit 1
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.expired | not)
              | select(.name | startswith($ENV.NAME_PREFIX))
              | select(.created_at < $ENV.CREATED_BEFORE)
              | [.id, .size_in_bytes, .created_at, .name] | @tsv' \
            > matches.tsv

          count=$(wc -l < matches.tsv)
          bytes=$(awk -F'\t' '{sum += $2} END {printf "%.0f", sum}' matches.tsv)
          gib=$(awk -v b="$bytes" 'BEGIN {printf "%.1f", b / 1024 / 1024 / 1024}')
          {
            echo "### Artifact cleanup"
            echo
            echo "- Prefix: \`${NAME_PREFIX}\`, created before \`${CREATED_BEFORE}\`"
            echo "- Matching artifacts: ${count} (${gib} GiB)"
            echo "- Dry run: ${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
          head -n 20 matches.tsv

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing deleted. Start again with dry_run unchecked to delete."
            exit 0
          fi

          deleted=0
          while IFS=$'\t' read -r id _size _created _name; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --silent
            deleted=$((deleted + 1))
          done < matches.tsv
          echo "- Deleted: ${deleted}" >> "$GITHUB_STEP_SUMMARY"
