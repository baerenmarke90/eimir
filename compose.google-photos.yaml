# Optional operator-secret overlay; it does not enable the application safety gate.
# Set EIMIR_GOOGLE_PHOTOS_WEB_CLIENT_HOST_FILE to a private, untracked Web-client
# JSON file. Leave both legacy GOOGLE_PHOTOS_CLIENT_* environment fields empty.
x-google-photos-environment: &google-photos-environment
  EIMIR_GOOGLE_PHOTOS_WEB_CLIENT_FILE: /run/secrets/google-photos-web-client.json

x-google-photos-secrets: &google-photos-secrets
  - source: google_photos_web_client
    target: google-photos-web-client.json

services:
  api:
    environment: *google-photos-environment
    secrets: *google-photos-secrets
  worker:
    environment: *google-photos-environment
    secrets: *google-photos-secrets
  cloud-api:
    environment: *google-photos-environment
    secrets: *google-photos-secrets
  cloud-worker:
    environment: *google-photos-environment
    secrets: *google-photos-secrets

secrets:
  google_photos_web_client:
    file: ${EIMIR_GOOGLE_PHOTOS_WEB_CLIENT_HOST_FILE:?Set the private Google Web OAuth client file}
