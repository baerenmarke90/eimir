name: Incident Runbook Contract

on:
  pull_request:
    paths:
      - "docs/m6/INCIDENT-RESPONSE.md"
      - "docs/m6/INCIDENT-DRILL.md"
      - "tools/ci/test_incident_runbooks.py"
      - ".github/workflows/incident-runbooks.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Privacy-safe runbook contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile focused contract test
        run: python3 -m py_compile tools/ci/test_incident_runbooks.py

      - name: Verify incident/runbook safety contract
        run: python3 tools/ci/test_incident_runbooks.py
