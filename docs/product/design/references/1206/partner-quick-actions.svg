<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Issue 1206 partner quick actions visual preflight</title>
  <desc id="desc">Directional Compact reference based on main 911d3061b36a25140fa8cc72f1409da42dca16d0. It keeps the current Today composition, including daily check-in, quote, pinned shared list, and notification-aware shell, while moving partner actions into the couple avatar group.</desc>
  <rect width="1400" height="920" fill="#f5efe9"/>
  <text x="54" y="56" font-family="system-ui, sans-serif" font-size="28" font-weight="750" fill="#231e28">#1206 · Partner Quick Actions</text>
  <text x="54" y="89" font-family="system-ui, sans-serif" font-size="16" fill="#5e5466">Visual preflight · Compact normative · baseline main 911d3061 · whole Today composition preserved</text>

  <!-- Closed Today composition -->
