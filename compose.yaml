# Canonical Docker Compose contract for every eimir. Compose deployment.
#
# Profiles:
#   self-hosted  released Self-Hosted runtime using versioned OCI images
#   demo         explicit Demo-only initialization lifecycle step
#   bootstrap    one-time Production Account-deletion authority provisioning
#   cloud        Cloud/Managed runtime using immutable release images
#   dev-db       PostgreSQL-only database for local source development/tests
#
# Normal released Self-Hosted deployment is image-only. Developers and CI may
# intentionally build local source images with scripts/build_self_hosted_source.py,
# then point this same canonical manifest at those local image tags. No second
# tracked Compose topology exists.
#
# Production is gated inside this manifest: every runtime service transitively waits
# for the release-guard one-shot, so a plain Compose/Arcane deploy cannot bypass the
# release identity checks that scripts/self_hosted_release.py performs up front.
# The bootstrap profile provisions the Account-deletion authority exactly once.

x-account-deletion-journal-path: &account-deletion-journal-path /var/lib/eimir/deletion-journal/account-deletions.journal

x-self-hosted-database-environment: &self-hosted-database-environment
  # POSTGRES_USER/POSTGRES_DB deliberately retain their old defaults. Existing
  # named volumes contain that role/database and must remain bootable.
  EIMIR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sidebyside}

# ``SBS_*`` fallbacks are deprecated read-only aliases for existing operator
# env files. Compose always passes the canonical ``EIMIR_*`` key to containers.
# Keys every profile agrees on, so a change to one profile cannot silently
# diverge from the other the way separate deployment manifests once did.
x-shared-runtime-environment: &shared-runtime-environment
  EIMIR_CURSOR_SIGNING_KEY: "${EIMIR_CURSOR_SIGNING_KEY:-${SBS_CURSOR_SIGNING_KEY:-}}"
  EIMIR_SERVER_ADMIN_EMAILS: '${EIMIR_SERVER_ADMIN_EMAILS:-${SBS_SERVER_ADMIN_EMAILS:-[]}}'
  EIMIR_MEDIA_STORE: "${EIMIR_MEDIA_STORE:-${SBS_MEDIA_STORE:-local}}"
  EIMIR_MEDIA_ROOT: /var/lib/eimir/media
  EIMIR_S3_ENDPOINT: "${EIMIR_S3_ENDPOINT:-${SBS_S3_ENDPOINT:-}}"
  EIMIR_S3_REGION: "${EIMIR_S3_REGION:-${SBS_S3_REGION:-us-east-1}}"
  EIMIR_S3_BUCKET: "${EIMIR_S3_BUCKET:-${SBS_S3_BUCKET:-}}"
  EIMIR_S3_ACCESS_KEY_ID: "${EIMIR_S3_ACCESS_KEY_ID:-${SBS_S3_ACCESS_KEY_ID:-}}"
  EIMIR_S3_SECRET_ACCESS_KEY: "${EIMIR_S3_SECRET_ACCESS_KEY:-${SBS_S3_SECRET_ACCESS_KEY:-}}"
  EIMIR_S3_SESSION_TOKEN: "${EIMIR_S3_SESSION_TOKEN:-${SBS_S3_SESSION_TOKEN:-}}"
  EIMIR_ACCOUNT_DELETION_JOURNAL_PATH: *account-deletion-journal-path
  EIMIR_ACCOUNT_DELETION_INSTANCE_ID: "${EIMIR_ACCOUNT_DELETION_INSTANCE_ID:-${SBS_ACCOUNT_DELETION_INSTANCE_ID:-}}"
  EIMIR_OIDC_CONNECTIONS: '${EIMIR_OIDC_CONNECTIONS:-${SBS_OIDC_CONNECTIONS:-[]}}'
  EIMIR_WEBAUTHN_RP_ID: "${EIMIR_WEBAUTHN_RP_ID:-${SBS_WEBAUTHN_RP_ID:-}}"
  EIMIR_WEBAUTHN_RP_NAME: "${EIMIR_WEBAUTHN_RP_NAME:-${SBS_WEBAUTHN_RP_NAME:-eimir.}}"
  EIMIR_WEBAUTHN_ORIGINS: '${EIMIR_WEBAUTHN_ORIGINS:-${SBS_WEBAUTHN_ORIGINS:-[]}}'
  EIMIR_MAIL_FROM: "${EIMIR_MAIL_FROM:-${SBS_MAIL_FROM:-no-reply@localhost}}"
  EIMIR_SMTP_HOST: "${EIMIR_SMTP_HOST:-${SBS_SMTP_HOST:-localhost}}"
  EIMIR_SMTP_PORT: "${EIMIR_SMTP_PORT:-${SBS_SMTP_PORT:-587}}"
  EIMIR_SMTP_USERNAME: "${EIMIR_SMTP_USERNAME:-${SBS_SMTP_USERNAME:-}}"
  EIMIR_SMTP_PASSWORD: "${EIMIR_SMTP_PASSWORD:-${SBS_SMTP_PASSWORD:-}}"
  EIMIR_SMTP_STARTTLS: "${EIMIR_SMTP_STARTTLS:-${SBS_SMTP_STARTTLS:-true}}"

x-self-hosted-runtime-environment: &self-hosted-runtime-environment
  <<: [*self-hosted-database-environment, *shared-runtime-environment]
  EIMIR_ENVIRONMENT: "${EIMIR_ENVIRONMENT:-${SBS_ENVIRONMENT:-development}}"
  EIMIR_DEPLOYMENT: self_hosted
  EIMIR_DEMO_MODE: "${EIMIR_DEMO_MODE:-${SBS_DEMO_MODE:-false}}"
  EIMIR_DEMO_MODE_RESET_TIMER: "${EIMIR_DEMO_MODE_RESET_TIMER:-${SBS_DEMO_MODE_RESET_TIMER:-false}}"
  EIMIR_DEMO_MODE_RESET_INTERVAL: "${EIMIR_DEMO_MODE_RESET_INTERVAL:-${SBS_DEMO_MODE_RESET_INTERVAL:-6h}}"
  EIMIR_ALLOWED_HOSTS: '${EIMIR_ALLOWED_HOSTS:-${SBS_ALLOWED_HOSTS:-["localhost","127.0.0.1"]}}'
  EIMIR_PUBLIC_BASE_URL: "${EIMIR_PUBLIC_BASE_URL:-${SBS_PUBLIC_BASE_URL:-http://localhost:8080}}"
  EIMIR_MAIL_TRANSPORT: "${EIMIR_MAIL_TRANSPORT:-${SBS_MAIL_TRANSPORT:-log}}"

x-cloud-runtime-environment: &cloud-runtime-environment
  <<: *shared-runtime-environment
  EIMIR_DATABASE_URL: "${EIMIR_DATABASE_URL:-${SBS_DATABASE_URL:-}}"
  EIMIR_ENVIRONMENT: "${EIMIR_ENVIRONMENT:-${SBS_ENVIRONMENT:-production}}"
  EIMIR_DEPLOYMENT: cloud
  EIMIR_DEMO_MODE: "false"
  EIMIR_ALLOWED_HOSTS: '${EIMIR_ALLOWED_HOSTS:-${SBS_ALLOWED_HOSTS:-[]}}'
  EIMIR_PUBLIC_BASE_URL: "${EIMIR_PUBLIC_BASE_URL:-${SBS_PUBLIC_BASE_URL:-}}"
  EIMIR_MAIL_TRANSPORT: "${EIMIR_MAIL_TRANSPORT:-${SBS_MAIL_TRANSPORT:-none}}"

# Released Self-Hosted consumes first-class release images. The SemVer default is
# the repository's current product version; operators may use the exact digest-
# qualified references recorded with the GitHub Release via the two override
# variables below for a fully locked deployment. `always` is the released safe
# default; local source development deliberately sets `never` after building its
# local tags with scripts/build_self_hosted_source.py.
x-self-hosted-backend-image-reference: &self-hosted-backend-image-reference "${EIMIR_SELF_HOSTED_BACKEND_IMAGE:-${SBS_SELF_HOSTED_BACKEND_IMAGE:-ghcr.io/baerenmarke90/eimir-backend:v${EIMIR_RELEASE_VERSION:-${SBS_RELEASE_VERSION:-0.1.0}}}}"
x-self-hosted-web-image-reference: &self-hosted-web-image-reference "${EIMIR_SELF_HOSTED_WEB_IMAGE:-${SBS_SELF_HOSTED_WEB_IMAGE:-ghcr.io/baerenmarke90/eimir-web:v${EIMIR_RELEASE_VERSION:-${SBS_RELEASE_VERSION:-0.1.0}}}}"
x-self-hosted-pull-policy: &self-hosted-pull-policy "${EIMIR_SELF_HOSTED_PULL_POLICY:-${SBS_SELF_HOSTED_PULL_POLICY:-always}}"

x-self-hosted-backend-image: &self-hosted-backend-image
  image: *self-hosted-backend-image-reference
  pull_policy: *self-hosted-pull-policy

x-self-hosted-web-image: &self-hosted-web-image
  image: *self-hosted-web-image-reference
  pull_policy: *self-hosted-pull-policy

# Exactly the values Compose renders for the application images, handed to the
# release-guard/bootstrap one-shots by aliasing the same scalars, so the guard
# judges what the runtime services will actually run and nothing else.
x-release-guard-environment: &release-guard-environment
  EIMIR_ENVIRONMENT: "${EIMIR_ENVIRONMENT:-${SBS_ENVIRONMENT:-development}}"
  EIMIR_RELEASE_VERSION: "${EIMIR_RELEASE_VERSION:-${SBS_RELEASE_VERSION:-}}"
  EIMIR_GUARD_BACKEND_IMAGE: *self-hosted-backend-image-reference
  EIMIR_GUARD_WEB_IMAGE: *self-hosted-web-image-reference
  EIMIR_GUARD_PULL_POLICY: *self-hosted-pull-policy
  EIMIR_ACCOUNT_DELETION_INSTANCE_ID: "${EIMIR_ACCOUNT_DELETION_INSTANCE_ID:-${SBS_ACCOUNT_DELETION_INSTANCE_ID:-}}"

# Cloud/Managed intentionally has image-only process services. The sentinel
# defaults keep inactive profiles renderable; the Cloud env contract and CI
# require exact immutable release references before the cloud profile is used.
x-cloud-backend-image: &cloud-backend-image
  image: "${EIMIR_BACKEND_IMAGE:-${SBS_BACKEND_IMAGE:-invalid.invalid/eimir-backend:configuration-required}}"

x-cloud-web-image: &cloud-web-image
  image: "${EIMIR_WEB_IMAGE:-${SBS_WEB_IMAGE:-invalid.invalid/eimir-web:configuration-required}}"

x-api-healthcheck: &api-healthcheck
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready")
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  postgres:
    profiles: ["self-hosted"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sidebyside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sidebyside}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Production release gate. It needs no network and no data volume: it only judges
  # the rendered release identity, so a refusal happens before any migration and before
  # any container of the refused release starts. It is a no-op outside
  # EIMIR_ENVIRONMENT=production.
  release-guard:
    profiles: ["self-hosted"]
    <<: *self-hosted-backend-image
    restart: "no"
    command: ["python", "-m", "eimir.deployment.release_guard", "verify"]
    environment:
      <<: *release-guard-environment
    network_mode: none

  # One-time Production provisioning of the Account-deletion authority for an
  # Arcane project. Activate ONLY this profile (COMPOSE_PROFILES=bootstrap), read the
  # printed EIMIR_ACCOUNT_DELETION_INSTANCE_ID from its log, store it in the project
  # environment and switch back to self-hosted. It refuses once an instance ID is
  # configured or a journal exists, so it can never replace an established authority.
  deletion-authority-bootstrap:
    profiles: ["bootstrap"]
    <<: *self-hosted-backend-image
    restart: "no"
    command: ["python", "-m", "eimir.deployment.release_guard", "bootstrap"]
    environment:
      <<: *release-guard-environment
      EIMIR_ACCOUNT_DELETION_JOURNAL_PATH: *account-deletion-journal-path
    volumes:
      - deletion_journal_data:/var/lib/eimir/deletion-journal
    network_mode: none

  migrate:
    profiles: ["self-hosted"]
    <<: *self-hosted-backend-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *self-hosted-database-environment
    networks:
      - app
    depends_on:
      release-guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # Demo initialization is deliberately not part of normal Self-Hosted startup.
  # Activate profiles self-hosted,demo and run this one-shot service explicitly
  # only for the isolated public Demo lifecycle.
  demo-init:
    profiles: ["demo"]
    <<: *self-hosted-backend-image
    restart: "no"
    command: ["python", "-m", "scripts.demo_space", "ensure"]
    environment:
      <<: *self-hosted-runtime-environment
    volumes:
      - media_data:/var/lib/eimir/media
    networks:
      - app
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    profiles: ["self-hosted"]
    <<: [*self-hosted-backend-image, *api-healthcheck]
    restart: unless-stopped
    environment:
      <<: *self-hosted-runtime-environment
      EIMIR_BOOTSTRAP_TOKEN: "${EIMIR_BOOTSTRAP_TOKEN:-${SBS_BOOTSTRAP_TOKEN:-}}"
      FORWARDED_ALLOW_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1}"
    volumes:
      - media_data:/var/lib/eimir/media
      - deletion_journal_data:/var/lib/eimir/deletion-journal
    networks:
      - app
    ports:
      - name: api-loopback
        target: 8000
        published: "${API_PORT:-8000}"
        host_ip: "${EIMIR_BIND_IP:-${SBS_BIND_IP:-127.0.0.1}}"
        protocol: tcp
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["self-hosted"]
    <<: *self-hosted-backend-image
    restart: unless-stopped
    command: ["python", "-m", "eimir.jobs.runner"]
    environment:
      <<: *self-hosted-runtime-environment
    volumes:
      - media_data:/var/lib/eimir/media
    networks:
      - app
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["self-hosted"]
    <<: *self-hosted-web-image
    restart: unless-stopped
    environment:
      EIMIR_WEB_CSP_CONNECT_ORIGINS: "${EIMIR_S3_ENDPOINT:-${SBS_S3_ENDPOINT:-}}"
    networks:
      - app
    ports:
      - name: web-loopback
        target: 8080
        published: "${WEB_PORT:-8080}"
        host_ip: "${EIMIR_BIND_IP:-${SBS_BIND_IP:-127.0.0.1}}"
        protocol: tcp
    depends_on:
      api:
        condition: service_healthy

  cloud-migrate:
    profiles: ["cloud"]
    <<: *cloud-backend-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      EIMIR_DATABASE_URL: "${EIMIR_DATABASE_URL:-${SBS_DATABASE_URL:-}}"
    networks:
      - app

  cloud-api:
    profiles: ["cloud"]
    <<: [*cloud-backend-image, *api-healthcheck]
    restart: unless-stopped
    environment:
      <<: *cloud-runtime-environment
      FORWARDED_ALLOW_IPS: "${TRUSTED_PROXY_IPS:-}"
    volumes:
      - cloud_media_data:/var/lib/eimir/media
      - cloud_deletion_journal_data:/var/lib/eimir/deletion-journal
    networks:
      - app
    depends_on:
      cloud-migrate:
        condition: service_completed_successfully

  cloud-worker:
    profiles: ["cloud"]
    <<: *cloud-backend-image
    restart: unless-stopped
    command: ["python", "-m", "eimir.jobs.runner"]
    environment:
      <<: *cloud-runtime-environment
    volumes:
      - cloud_media_data:/var/lib/eimir/media
      - cloud_deletion_journal_data:/var/lib/eimir/deletion-journal
    networks:
      - app
    depends_on:
      cloud-migrate:
        condition: service_completed_successfully

  cloud-web:
    profiles: ["cloud"]
    <<: *cloud-web-image
    restart: unless-stopped
    environment:
      EIMIR_WEB_CSP_CONNECT_ORIGINS: "${EIMIR_S3_ENDPOINT:-${SBS_S3_ENDPOINT:-}}"
    networks:
      - app
    depends_on:
      cloud-api:
        condition: service_healthy

  dev-postgres:
    profiles: ["dev-db"]
    image: postgres:17-alpine
    environment:
      # Development keeps the established role/database because postgres_dev
      # is also an existing named volume for contributors upgrading in place.
      POSTGRES_USER: sidebyside
      POSTGRES_PASSWORD: sidebyside
      POSTGRES_DB: sidebyside
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidebyside -d sidebyside"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  media_data:
  deletion_journal_data:
  # Cloud/Managed gets its own volumes, distinct from Self-Hosted's, so an
  # operator mistake that activates both profiles in the same project
  # (`COMPOSE_PROFILES=self-hosted,cloud`) cannot let a self-hosted instance
  # and a cloud instance write to the same local media/deletion-journal data.
  cloud_media_data:
  cloud_deletion_journal_data:
  postgres_dev:
