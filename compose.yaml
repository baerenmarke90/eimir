      "init": true,
      "mem_limit": "1073741824",
      "networks": {
        "app": null
      },
      "pids_limit": 64,
      "pull_policy": "always",
      "read_only": true,
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "25m0s",
      "tmpfs": [
        "/tmp:size=1g,mode=0700,uid=10001,gid=10001"
      ],
      "user": "10001:10001",
      "volumes": [
        {
          "source": "cloud_media_data",
          "target": "/var/lib/eimir/media",
          "type": "volume",
          "volume": {}
        }
      ]
