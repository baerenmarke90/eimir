name: Reuse Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read

jobs:
  reuse-review:
    name: Reuse Review
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test status drift logic
        run: python3 tools/ci/test_status_drift.py

      - name: Check living status against GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/status_drift.py --online

      # Automated version bumps do not make a new reuse decision. The component
      # has already been selected; docs/REUSE-BEFORE-BUILD.md requires the
      # review for newly introduced substantial dependencies, not routine
      # maintenance. Dependabot also cannot provide the repository-specific PR
      # body, so enforcing this gate for it would create a permanent false fail.
      - name: Exempt automated dependency updates
        id: exemption
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            echo "Automated dependency update from ${PR_AUTHOR}."
            echo "Reuse-before-build is not reviewed again."
            echo "exempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify documented reuse decision
        if: steps.exemption.outputs.exempt != 'true'
        shell: bash
        run: |
          set -euo pipefail

          body=${PR_BODY:-}

          relevant='- [x] Reuse review relevant'
          not_relevant='- [x] Reuse review not relevant'

          relevant_count=0
          not_relevant_count=0

          if grep -Fqi -- "$relevant" <<< "$body"; then
            relevant_count=1
          fi

          if grep -Fqi -- "$not_relevant" <<< "$body"; then
            not_relevant_count=1
          fi

          if [ $((relevant_count + not_relevant_count)) -ne 1 ]; then
            echo "The PR must select exactly one reuse-before-build decision."
            echo "Expected one of these lines:"
            echo "  - [x] Reuse review relevant"
            echo "  - [x] Reuse review not relevant"
            exit 1
          fi

          echo "Reuse-before-build decision is present."

      - name: Verify reuse documentation sections
        if: steps.exemption.outputs.exempt != 'true'
        shell: bash
        run: |
          set -euo pipefail

          body=${PR_BODY:-}

          grep -Fq '## Reuse-before-build' <<< "$body" || {
            echo "Section '## Reuse-before-build' is missing."
            exit 1
          }

          if grep -Fqi -- '- [x] Reuse review relevant' <<< "$body"; then
            grep -Fq '**Alternatives considered**' <<< "$body" || {
              echo "Relevant reuse review is missing 'Alternatives considered'."
              exit 1
            }
            grep -Fq '**Decision and rationale**' <<< "$body" || {
              echo "Relevant reuse review is missing 'Decision and rationale'."
              exit 1
            }
            grep -Fq '**Third-party components/providers**' <<< "$body" || {
              echo "Relevant reuse review is missing 'Third-party components/providers'."
              exit 1
            }
          else
            grep -Fq '**Rationale**' <<< "$body" || {
              echo "A 'not relevant' reuse decision requires a rationale."
              exit 1
            }
          fi

          echo "Required reuse documentation sections are present."
