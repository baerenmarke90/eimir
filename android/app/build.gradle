apply plugin: 'com.android.application'

def eimirVersionCode = Integer.parseInt((project.findProperty('eimirVersionCode')
    ?: project.findProperty('sbsVersionCode')
    ?: '1') as String)

def eimirVersionName = (project.findProperty('eimirVersionName') ?: '0.1.0') as String

def resolveSecret = { String property, String envVar, String legacyProp = null, String legacyEnv = null ->
    def value = project.findProperty(property)
    if (value != null && !value.toString().isEmpty()) return value.toString()
    value = System.getenv(envVar)
    if (value != null && !value.isEmpty()) return value
    if (legacyProp != null) {
        value = project.findProperty(legacyProp)
        if (value != null && !value.toString().isEmpty()) return value.toString()
    }
    if (legacyEnv != null) {
        value = System.getenv(legacyEnv)
        if (value != null && !value.isEmpty()) return value
    }
    return null
}

def releaseKeystore = resolveSecret(
    'eimirReleaseKeystore',
    'EIMIR_RELEASE_KEYSTORE',
    'sbsReleaseKeystore',
    'SBS_RELEASE_KEYSTORE'
)

def requireSecret = { String property, String envVar, String legacyProp = null, String legacyEnv = null ->
    def value = resolveSecret(property, envVar, legacyProp, legacyEnv)
    if (value == null || value.isEmpty()) {
        throw new GradleException(
            "Release signing needs ${property} or ${envVar}. " +
            "Supply it from the publishing environment; it must never be committed."
        )
    }
    return value
}

android {
    namespace = "de.eimir.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.eimir.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode eimirVersionCode
        versionName eimirVersionName
        testInstrumentationRunner "de.eimir.app.PushFixtureRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystore != null && !releaseKeystore.isEmpty()) {
            release {
                storeFile file(releaseKeystore)
                storePassword requireSecret(
                    'eimirReleaseKeystorePassword',
                    'EIMIR_RELEASE_KEYSTORE_PASSWORD',
                    'sbsReleaseKeystorePassword',
                    'SBS_RELEASE_KEYSTORE_PASSWORD'
                )
                keyAlias requireSecret(
                    'eimirReleaseKeyAlias',
                    'EIMIR_RELEASE_KEY_ALIAS',
                    'sbsReleaseKeyAlias',
                    'SBS_RELEASE_KEY_ALIAS'
                )
                keyPassword requireSecret(
                    'eimirReleaseKeyPassword',
                    'EIMIR_RELEASE_KEY_PASSWORD',
                    'sbsReleaseKeyPassword',
                    'SBS_RELEASE_KEY_PASSWORD'
                )
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.findByName("release")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'org.unifiedpush.android:connector:3.3.3'
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-installations'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def playStoreRelease = (project.findProperty('eimirPlayStoreRelease') ?: 'false').toString()
if (!(playStoreRelease in ['true', 'false'])) {
    throw new GradleException('eimirPlayStoreRelease must be true or false.')
}
if (playStoreRelease == 'true') {
    def clientConfiguration = file('google-services.json')
    try {
        def configured = new groovy.json.JsonSlurper().parse(clientConfiguration)
        if (!configured.project_info?.project_id || !configured.project_info?.project_number ||
            !configured.client?.any { it.client_info?.android_client_info?.package_name == 'de.eimir.app' }) {
            throw new IllegalArgumentException()
        }
    } catch (Exception invalid) {
        throw new GradleException('Play Store artifacts require Firebase client configuration for de.eimir.app.')
    }
}

// An unconfigured build still supports UnifiedPush. A supplied configuration
// must pass the plugin's normal package and resource validation.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
