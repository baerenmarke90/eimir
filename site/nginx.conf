server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Directory URLs such as /impressum redirect to /impressum/ without exposing the container port.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # Pages must revalidate so a new deployment is visible at once.
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fonts, icons and the stylesheet have stable names, so keep the cache short.
    location ~* ^/(assets|fonts)/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
