name: Web S8

on:
  pull_request:
    paths:
      - "web/**"
      - "android/**"
      - "design/tokens.json"
      - "design/designs/**"
      - "legal/**"
      - ".github/workflows/web-s8.yml"

permissions:
  contents: read

concurrency:
  group: web-s8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Reference Flow
    runs-on: ubuntu-latest
    container: node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    defaults:
      run:
        working-directory: web
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore npm download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: web-s8-npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: web-s8-npm-${{ runner.os }}-

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        run: node scripts/audit-gate.mjs

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Capacitor foundation check
        run: npm run cap:check

      - name: Production build
        run: npm run build
