name: Temporary #1007 Conflict Reconcile

on:
  push:
    branches:
      - feat/971-discover-web-integration
    paths:
      - .github/workflows/temp-reconcile-1007.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/971-discover-web-integration
          fetch-depth: 0

      - name: Restore #975 hooks alongside #971 query ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .github/reconcile-1007.py
          rm .github/reconcile-1007.py
          rm .github/workflows/temp-reconcile-1007.yml
          git add -A
          git commit -m "fix(story): preserve Timeline progressive loading after Slice 4 sync"
          git push origin HEAD:feat/971-discover-web-integration
