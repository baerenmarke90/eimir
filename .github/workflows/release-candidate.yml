name: Immutable Release Candidate

on:
  pull_request:
    paths:
      - ".github/workflows/release-candidate.yml"
      - "scripts/release_manifest.py"
      - "tools/ci/test_release_manifest.py"
      - "docs/m6/IMMUTABLE-RELEASES.md"
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer product version without the v prefix.
        required: true
        type: string
      include_android:
        description: Include unsigned Android candidate artifacts in this release channel.
        required: true
        default: true
        type: boolean
      android_version_code:
        description: Monotonically increasing Play versionCode; required only when Android is included.
        required: false
        type: number
      android_api_base_url:
        description: Backend API base URL baked into Android assets; required only when Android is included.
        required: false
        type: string
      initial_release:
        description: Select only for the first product release with no previous known-good release.
        required: true
        default: false
        type: boolean
      previous_known_good_version:
        description: Previous released SemVer without v; required unless this is the initial release.
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: immutable-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Release manifest contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run focused release-manifest tests
        run: python3 tools/ci/test_release_manifest.py

  preflight:
    name: Verify candidate inputs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate candidate inputs
        env:
          INCLUDE_ANDROID: ${{ inputs.include_android }}
          API_BASE_URL: ${{ inputs.include_android && inputs.android_api_base_url || '' }}
          ANDROID_VERSION_CODE: ${{ inputs.include_android && inputs.android_version_code || '' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import urllib.parse

          include_android = os.environ.get("INCLUDE_ANDROID", "").lower() == "true"
          url = os.environ.get("API_BASE_URL", "").strip()
          version_code = os.environ.get("ANDROID_VERSION_CODE", "").strip()
          version = os.environ.get("RELEASE_VERSION", "").strip()

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid release_version format: {version}")

          if include_android:
              try:
                  parsed_version_code = int(version_code)
              except ValueError as exc:
                  raise SystemExit("Android-inclusive candidate requires android_version_code") from exc
              if parsed_version_code <= 0:
                  raise SystemExit("android_version_code must be a positive integer")
              if not url or url.endswith(".invalid") or ".invalid" in url:
                  raise SystemExit("Android-inclusive candidate requires an explicit, non-test android_api_base_url.")
              if re.search(r"\s", url):
                  raise SystemExit("android_api_base_url must not contain whitespace")
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != "https":
                  raise SystemExit("android_api_base_url must use https scheme")
              if not parsed.netloc:
                  raise SystemExit("android_api_base_url must include host")
              if parsed.username or parsed.password:
                  raise SystemExit("android_api_base_url must not contain userinfo")
              if parsed.query or parsed.fragment:
                  raise SystemExit("android_api_base_url must not contain query or fragment")
          elif url or version_code:
              raise SystemExit("Android-excluded candidate must not provide Android URL/version inputs")
          PY

  evidence:
    name: Build and attest one source revision
    if: github.event_name != 'pull_request'
    needs: [contract, preflight]
    uses: ./.github/workflows/release-evidence.yml
    with:
      include_android: ${{ inputs.include_android }}
      # A number-typed call input rejects an empty value, which a dispatch without an
      # Android channel passes; 0 is treated as unset by the evidence workflow.
      android_version_code: ${{ inputs.include_android && inputs.android_version_code || 0 }}
      android_api_base_url: ${{ inputs.android_api_base_url }}
      release_version: ${{ inputs.release_version }}

  manifest:
    name: Bind release identity and candidate bundle
    if: github.event_name != 'pull_request'
    needs: evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact #193 evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence

      - name: Verify #193 transport checksums
        run: (cd release-evidence && sha256sum --check --strict SHA256SUMS)

      - name: Verify evidence index matches selected release channels
        env:
          INCLUDE_ANDROID: ${{ inputs.include_android }}
          EXPECTED_API_BASE_URL: ${{ inputs.android_api_base_url }}
          EXPECTED_VERSION: ${{ inputs.release_version }}
          EXPECTED_VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          index = json.loads(Path("release-evidence/evidence-index.json").read_text(encoding="utf-8"))
          android = index.get("android", {})
          expected_included = os.environ["INCLUDE_ANDROID"].lower() == "true"
          if android.get("included", True) is not expected_included:
              raise SystemExit("evidence-index Android channel mismatch")
          if not expected_included:
              if android != {"included": False, "signing": "not-applicable"}:
                  raise SystemExit("Android-excluded evidence must carry only explicit not-applicable metadata")
          else:
              expected_api = os.environ["EXPECTED_API_BASE_URL"].strip().rstrip("/")
              if android.get("apiBaseUrl") != expected_api:
                  raise SystemExit(f"evidence-index apiBaseUrl mismatch: {android.get('apiBaseUrl')!r} != {expected_api!r}")
              if android.get("versionName") != os.environ["EXPECTED_VERSION"]:
                  raise SystemExit("evidence-index versionName mismatch")
              if android.get("versionCode") != int(os.environ["EXPECTED_VERSION_CODE"]):
                  raise SystemExit("evidence-index versionCode mismatch")
              if android.get("launchableActivity") != "de.eimir.app.MainActivity":
                  raise SystemExit("evidence-index launchableActivity mismatch")
          PY

      - name: Resolve previous-known-good manifest
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_RELEASE: ${{ inputs.initial_release }}
          PREVIOUS_VERSION: ${{ inputs.previous_known_good_version }}
        run: |
          set -euo pipefail
          if [ "$INITIAL_RELEASE" = "true" ]; then
            if [ -n "$PREVIOUS_VERSION" ]; then
              echo "The initial release cannot declare a previous-known-good version." >&2
              exit 1
            fi
            echo "argument=--initial-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "A non-initial release requires previous_known_good_version." >&2
            exit 1
          fi
          mkdir -p previous-known-good
          if ! gh release download "v${PREVIOUS_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern eimir-release-manifest.json \
            --dir previous-known-good; then
            # Published assets are immutable. The first eimir release may
            # therefore have to consume the former asset name once.
            gh release download "v${PREVIOUS_VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern sidebyside-release-manifest.json \
              --dir previous-known-good
            mv previous-known-good/sidebyside-release-manifest.json \
              previous-known-good/eimir-release-manifest.json
          fi
          test -s previous-known-good/eimir-release-manifest.json
          echo "argument=--previous-manifest previous-known-good/eimir-release-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Build immutable release manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PREVIOUS_ARGUMENT: ${{ steps.previous.outputs.argument }}
        run: |
          set -euo pipefail
          # PREVIOUS_ARGUMENT is produced only by the closed choices above.
          # shellcheck disable=SC2086
          python3 scripts/release_manifest.py build \
            --evidence-index release-evidence/evidence-index.json \
            --version "$RELEASE_VERSION" \
            $PREVIOUS_ARGUMENT \
            --output release-evidence/eimir-release-manifest.json

      - name: Verify artifact and SBOM digests against manifest
        run: |
          python3 scripts/release_manifest.py verify \
            --manifest release-evidence/eimir-release-manifest.json \
            --artifact-root release-evidence

      - name: Write candidate release notes
        shell: bash
        env:
          INCLUDE_ANDROID: ${{ inputs.include_android }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          if [ "$INCLUDE_ANDROID" = "true" ]; then
            channel_note="Android candidate artifacts are included but remain unsigned and are not store artifacts."
          else
            channel_note="Android is explicitly excluded from this candidate channel set."
          fi
          cat > release-evidence/RELEASE-NOTES.md <<EOF
          # eimir. v${RELEASE_VERSION} release candidate

          Source revision: `${SOURCE_REVISION}`

          This candidate is a build-once immutable artifact set. Its machine-readable
          identity is `eimir-release-manifest.json`; `SHA256SUMS` and #193
          attestations provide artifact/SBOM evidence.

          ${channel_note}
          EOF

      - name: Extend candidate checksums
        run: |
          (
            cd release-evidence
            sha256sum eimir-release-manifest.json RELEASE-NOTES.md > RELEASE-SHA256SUMS
            sha256sum --check --strict RELEASE-SHA256SUMS
          )

      - name: Upload immutable candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eimir-release-candidate-v${{ inputs.release_version }}-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
