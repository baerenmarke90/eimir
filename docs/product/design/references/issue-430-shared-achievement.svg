  <g transform="translate(18 286)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#8C8094">GEMEINSAME LISTE</text>
    <text x="0" y="31" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#231E28">Einkauf</text>
    <text x="354" y="28" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#BE2340">Liste öffnen →</text>

    <g transform="translate(0 52)" font-family="Arial,sans-serif" font-size="15">
      <circle cx="20" cy="19" r="18" fill="#D93D59"/><path d="m12 19 5 5 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="24" fill="#5E5466" text-decoration="line-through">Milch</text>
      <circle cx="20" cy="67" r="18" fill="#D93D59"/><path d="m12 67 5 5 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="72" fill="#5E5466" text-decoration="line-through">Brot</text>
      <circle cx="20" cy="115" r="18" fill="#D93D59"/><path d="m12 115 5 5 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="120" fill="#5E5466" text-decoration="line-through">Kaffee</text>
    </g>

    <!-- in-context confirmed celebration -->
    <g transform="translate(0 194)" filter="url(#shadow)">
      <rect width="354" height="150" rx="20" fill="url(#success)" stroke="#B9DDD6"/>
      <circle cx="36" cy="38" r="20" fill="#DDF1EC"/>
      <path d="m27 38 6 6 13-15" fill="none" stroke="#207266" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="34" font-family="Georgia,serif" font-size="21" font-weight="700" fill="#1C5F54">Gemeinsam geschafft</text>
      <text x="68" y="57" font-family="Arial,sans-serif" font-size="13" fill="#5E5466">Eure Einkaufsliste ist komplett.</text>
      <text x="24" y="94" font-family="Arial,sans-serif" font-size="15" fill="#231E28">Ein kleiner gemeinsamer Haken – als Team erledigt.</text>
      <rect x="24" y="111" width="122" height="29" rx="15" fill="#EDF7F5"/>
      <text x="85" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#207266">Kurz gefeiert ✓</text>
    </g>
  </g>

  <!-- next content remains in place -->
  <g transform="translate(18 668)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#8C8094">DEMNÄCHST</text>
    <text x="0" y="30" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#231E28">Wochenende in den Bergen</text>
    <text x="0" y="53" font-family="Arial,sans-serif" font-size="13" fill="#5E5466">12.–14. Oktober</text>
