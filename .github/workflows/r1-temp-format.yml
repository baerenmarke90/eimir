name: R1 Temporary Format

on:
  push:
    branches:
      - feat/964-r1-memory-capture
    paths:
      - .github/workflows/r1-temp-format.yml

permissions:
  contents: write

jobs:
  format:
    name: Format R1 Web evidence tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/964-r1-memory-capture

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the repository formatter only to the two failing files
        working-directory: web
        run: >-
          npx biome format --write
          e2e/tests/create-surface-visual-checks.spec.ts
          e2e/tests/r1-memory-capture-evidence.spec.ts

      - name: Verify formatter is clean
        working-directory: web
        run: npm run format:check

      - name: Commit the mechanical formatting fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/e2e/tests/create-surface-visual-checks.spec.ts web/e2e/tests/r1-memory-capture-evidence.spec.ts; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/tests/create-surface-visual-checks.spec.ts web/e2e/tests/r1-memory-capture-evidence.spec.ts
          git commit -m "style(web): format R1 evidence tests"
          git push origin HEAD:feat/964-r1-memory-capture
