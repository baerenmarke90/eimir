name: Publish Immutable Release

on:
  pull_request:
    paths:
      - ".github/workflows/release-publish.yml"
      - ".github/actions/attest-release-artifact/**"
      - "compose.yaml"
      - "deploy/self-hosted-release.env.example"
      - "scripts/self_hosted_release.py"
      - "scripts/check_runtime_environment.py"
      - "scripts/release_manifest.py"
      - "scripts/verify_release_asset_set.py"
      - "tools/ci/test_release_manifest.py"
      - "tools/ci/test_release_publish_workflow.py"
      - "tools/ci/test_verify_release_asset_set.py"
      - "docs/SELF-HOSTING.md"
      - "docs/m6/IMMUTABLE-RELEASES.md"
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer product version without the v prefix.
        required: true
        type: string
      include_android:
        description: Include and sign Android APK/AAB in this release channel.
        required: true
        default: true
        type: boolean
      android_version_code:
        description: Monotonically increasing Google Play versionCode; required only when Android is included.
        required: false
        type: number
      android_api_base_url:
        description: Backend API base URL baked into Android assets; required only when Android is included.
        required: false
        type: string
      initial_release:
        description: Select only for the first product release with no previous known-good release.
        required: true
        default: false
        type: boolean
      previous_known_good_version:
        description: Previous released SemVer without v; required unless this is the initial release.
        required: false
        type: string
      confirm_publish:
        description: Confirm creation of the immutable Git tag and GitHub Release after protected publication checks.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: publish-release-${{ github.event_name == 'workflow_dispatch' && 'protected' || github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "1.42.3"
  SYFT_LINUX_AMD64_SHA256: "0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509"
  ANDROID_PROJECT_DIR: "android"

jobs:
  contract:
    name: Release publication contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run immutable release tests
        run: |
          python3 tools/ci/test_release_manifest.py
          python3 tools/ci/test_release_publish_workflow.py
          python3 tools/ci/test_verify_release_asset_set.py

  evidence:
    name: Build and attest one source revision
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    uses: ./.github/workflows/release-evidence.yml
    with:
      include_android: ${{ inputs.include_android }}
      # A number-typed call input rejects an empty value, which a dispatch without an
      # Android channel passes; 0 is treated as unset by the evidence workflow.
      android_version_code: ${{ inputs.include_android && inputs.android_version_code || 0 }}
      android_api_base_url: ${{ inputs.android_api_base_url }}
      release_version: ${{ inputs.release_version }}

  preflight:
    name: Verify immutable release inputs
    if: github.event_name == 'workflow_dispatch'
    needs: evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download exact #193 evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence

      - name: Verify #193 transport checksums
        run: (cd release-evidence && sha256sum --check --strict SHA256SUMS)

      - name: Validate candidate inputs
        env:
          INCLUDE_ANDROID: ${{ inputs.include_android }}
          API_BASE_URL: ${{ inputs.include_android && inputs.android_api_base_url || '' }}
          ANDROID_VERSION_CODE: ${{ inputs.include_android && inputs.android_version_code || '' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import urllib.parse

          include_android = os.environ.get("INCLUDE_ANDROID", "").lower() == "true"
          url = os.environ.get("API_BASE_URL", "").strip()
          version_code = os.environ.get("ANDROID_VERSION_CODE", "").strip()
          version = os.environ.get("RELEASE_VERSION", "").strip()

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid release_version format: {version}")

          if include_android:
              try:
                  parsed_version_code = int(version_code)
              except ValueError as exc:
                  raise SystemExit("Android-inclusive publication requires android_version_code") from exc
              if parsed_version_code <= 0:
                  raise SystemExit("android_version_code must be a positive integer")
              if not url or url.endswith(".invalid") or ".invalid" in url:
                  raise SystemExit("Android-inclusive publication requires an explicit, non-test android_api_base_url.")
              if re.search(r"\s", url):
                  raise SystemExit("android_api_base_url must not contain whitespace")
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != "https":
                  raise SystemExit("android_api_base_url must use https scheme")
              if not parsed.netloc:
                  raise SystemExit("android_api_base_url must include host")
              if parsed.username or parsed.password:
                  raise SystemExit("android_api_base_url must not contain userinfo")
              if parsed.query or parsed.fragment:
                  raise SystemExit("android_api_base_url must not contain query or fragment")
          elif url or version_code:
              raise SystemExit("Android-excluded publication must not provide Android URL/version inputs")
          PY

      - name: Require explicit publish confirmation
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_PUBLISH" != "true" ]; then
            echo "Final publication requires confirm_publish=true." >&2
            exit 1
          fi

      - name: Require source revision to be merged into main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release source $GITHUB_SHA is not reachable from origin/main." >&2
            exit 1
          fi

      - name: Require existing repository checks to be green
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100" \
            > "$RUNNER_TEMP/check-runs.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"] + "/check-runs.json").read_text())
          current = f"/actions/runs/{os.environ['CURRENT_RUN_ID']}/"
          checks = [
              item for item in data.get("check_runs", [])
              if current not in (item.get("details_url") or "")
          ]
          if not checks:
              raise SystemExit("No pre-existing CI/security checks found for release source")
          pending = [item["name"] for item in checks if item.get("status") != "completed"]
          failed = [
              f"{item['name']}={item.get('conclusion')}"
              for item in checks
              if item.get("status") == "completed"
              and item.get("conclusion") not in {"success", "neutral", "skipped"}
          ]
          if pending:
              raise SystemExit("Release source still has pending checks: " + ", ".join(sorted(pending)))
          if failed:
              raise SystemExit("Release source has non-green checks: " + ", ".join(sorted(failed)))
          print(f"Verified {len(checks)} pre-existing checks for release source")
          PY

      - name: Require release tag and GitHub Release to be unused
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists and is immutable." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists and is immutable." >&2
            exit 1
          fi

      - name: Resolve previous-known-good manifest
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_RELEASE: ${{ inputs.initial_release }}
          PREVIOUS_VERSION: ${{ inputs.previous_known_good_version }}
        run: |
          set -euo pipefail
          mkdir -p release-preflight
          if [ "$INITIAL_RELEASE" = "true" ]; then
            if [ -n "$PREVIOUS_VERSION" ]; then
              echo "The initial release cannot declare a previous-known-good version." >&2
              exit 1
            fi
            touch release-preflight/INITIAL_RELEASE
            echo "argument=--initial-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "A non-initial release requires previous_known_good_version." >&2
            exit 1
          fi
          mkdir -p release-preflight/previous-known-good
          if ! gh release download "v${PREVIOUS_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern eimir-release-manifest.json \
            --dir release-preflight/previous-known-good; then
            # Published assets are immutable. The first eimir release may
            # therefore have to consume the former asset name once.
            gh release download "v${PREVIOUS_VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern sidebyside-release-manifest.json \
              --dir release-preflight/previous-known-good
            mv release-preflight/previous-known-good/sidebyside-release-manifest.json \
              release-preflight/previous-known-good/eimir-release-manifest.json
          fi
          test -s release-preflight/previous-known-good/eimir-release-manifest.json
          echo "argument=--previous-manifest release-preflight/previous-known-good/eimir-release-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Validate release identity before protected signing
        shell: bash
        env:
          INCLUDE_ANDROID: ${{ inputs.include_android }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          EXPECTED_API_BASE_URL: ${{ inputs.android_api_base_url }}
          PREVIOUS_ARGUMENT: ${{ steps.previous.outputs.argument }}
        run: |
          set -euo pipefail
          # PREVIOUS_ARGUMENT is emitted only by the closed choices above.
          # shellcheck disable=SC2086
          python3 scripts/release_manifest.py build \
            --evidence-index release-evidence/evidence-index.json \
            --version "$RELEASE_VERSION" \
            $PREVIOUS_ARGUMENT \
            --output release-preflight/preflight-manifest.json
          test "$(python3 -c 'import json; print(json.load(open("release-preflight/preflight-manifest.json"))["sourceRevision"])')" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("release-preflight/preflight-manifest.json").read_text(encoding="utf-8"))
          expected_included = os.environ["INCLUDE_ANDROID"].lower() == "true"
          android = manifest.get("android", {})
          if android.get("included", True) is not expected_included:
              raise SystemExit("preflight-manifest Android channel mismatch")
          if not expected_included:
              if android != {"included": False, "signing": "not-applicable"}:
                  raise SystemExit("Android-excluded preflight must carry only explicit not-applicable metadata")
          else:
              expected_api = os.environ["EXPECTED_API_BASE_URL"].strip().rstrip("/")
              if android.get("apiBaseUrl") != expected_api:
                  raise SystemExit(f"preflight-manifest apiBaseUrl mismatch: {android.get('apiBaseUrl')!r} != {expected_api!r}")
              if android.get("launchableActivity") != "de.eimir.app.MainActivity":
                  raise SystemExit("preflight-manifest launchableActivity mismatch")
          PY

      - name: Upload verified preflight state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-preflight-${{ github.sha }}
          path: release-preflight/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Sign and publish immutable release
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: production-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download exact #193 evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence

      - name: Download retained #193 attestations
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-attestations-${{ github.sha }}
          path: release-evidence/attestations

      - name: Download verified preflight state
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-preflight-${{ github.sha }}
          path: release-preflight

      - name: Re-verify transported #193 evidence
        run: (cd release-evidence && sha256sum --check --strict SHA256SUMS)

      - name: Set up Node.js 24.21.0
        if: inputs.include_android
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.21.0"

      - name: Set up JDK 21
        if: inputs.include_android
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache and validate wrapper
        if: inputs.include_android
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify pinned Gradle wrapper JAR
        if: inputs.include_android
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        run: |
          printf '%s  %s\n' \
            '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172' \
            'gradle/wrapper/gradle-wrapper.jar' \
            | sha256sum --check --strict -

      - name: Install Android SDK 36
        if: inputs.include_android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Build and sync Capacitor web bundle
        if: inputs.include_android
        working-directory: web
        env:
          ANDROID_API_BASE_URL: ${{ inputs.android_api_base_url }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          VITE_EIMIR_API_BASE_URL="$ANDROID_API_BASE_URL" npm run cap:build:web
          npm run cap:sync

      - name: Verify generated native wrapper files have not drifted
        if: inputs.include_android
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            android/capacitor.settings.gradle \
            android/app/capacitor.build.gradle

      - name: Build and verify final signed Android artifacts
        if: inputs.include_android
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        shell: bash
        env:
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          KEYSTORE_BASE64: ${{ secrets.EIMIR_RELEASE_KEYSTORE_BASE64 || secrets.SBS_RELEASE_KEYSTORE_BASE64 }}
          EIMIR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.EIMIR_RELEASE_KEYSTORE_PASSWORD || secrets.SBS_RELEASE_KEYSTORE_PASSWORD }}
          EIMIR_RELEASE_KEY_ALIAS: ${{ secrets.EIMIR_RELEASE_KEY_ALIAS || secrets.SBS_RELEASE_KEY_ALIAS }}
          EIMIR_RELEASE_KEY_PASSWORD: ${{ secrets.EIMIR_RELEASE_KEY_PASSWORD || secrets.SBS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 EIMIR_RELEASE_KEYSTORE_PASSWORD EIMIR_RELEASE_KEY_ALIAS EIMIR_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required production-release signing secret ${name} is missing." >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/eimir-upload.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export EIMIR_RELEASE_KEYSTORE="$keystore"

          ./gradlew --no-daemon --stacktrace --dependency-verification strict \
            -PeimirVersionCode="$ANDROID_VERSION_CODE" \
            -PeimirVersionName="$RELEASE_VERSION" \
            :app:assembleRelease :app:bundleRelease

          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          aab=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)
          test -n "$apk"
          test -n "$aab"
          test -s "$apk"
          test -s "$aab"
          export apk aab

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          jarsigner -verify "$aab" >/dev/null

          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$aapt"
          badging=$("$aapt" dump badging "$apk")
          echo "$badging" | grep -q "package: name='de.sidebyside.app'"
          echo "$badging" | grep -q "versionCode='${ANDROID_VERSION_CODE}'"
          echo "$badging" | grep -q "versionName='${RELEASE_VERSION}'"
          echo "$badging" | grep -q "launchable-activity: name='de.eimir.app.MainActivity'"

          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$analyzer"
          test "$("$analyzer" manifest application-id "$apk")" = "de.sidebyside.app"
          test "$("$analyzer" manifest version-name "$apk")" = "$RELEASE_VERSION"
          test "$("$analyzer" manifest version-code "$apk")" = "$ANDROID_VERSION_CODE"

          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          apk_path = Path(os.environ["apk"])
          aab_path = Path(os.environ["aab"])

          def inspect_archive(archive_path: Path, prefix: str) -> None:
              with zipfile.ZipFile(archive_path, "r") as z:
                  names = set(z.namelist())
                  index_html_path = f"{prefix}public/index.html"
                  config_path = f"{prefix}capacitor.config.json"
                  if index_html_path not in names:
                      raise SystemExit(f"Missing {index_html_path} in {archive_path.name}")
                  if config_path not in names:
                      raise SystemExit(f"Missing {config_path} in {archive_path.name}")
                  config_data = json.loads(z.read(config_path).decode("utf-8"))
                  server = config_data.get("server", {})
                  if "url" in server:
                      raise SystemExit(f"Forbidden remote server.url in {config_path} of {archive_path.name}")
                  if "allowNavigation" in server:
                      raise SystemExit(f"Forbidden allowNavigation in {config_path} of {archive_path.name}")
                  cap_http = config_data.get("plugins", {}).get("CapacitorHttp", {})
                  if cap_http.get("enabled") is not True:
                      raise SystemExit(f"CapacitorHttp plugin must be enabled in {config_path} of {archive_path.name}")

          inspect_archive(apk_path, "assets/")
          inspect_archive(aab_path, "base/assets/")
          print("Verified signed APK and AAB bundle contents.")
          PY

          mkdir -p ../release-evidence/android
          cp -- "$apk" ../release-evidence/android/eimir-release.apk
          cp -- "$aab" ../release-evidence/android/eimir-release.aab
          rm -f \
            ../release-evidence/android/eimir-release-unsigned.apk \
            ../release-evidence/android/eimir-release-unsigned.aab

      - name: Install verified Syft release
        if: inputs.include_android
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/syft"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SYFT_LINUX_AMD64_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" syft
          "$install_dir/syft" version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Regenerate Android SPDX SBOMs for signed bytes
        if: inputs.include_android
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          syft scan "file:release-evidence/android/eimir-release.apk" \
            -o "spdx-json=release-evidence/sbom/android-apk.spdx.json"
          syft scan "file:release-evidence/android/eimir-release.aab" \
            -o "spdx-json=release-evidence/sbom/android-aab.spdx.json"

      - name: Rebind evidence index to final signed Android bytes
        if: inputs.include_android
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          ANDROID_API_BASE_URL: ${{ inputs.android_api_base_url }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release-evidence")
          index_path = root / "evidence-index.json"
          evidence = json.loads(index_path.read_text(encoding="utf-8"))

          if evidence.get("sourceRevision") != os.environ["SOURCE_REVISION"]:
              raise SystemExit("#193 evidence sourceRevision changed before publication")
          android = evidence.get("android", {})
          if android.get("applicationId") != "de.sidebyside.app":
              raise SystemExit("Unexpected Android applicationId in #193 evidence")
          if android.get("versionName") != os.environ["RELEASE_VERSION"]:
              raise SystemExit("Android versionName does not match release version")
          if android.get("versionCode") != int(os.environ["ANDROID_VERSION_CODE"]):
              raise SystemExit("Android versionCode does not match publication input")
          expected_api = os.environ["ANDROID_API_BASE_URL"].strip().rstrip("/")
          if android.get("apiBaseUrl") != expected_api:
              raise SystemExit("Android apiBaseUrl does not match publication input")
          if android.get("launchableActivity") != "de.eimir.app.MainActivity":
              raise SystemExit("Unexpected Android launchableActivity in #193 evidence")

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          replacements = {
              "android-apk": (
                  "android/eimir-release.apk",
                  "sbom/android-apk.spdx.json",
              ),
              "android-aab": (
                  "android/eimir-release.aab",
                  "sbom/android-aab.spdx.json",
              ),
          }
          seen = set()
          for artifact in evidence.get("artifacts", []):
              artifact_id = artifact.get("id")
              if artifact_id not in replacements:
                  continue
              relative, sbom_relative = replacements[artifact_id]
              artifact_path = root / relative
              sbom_path = root / sbom_relative
              if not artifact_path.is_file() or not sbom_path.is_file():
                  raise SystemExit(f"Missing final signed release evidence for {artifact_id}")
              artifact["path"] = relative
              artifact["sha256"] = sha256(artifact_path)
              artifact["sbom"] = sbom_relative
              artifact["sbomSha256"] = sha256(sbom_path)
              seen.add(artifact_id)
          if seen != set(replacements):
              raise SystemExit("Android release evidence set is incomplete")

          android["signing"] = "signed-release"
          android["finalSignedArtifactRequiresFreshAttestation"] = False
          evidence["android"] = android
          index_path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove unsigned Android attestation bundles
        if: inputs.include_android
        run: |
          rm -f \
            release-evidence/attestations/android-apk-provenance.json \
            release-evidence/attestations/android-apk-sbom.json \
            release-evidence/attestations/android-aab-provenance.json \
            release-evidence/attestations/android-aab-sbom.json

      - name: Attest final signed Android APK
        if: inputs.include_android
        uses: ./.github/actions/attest-release-artifact
        with:
          subject-path: release-evidence/android/eimir-release.apk
          sbom-path: release-evidence/sbom/android-apk.spdx.json
          bundle-directory: release-evidence/attestations
          bundle-prefix: android-apk-signed

      - name: Attest final signed Android AAB
        if: inputs.include_android
        uses: ./.github/actions/attest-release-artifact
        with:
          subject-path: release-evidence/android/eimir-release.aab
          sbom-path: release-evidence/sbom/android-aab.spdx.json
          bundle-directory: release-evidence/attestations
          bundle-prefix: android-aab-signed

      - name: Verify retained final attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDE_ANDROID: ${{ inputs.include_android }}
        run: |
          set -euo pipefail
          gh attestation trusted-root > release-evidence/attestations/trusted_root.jsonl
          repo="$GITHUB_REPOSITORY"
          root="release-evidence/attestations/trusted_root.jsonl"
          evidence_signer="$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml"
          publish_signer="$GITHUB_REPOSITORY/.github/workflows/release-publish.yml"

          verify_subject() {
            local subject="$1"
            local prefix="$2"
            local signer="$3"
            gh attestation verify "$subject" -R "$repo" \
              --bundle "release-evidence/attestations/${prefix}-provenance.json" \
              --custom-trusted-root "$root" \
              --signer-workflow "$signer"
            gh attestation verify "$subject" -R "$repo" \
              --bundle "release-evidence/attestations/${prefix}-sbom.json" \
              --custom-trusted-root "$root" \
              --signer-workflow "$signer" \
              --predicate-type "https://spdx.dev/Document/v2.3"
          }

          verify_subject release-evidence/backend-runtime.image.tar backend-runtime "$evidence_signer"
          verify_subject release-evidence/web-runtime.image.tar web-runtime "$evidence_signer"
          if [ "$INCLUDE_ANDROID" = "true" ]; then
            verify_subject release-evidence/android/eimir-release.apk android-apk-signed "$publish_signer"
            verify_subject release-evidence/android/eimir-release.aab android-aab-signed "$publish_signer"
          fi

      - name: Build final release manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          INITIAL_RELEASE: ${{ inputs.initial_release }}
        run: |
          set -euo pipefail
          if [ "$INITIAL_RELEASE" = "true" ]; then
            previous_argument="--initial-release"
          else
            previous_manifest="release-preflight/previous-known-good/eimir-release-manifest.json"
            test -s "$previous_manifest"
            previous_argument="--previous-manifest $previous_manifest"
          fi
          # previous_argument is produced only by the closed choices above.
          # shellcheck disable=SC2086
          python3 scripts/release_manifest.py build \
            --evidence-index release-evidence/evidence-index.json \
            --version "$RELEASE_VERSION" \
            $previous_argument \
            --require-signed-android \
            --output release-evidence/eimir-release-manifest.json
          python3 scripts/release_manifest.py verify \
            --manifest release-evidence/eimir-release-manifest.json \
            --artifact-root release-evidence \
            --require-signed-android

      - name: Publish exact build-once runtime images to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          backend_repo="ghcr.io/${owner}/eimir-backend"
          web_repo="ghcr.io/${owner}/eimir-web"
          version_tag="v${RELEASE_VERSION}"
          source_tag="sha-${SOURCE_REVISION}"
          transport_tag="publish-${SOURCE_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # GHCR does not provide server-side immutable tags. The sha-/v aliases below
          # are discoverability only and are never trusted as release identity. The
          # exact digest from the actual push is the authority recorded in the immutable
          # GitHub Release asset and consumed by Production.
          manifest_state() {
            local ref="$1"
            local output
            local status

            set +e
            output=$(docker manifest inspect "$ref" 2>&1)
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              printf '%s\n' exists
              return 0
            fi
            if printf '%s\n' "$output" | grep -qiE 'manifest unknown|no such manifest'; then
              printf '%s\n' absent
              return 0
            fi

            echo "Unable to verify registry alias for ${ref}; refusing publication." >&2
            return 1
          }

          require_single_manifest() {
            local digest_ref="$1"
            local output
            local status

            set +e
            output=$(docker manifest inspect "$digest_ref" 2>&1)
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "Unable to inspect resolved registry digest ${digest_ref}; refusing publication." >&2
              return 1
            fi

            if ! MANIFEST_JSON="$output" python3 - <<'PY'
          import json
          import os

          manifest = json.loads(os.environ["MANIFEST_JSON"])
          index_types = {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }
          single_types = {
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          }
          if not isinstance(manifest, dict):
              raise SystemExit("registry digest did not resolve to one manifest object")
          media_type = manifest.get("mediaType")
          if isinstance(manifest.get("manifests"), list) or media_type in index_types:
              raise SystemExit("registry digest resolves to a multi-platform index")
          if media_type not in single_types:
              raise SystemExit(f"unsupported registry manifest media type: {media_type!r}")
          if not isinstance(manifest.get("config"), dict) or not isinstance(manifest.get("layers"), list):
              raise SystemExit("registry digest is not a single image manifest")
          PY
            then
              echo "Registry digest ${digest_ref} is not a supported single-image manifest; refusing publication." >&2
              return 1
            fi
          }

          extract_registry_digest() {
            local output="$1"
            local digest
            digest=$(printf '%s\n' "$output" \
              | grep -Eo 'sha256:[0-9a-f]{64}' \
              | tail -n 1 || true)
            if [ -z "$digest" ]; then
              echo "Docker did not report a registry digest; refusing publication." >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }

          pull_single_digest() {
            local ref="$1"
            local repository="$2"
            local output
            local status
            local digest
            local digest_ref

            set +e
            output=$(docker pull "$ref" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output" >&2
            if [ "$status" -ne 0 ]; then
              echo "Unable to pull registry reference ${ref}; refusing publication." >&2
              return 1
            fi
            digest=$(extract_registry_digest "$output") || return 1
            digest_ref="${repository}@${digest}"
            require_single_manifest "$digest_ref" || return 1
            printf '%s\n' "$digest_ref"
          }

          push_single_digest() {
            local ref="$1"
            local repository="$2"
            local output
            local status
            local digest
            local digest_ref

            set +e
            output=$(docker push "$ref" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output" >&2
            if [ "$status" -ne 0 ]; then
              echo "Unable to push registry reference ${ref}; refusing publication." >&2
              return 1
            fi
            digest=$(extract_registry_digest "$output") || return 1
            digest_ref="${repository}@${digest}"
            require_single_manifest "$digest_ref" || return 1
            printf '%s\n' "$digest_ref"
          }

          ensure_alias_matches() {
            local alias_ref="$1"
            local repository="$2"
            local expected_digest_ref="$3"
            local state
            local actual_digest_ref

            state=$(manifest_state "$alias_ref")
            if [ "$state" = "exists" ]; then
              actual_digest_ref=$(pull_single_digest "$alias_ref" "$repository")
              if [ "$actual_digest_ref" != "$expected_digest_ref" ]; then
                echo "Registry alias ${alias_ref} already points to a different digest." >&2
                exit 1
              fi
              return 0
            fi
            if [ "$state" != "absent" ]; then
              echo "Unexpected registry alias state for ${alias_ref}." >&2
              exit 1
            fi

            # Alias creation is intentionally not an integrity primitive: GHCR tags can
            # be moved by another package writer. Verify the digest reported by this
            # push, then rely only on expected_digest_ref for release identity.
            docker tag "$expected_digest_ref" "$alias_ref"
            actual_digest_ref=$(push_single_digest "$alias_ref" "$repository")
            if [ "$actual_digest_ref" != "$expected_digest_ref" ]; then
              echo "Registry alias ${alias_ref} published with a different digest." >&2
              exit 1
            fi
          }

          require_image_label() {
            local image="$1"
            local key="$2"
            local expected="$3"
            local actual

            actual=$(docker image inspect "$image" --format "{{ index .Config.Labels \"${key}\" }}")
            if [ "$actual" != "$expected" ]; then
              echo "Release image ${image} label ${key} does not match the release identity; refusing publication." >&2
              exit 1
            fi
          }

          publish_archive() {
            local archive="$1"
            local source_image="$2"
            local repository="$3"
            local result_file="$4"

            docker load --input "$archive" >/dev/null
            local local_id
            local remote_id
            local transport_ref
            local transport_digest_ref
            local source_ref
            local version_ref
            local digest
            local_id=$(docker image inspect "$source_image" --format '{{.Id}}')
            test -n "$local_id"

            # The image must describe its own identity: the labels were baked in
            # by the #193 evidence build and are part of the attested digest.
            require_image_label "$source_image" org.opencontainers.image.revision "$SOURCE_REVISION"
            require_image_label "$source_image" org.opencontainers.image.version "$RELEASE_VERSION"

            transport_ref="${repository}:${transport_tag}"
            docker tag "$source_image" "$transport_ref"
            transport_digest_ref=$(push_single_digest "$transport_ref" "$repository")
            docker pull "$transport_digest_ref" >/dev/null
            remote_id=$(docker image inspect "$transport_digest_ref" --format '{{.Id}}')
            if [ "$remote_id" != "$local_id" ]; then
              echo "Published registry digest does not resolve to the release image bytes." >&2
              exit 1
            fi

            source_ref="${repository}:${source_tag}"
            version_ref="${repository}:${version_tag}"
            ensure_alias_matches "$source_ref" "$repository" "$transport_digest_ref"
            ensure_alias_matches "$version_ref" "$repository" "$transport_digest_ref"

            digest="${transport_digest_ref#*@}"
            printf '%s@%s\n' "$version_ref" "$digest" > "$result_file"
          }

          publish_archive \
            release-evidence/backend-runtime.image.tar \
            "eimir-backend:evidence-${SOURCE_REVISION}" \
            "$backend_repo" \
            "$RUNNER_TEMP/backend-image-ref"
          publish_archive \
            release-evidence/web-runtime.image.tar \
            "eimir-web:evidence-${SOURCE_REVISION}" \
            "$web_repo" \
            "$RUNNER_TEMP/web-image-ref"

          export BACKEND_IMAGE_REF WEB_IMAGE_REF
          BACKEND_IMAGE_REF=$(cat "$RUNNER_TEMP/backend-image-ref")
          WEB_IMAGE_REF=$(cat "$RUNNER_TEMP/web-image-ref")
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("release-evidence/eimir-release-manifest.json").read_text(encoding="utf-8")
          )
          artifacts = {item["id"]: item for item in manifest["artifacts"]}

          def image_record(reference: str, artifact_id: str, roles: list[str]) -> dict[str, object]:
              if "@sha256:" not in reference:
                  raise SystemExit(f"Published {artifact_id} image is not digest-qualified")
              return {
                  "reference": reference,
                  "digest": reference.split("@", 1)[1],
                  "releaseArtifactSha256": artifacts[artifact_id]["sha256"],
                  "roles": roles,
              }

          identity = {
              "schemaVersion": 1,
              "kind": "eimir-self-hosted-image-identity",
              "product": manifest["product"],
              "sourceRevision": manifest["sourceRevision"],
              "releaseManifest": "eimir-release-manifest.json",
              "images": {
                  "backend": image_record(
                      os.environ["BACKEND_IMAGE_REF"],
                      "backend-runtime",
                      ["api", "worker", "migrate"],
                  ),
                  "web": image_record(
                      os.environ["WEB_IMAGE_REF"],
                      "web-runtime",
                      ["web"],
                  ),
              },
          }
          Path("release-evidence/self-hosted-image-identity.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          docker logout ghcr.io >/dev/null

      - name: Verify anonymous GHCR consumption
        shell: bash
        run: |
          set -euo pipefail
          backend_ref=$(cat "$RUNNER_TEMP/backend-image-ref")
          web_ref=$(cat "$RUNNER_TEMP/web-image-ref")
          anonymous_root=$(mktemp -d)
          anonymous_config="$anonymous_root/client"
          anonymous_data="$anonymous_root/data"
          anonymous_exec="$anonymous_root/exec"
          anonymous_socket="$anonymous_root/docker.sock"
          anonymous_pid="$anonymous_root/docker.pid"
          anonymous_log="$anonymous_root/dockerd.log"
          mkdir -p "$anonymous_config" "$anonymous_data" "$anonymous_exec"
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          unset DOCKER_CONTEXT DOCKER_CERT_PATH DOCKER_TLS_VERIFY

          cleanup_anonymous_docker() {
            set +e
            if [ -s "$anonymous_pid" ]; then
              sudo kill "$(cat "$anonymous_pid")" >/dev/null 2>&1 || true
              for _ in $(seq 1 20); do
                if ! sudo kill -0 "$(cat "$anonymous_pid")" >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
            fi
            sudo rm -rf "$anonymous_root"
          }
          trap cleanup_anonymous_docker EXIT

          sudo dockerd \
            --host="unix://${anonymous_socket}" \
            --data-root="$anonymous_data" \
            --exec-root="$anonymous_exec" \
            --pidfile="$anonymous_pid" \
            --storage-driver=vfs \
            --iptables=false \
            --bridge=none \
            --ip-forward=false \
            --ip-masq=false \
            > "$anonymous_log" 2>&1 &

          ready=false
          for _ in $(seq 1 60); do
            if DOCKER_HOST="unix://${anonymous_socket}" DOCKER_CONFIG="$anonymous_config" \
              docker info >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "Isolated anonymous Docker daemon did not become ready." >&2
            tail -n 100 "$anonymous_log" >&2 || true
            exit 1
          fi

          for ref in "$backend_ref" "$web_ref"; do
            if ! DOCKER_HOST="unix://${anonymous_socket}" DOCKER_CONFIG="$anonymous_config" \
              docker pull "$ref"; then
              echo "Released GHCR image ${ref%%@*} cannot be anonymously pulled from a clean daemon." >&2
              echo "Official Self-Hosted publication requires public eimir-backend/eimir-web packages; set package visibility to Public and rerun." >&2
              exit 1
            fi
            DOCKER_HOST="unix://${anonymous_socket}" DOCKER_CONFIG="$anonymous_config" \
              docker image inspect "$ref" >/dev/null
          done

      - name: Build deterministic Self-Hosted operator bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          bundle_name="eimir-self-hosted-v${RELEASE_VERSION}"
          bundle_root="$RUNNER_TEMP/$bundle_name"
          rm -rf "$bundle_root"
          mkdir -p "$bundle_root/deploy" "$bundle_root/scripts"

          cp -- compose.yaml "$bundle_root/compose.yaml"
          cp -- deploy/self-hosted-release.env.example \
            "$bundle_root/deploy/self-hosted-release.env.example"
          cp -- scripts/self_hosted_release.py \
            "$bundle_root/scripts/self_hosted_release.py"
          cp -- scripts/check_runtime_environment.py \
            "$bundle_root/scripts/check_runtime_environment.py"
          # The published identity is the trust root of the in-manifest release guard
          # and of the launcher; it replaces the source-checkout placeholder.
          cp -- release-evidence/self-hosted-image-identity.json \
            "$bundle_root/self-hosted-image-identity.json"

          cat > "$RUNNER_TEMP/expected-self-hosted-bundle.txt" <<EOF
          ${bundle_name}/
          ${bundle_name}/compose.yaml
          ${bundle_name}/deploy/
          ${bundle_name}/deploy/self-hosted-release.env.example
          ${bundle_name}/scripts/
          ${bundle_name}/scripts/check_runtime_environment.py
          ${bundle_name}/scripts/self_hosted_release.py
          ${bundle_name}/self-hosted-image-identity.json
          EOF

          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/${bundle_name}.tar" \
            -C "$RUNNER_TEMP" "$bundle_name"
          gzip -n -c "$RUNNER_TEMP/${bundle_name}.tar" \
            > "release-evidence/${bundle_name}.tar.gz"

          tar -tzf "release-evidence/${bundle_name}.tar.gz" \
            > "$RUNNER_TEMP/actual-self-hosted-bundle.txt"
          diff -u \
            "$RUNNER_TEMP/expected-self-hosted-bundle.txt" \
            "$RUNNER_TEMP/actual-self-hosted-bundle.txt"

      - name: Write human-readable release notes
        shell: bash
        env:
          INCLUDE_ANDROID: ${{ inputs.include_android }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REVISION: ${{ github.sha }}
          INITIAL_RELEASE: ${{ inputs.initial_release }}
          PREVIOUS_VERSION: ${{ inputs.previous_known_good_version }}
        run: |
          set -euo pipefail
          if [ "$INITIAL_RELEASE" = "true" ]; then
            previous="none (initial release)"
          else
            previous="v${PREVIOUS_VERSION}"
          fi
          if [ "$INCLUDE_ANDROID" = "true" ]; then
            android_note="Android is included in this release channel. Final APK/AAB bytes are signed, carry fresh SPDX SBOMs and attestations, and are bound to the same source revision."
          else
            android_note="Android is explicitly not part of this release channel. No APK/AAB, Android signing material, fixed Android API origin, or Android attestations are published."
          fi
          cat > release-evidence/RELEASE-NOTES.md <<EOF
          # eimir. v${RELEASE_VERSION}

          Source revision: \`${SOURCE_REVISION}\`
          Previous known-good application release: \`${previous}\`

          This is one immutable build-once release set. Backend API, worker and migrate
          share one runtime artifact and Web is bound to the same source revision by
          \`eimir-release-manifest.json\`.

          ${android_note}

          The exact backend and Web archives were loaded without rebuild and published
          as versioned GHCR images. GHCR version/source tags are discovery aliases only;
          \`self-hosted-image-identity.json\` records the authoritative digest-qualified
          references and binds them back to the #519 archive hashes.

          \`eimir-self-hosted-v${RELEASE_VERSION}.tar.gz\` is the deterministic
          source-free operator bundle for released Self-Hosted installation. It contains
          canonical Compose, the release env template, mandatory Production launcher,
          runtime identity checker and the published image identity that the in-manifest
          release guard and the launcher both trust; application source is not included
          or built on target.

          Application rollback selects the previous immutable release only. It does not
          imply database rollback; schema compatibility, forward-fix and restore remain
          governed by #190 and #375.
          EOF

      - name: Write and verify final release checksums
        run: |
          set -euo pipefail
          rm -f release-evidence/SHA256SUMS
          (
            cd release-evidence
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Recheck tag and Release immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} appeared after preflight; refusing overwrite." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} appeared after preflight; refusing overwrite." >&2
            exit 1
          fi

      - name: Stage and publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          mapfile -d '' assets < <(find release-evidence -type f -print0 | sort -z)

          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "eimir. v${RELEASE_VERSION}" \
            --notes-file release-evidence/RELEASE-NOTES.md \
            --draft \
            --verify-tag=false

          draft_active=true
          cleanup_draft_on_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$draft_active" = "true" ]; then
              set +e
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              cleanup_status=$?
              set -e
              if [ "$cleanup_status" -ne 0 ]; then
                echo "Automatic cleanup of failed draft Release ${tag} failed; manual cleanup is required." >&2
              fi
            fi
            exit "$status"
          }
          trap cleanup_draft_on_failure EXIT

          release_id=$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft \
            --jq 'select(.isDraft == true) | .databaseId')
          test -n "$release_id"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > "$RUNNER_TEMP/staged-release-assets.json"
          python3 scripts/verify_release_asset_set.py \
            --expected-root release-evidence \
            --assets-json "$RUNNER_TEMP/staged-release-assets.json"

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          draft_active=false
          trap - EXIT

          immutable=$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable \
            --jq '.isImmutable')
          if [ "$immutable" != "true" ]; then
            echo "GitHub Release ${tag} was published without release immutability; refusing publication." >&2
            set +e
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            cleanup_status=$?
            set -e
            if [ "$cleanup_status" -ne 0 ]; then
              echo "Automatic cleanup of mutable Release ${tag} failed; manual cleanup is required." >&2
            fi
            exit 1
          fi

      - name: Verify published immutable identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable')" = "true"
          gh release verify "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"

          release_id=$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft \
            --jq 'select(.isDraft == false) | .databaseId')
          test -n "$release_id"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > "$RUNNER_TEMP/published-release-assets.json"
          python3 scripts/verify_release_asset_set.py \
            --expected-root release-evidence \
            --assets-json "$RUNNER_TEMP/published-release-assets.json"

      - name: Upload final release evidence snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-release-v${{ inputs.release_version }}-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
