name: Temporary #1007 Main Sync

on:
  push:
    branches:
      - feat/971-discover-web-integration
    paths:
      - .github/workflows/temp-sync-1007.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/971-discover-web-integration
          fetch-depth: 0

      - name: Reconcile current main into Slice 4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # Keep the accepted Slice-4 side only where Git cannot merge a hunk
          # automatically. All non-conflicting #975/main changes are retained.
          git merge --no-edit -X ours origin/main

          # #975 changed this regression proof from manual pagination to the
          # new sentinel-driven automatic pagination. Start with current main's
          # proof and add only the new Slice-4 intentional-view endpoint mock.
          git checkout origin/main -- web/e2e/tests/f2-task-boundaries.spec.ts
          python - <<'PY'
          from pathlib import Path

          path = Path('web/e2e/tests/f2-task-boundaries.spec.ts')
          text = path.read_text()
          marker = """    if (\n      method === 'GET' &&\n      path.includes('/memories/') &&\n      !path.endsWith('/comments')\n    ) {\n"""
          receipt = """    if (\n      method === 'POST' &&\n      path === `/api/v1/spaces/${SPACE}/story-views`\n    ) {\n      return route.fulfill({ status: 204 });\n    }\n"""
          if receipt not in text:
              if marker not in text:
                  raise SystemExit('Memory detail marker not found while restoring story-view fixture')
              text = text.replace(marker, receipt + marker, 1)
          path.write_text(text)
          PY

          rm .github/workflows/temp-sync-1007.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:feat/971-discover-web-integration
