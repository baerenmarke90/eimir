      "image": "ghcr.io/baerenmarke90/eimir-cloud-backend@sha256:16e591c671075c500976a59a15ef0cfabeac3eac33ba5b7259085340dfa05396",
      "networks": {
        "app": null
      },
      "pull_policy": "always",
      "restart": "no"
    },
