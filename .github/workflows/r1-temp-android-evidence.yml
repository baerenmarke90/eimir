name: R1 Temporary Android Evidence Probe

on:
  push:
    branches:
      - feat/964-r1-memory-capture
    paths:
      - .github/workflows/r1-temp-android-evidence.yml

permissions:
  contents: read

jobs:
  evidence:
    name: Disposable emulator R1 evidence probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/964-r1-memory-capture

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK and disposable emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name r1-proof --package "system-images;android-36;google_apis;x86_64"

      - name: Boot disposable emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r1-native-evidence"
          nohup "$ANDROID_HOME/emulator/emulator" @r1-proof \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            >"$RUNNER_TEMP/r1-native-evidence/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.release
          adb shell wm size
          adb shell wm density

      - name: Build exact debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:assembleDebug

      - name: Probe R1 production journey and accessibility services
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r1-native-evidence"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$apk" | tee "$out/apk.sha256"
          git rev-parse HEAD | tee "$out/source-commit.txt"
          adb install -r "$apk"
          adb shell pm list packages | grep -Ei 'talkback|accessibility|marvin' | tee "$out/accessibility-packages.txt" || true
          adb shell settings get secure enabled_accessibility_services | tee "$out/enabled-accessibility-services.txt"
          adb shell dumpsys accessibility > "$out/accessibility-dumpsys.txt"

          serial="$(adb get-serialno)"
          python3 tools/qa/capture_f2_android.py \
            --serial "$serial" \
            --apk "$apk" \
            --output "$out/f2-contract-on-r1" \
            --skip-matrix

          component='de.sidebyside.app.debug/de.eimir.app.reference.TaskJourneyProofActivity'
          adb shell am force-stop de.sidebyside.app.debug
          adb shell cmd uimode night no
          adb shell am start -W -n "$component" --es direct create > "$out/r1-direct-launch.txt"
          sleep 1
          adb shell uiautomator dump /sdcard/r1.xml >/dev/null
          adb exec-out cat /sdcard/r1.xml > "$out/r1-composer.xml"
          adb exec-out screencap -p > "$out/r1-composer-light.png"

          python3 - <<'PY'
          import re, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          out = Path(__import__('os').environ['RUNNER_TEMP']) / 'r1-native-evidence'
          root = ET.parse(out / 'r1-composer.xml').getroot()
          required = ['memory-create-photos','memory-create-body','memory-create-title','memory-create-save','memory-create-close']
          nodes = list(root.iter('node'))
          def node_for(tag):
              return next((n for n in nodes if n.get('resource-id','').endswith(tag)), None)
          missing = [tag for tag in required if node_for(tag) is None]
          if missing:
              raise SystemExit(f'Missing R1 controls: {missing}')
          order = []
          for tag in ['memory-create-photos','memory-create-body','memory-create-title']:
              n = node_for(tag)
              nums = list(map(int, re.findall(r'-?\d+', n.get('bounds',''))))
              order.append((tag, nums[1]))
          if order != sorted(order, key=lambda item: item[1]):
              raise SystemExit(f'R1 content order is wrong: {order}')
          (out / 'r1-order.txt').write_text('\n'.join(f'{tag}: top={top}' for tag, top in order) + '\n')
          PY

          # System Photo Picker cancellation must return to the same composer.
          python3 - <<'PY'
          import re, subprocess, xml.etree.ElementTree as ET
          subprocess.run(['adb','shell','uiautomator','dump','/sdcard/r1-picker-start.xml'], check=True, stdout=subprocess.DEVNULL)
          raw = subprocess.check_output(['adb','exec-out','cat','/sdcard/r1-picker-start.xml'], text=True)
          root = ET.fromstring(raw)
          node = next(n for n in root.iter('node') if n.get('resource-id','').endswith('memory-create-photos'))
          l,t,r,b = map(int, re.findall(r'-?\d+', node.get('bounds','')))
          subprocess.run(['adb','shell','input','tap',str((l+r)//2),str((t+b)//2)], check=True)
          PY
          sleep 1
          adb shell dumpsys activity activities | head -n 80 > "$out/photo-picker-open-activity.txt"
          adb exec-out screencap -p > "$out/photo-picker-open.png"
          adb shell input keyevent 4
          sleep 1
          adb shell uiautomator dump /sdcard/r1-after-picker.xml >/dev/null
          adb exec-out cat /sdcard/r1-after-picker.xml > "$out/r1-after-picker-cancel.xml"
          grep -q 'memory-create-scroll' "$out/r1-after-picker-cancel.xml"
          adb exec-out screencap -p > "$out/r1-after-picker-cancel.png"

          # Dark mode and 200% text on the actual R1 composer.
          adb shell cmd uimode night yes
          adb shell settings put system font_scale 2.0
          adb shell am force-stop de.sidebyside.app.debug
          adb shell am start -W -n "$component" --es direct create >/dev/null
          sleep 1
          adb exec-out screencap -p > "$out/r1-composer-dark-200pct.png"
          adb shell uiautomator dump /sdcard/r1-large.xml >/dev/null
          adb exec-out cat /sdcard/r1-large.xml > "$out/r1-composer-dark-200pct.xml"
          grep -q 'memory-create-save' "$out/r1-composer-dark-200pct.xml"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-android-emulator-probe-${{ github.sha }}
          path: ${{ runner.temp }}/r1-native-evidence
          if-no-files-found: error
          retention-days: 3
