  <text x="72" y="118" fill="#211A2B" font-family="Georgia, serif" font-size="42" font-weight="700">Release the Core before optional expansion</text>
  <text x="72" y="151" fill="#51485C" font-family="Arial, sans-serif" font-size="19">M0–M5 deliver the Core. M6 makes it safe to operate and launch. M7–M9 expand after G5.</text>
