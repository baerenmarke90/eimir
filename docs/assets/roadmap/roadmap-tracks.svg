<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">eimir. Roadmap – Parallel Workstreams</title>
  <desc id="desc">Matrix covering Product, Backend and API, WebApp, Android, Design System, Security and Quality, and Operations. Columns show Now M0 to M1, Next M2, Then M3 to M5, and Later M6 to M9.</desc>

  <defs>
