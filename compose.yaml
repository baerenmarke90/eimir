{
  "name": "eimir-test",
  "networks": {
    "app": {
      "external": true,
      "name": "eimir-test-data"
    },
    "proxy": {
      "external": true,
      "name": "mailcow-proxy"
    }
  },
  "services": {
    "cloud-api": {
      "command": null,
      "depends_on": {
        "cloud-migrate": {
          "condition": "service_completed_successfully",
          "required": true
        }
      },
      "entrypoint": null,
      "environment": {
        "EIMIR_ACCOUNT_DELETION_INSTANCE_ID": "${EIMIR_ACCOUNT_DELETION_INSTANCE_ID:?Set the existing instance value in Arcane}",
        "EIMIR_ACCOUNT_DELETION_JOURNAL_PATH": "/var/lib/eimir/deletion-journal/account-deletions.journal",
        "EIMIR_ALLOWED_HOSTS": "${EIMIR_ALLOWED_HOSTS:?Set the existing instance value in Arcane}",
        "EIMIR_CURSOR_SIGNING_KEY": "${EIMIR_CURSOR_SIGNING_KEY:?Set the existing instance value in Arcane}",
        "EIMIR_DATABASE_URL": "postgresql+psycopg://sidebyside:${POSTGRES_PASSWORD:?Set the existing instance value in Arcane}@eimir-test-postgres:5432/sidebyside",
        "EIMIR_DEMO_MODE": "false",
        "EIMIR_DEMO_MODE_RESET_TIMER": "false",
        "EIMIR_DEPLOYMENT": "cloud",
        "EIMIR_ENCRYPTION_ACTIVE_KEY_ID": "${EIMIR_ENCRYPTION_ACTIVE_KEY_ID:?Set the existing instance value in Arcane}",
        "EIMIR_ENCRYPTION_AT_REST": "required",
        "EIMIR_ENCRYPTION_KEYS": "${EIMIR_ENCRYPTION_KEYS:?Set the existing instance value in Arcane}",
        "EIMIR_ENVIRONMENT": "production",
        "EIMIR_MAIL_FROM": "${EIMIR_MAIL_FROM:?Set the existing instance value in Arcane}",
        "EIMIR_MAIL_TRANSPORT": "smtp",
        "EIMIR_MEDIA_ROOT": "/var/lib/eimir/media",
        "EIMIR_MEDIA_STORE": "local",
        "EIMIR_OIDC_CONNECTIONS": "[]",
        "EIMIR_PUBLIC_BASE_URL": "${EIMIR_PUBLIC_BASE_URL:?Set the existing instance value in Arcane}",
        "EIMIR_S3_ACCESS_KEY_ID": "",
        "EIMIR_S3_BUCKET": "",
        "EIMIR_S3_ENDPOINT": "",
        "EIMIR_S3_REGION": "us-east-1",
        "EIMIR_S3_SECRET_ACCESS_KEY": "",
        "EIMIR_S3_SESSION_TOKEN": "",
        "EIMIR_SERVER_ADMIN_EMAILS": "${EIMIR_SERVER_ADMIN_EMAILS:?Set the existing instance value in Arcane}",
        "EIMIR_SMTP_HOST": "${EIMIR_SMTP_HOST:?Set the existing instance value in Arcane}",
        "EIMIR_SMTP_PASSWORD": "${EIMIR_SMTP_PASSWORD:?Set the existing instance value in Arcane}",
        "EIMIR_SMTP_PORT": "587",
        "EIMIR_SMTP_STARTTLS": "true",
        "EIMIR_SMTP_USERNAME": "${EIMIR_MAIL_FROM:?Set the existing instance value in Arcane}",
        "EIMIR_WEBAUTHN_ORIGINS": "${EIMIR_WEBAUTHN_ORIGINS:?Set the existing instance value in Arcane}",
        "EIMIR_WEBAUTHN_RP_ID": "${EIMIR_WEBAUTHN_RP_ID:?Set the existing instance value in Arcane}",
        "EIMIR_WEBAUTHN_RP_NAME": "eimir.",
        "FORWARDED_ALLOW_IPS": "${TRUSTED_PROXY_IPS:?Set the existing instance value in Arcane}"
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 3,
        "start_period": "10s",
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health/ready\")"
        ],
        "timeout": "5s"
      },
      "image": "ghcr.io/baerenmarke90/eimir-backend@sha256:7892c87678924f72fdc64a68aaca015db6c4176efc549363839f121b853a364b",
      "networks": {
        "app": {
          "aliases": [
            "api"
          ]
        },
        "proxy": {
          "aliases": [
            "eimir-test-api"
          ]
        }
      },
      "pull_policy": "always",
      "restart": "unless-stopped",
      "volumes": [
        {
          "source": "cloud_media_data",
          "target": "/var/lib/eimir/media",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "cloud_deletion_journal_data",
          "target": "/var/lib/eimir/deletion-journal",
          "type": "volume",
          "volume": {}
        }
      ]
    },
    "cloud-migrate": {
      "command": [
        "alembic",
        "upgrade",
        "head"
      ],
      "entrypoint": null,
      "environment": {
        "EIMIR_DATABASE_URL": "postgresql+psycopg://sidebyside:${POSTGRES_PASSWORD:?Set the existing instance value in Arcane}@eimir-test-postgres:5432/sidebyside"
      },
      "image": "ghcr.io/baerenmarke90/eimir-backend@sha256:7892c87678924f72fdc64a68aaca015db6c4176efc549363839f121b853a364b",
      "networks": {
        "app": null
      },
      "pull_policy": "always",
      "restart": "no"
    },
    "cloud-web": {
      "command": null,
      "depends_on": {
        "cloud-api": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "entrypoint": null,
      "environment": {
        "EIMIR_WEB_CSP_CONNECT_ORIGINS": ""
      },
      "image": "ghcr.io/baerenmarke90/eimir-web@sha256:e5c294a7e034c99c5112825b368785f9dc62af7bd9ee0917dcfab9b1ef45f7bc",
      "networks": {
        "app": {},
        "proxy": {
          "aliases": [
            "eimir-test-web"
          ]
        }
      },
      "pull_policy": "always",
      "restart": "unless-stopped"
    },
    "cloud-worker": {
      "command": [
        "python",
        "-m",
        "eimir.jobs.runner"
      ],
      "depends_on": {
        "cloud-migrate": {
          "condition": "service_completed_successfully",
          "required": true
        }
      },
      "entrypoint": null,
      "environment": {
        "EIMIR_ACCOUNT_DELETION_INSTANCE_ID": "${EIMIR_ACCOUNT_DELETION_INSTANCE_ID:?Set the existing instance value in Arcane}",
        "EIMIR_ACCOUNT_DELETION_JOURNAL_PATH": "/var/lib/eimir/deletion-journal/account-deletions.journal",
        "EIMIR_ALLOWED_HOSTS": "${EIMIR_ALLOWED_HOSTS:?Set the existing instance value in Arcane}",
        "EIMIR_CURSOR_SIGNING_KEY": "${EIMIR_CURSOR_SIGNING_KEY:?Set the existing instance value in Arcane}",
        "EIMIR_DATABASE_URL": "postgresql+psycopg://sidebyside:${POSTGRES_PASSWORD:?Set the existing instance value in Arcane}@eimir-test-postgres:5432/sidebyside",
        "EIMIR_DEMO_MODE": "false",
        "EIMIR_DEMO_MODE_RESET_TIMER": "false",
        "EIMIR_DEPLOYMENT": "cloud",
        "EIMIR_ENCRYPTION_ACTIVE_KEY_ID": "${EIMIR_ENCRYPTION_ACTIVE_KEY_ID:?Set the existing instance value in Arcane}",
        "EIMIR_ENCRYPTION_AT_REST": "required",
        "EIMIR_ENCRYPTION_KEYS": "${EIMIR_ENCRYPTION_KEYS:?Set the existing instance value in Arcane}",
        "EIMIR_ENVIRONMENT": "production",
        "EIMIR_MAIL_FROM": "${EIMIR_MAIL_FROM:?Set the existing instance value in Arcane}",
        "EIMIR_MAIL_TRANSPORT": "smtp",
        "EIMIR_MEDIA_ROOT": "/var/lib/eimir/media",
        "EIMIR_MEDIA_STORE": "local",
        "EIMIR_OIDC_CONNECTIONS": "[]",
        "EIMIR_PUBLIC_BASE_URL": "${EIMIR_PUBLIC_BASE_URL:?Set the existing instance value in Arcane}",
        "EIMIR_S3_ACCESS_KEY_ID": "",
        "EIMIR_S3_BUCKET": "",
        "EIMIR_S3_ENDPOINT": "",
        "EIMIR_S3_REGION": "us-east-1",
        "EIMIR_S3_SECRET_ACCESS_KEY": "",
        "EIMIR_S3_SESSION_TOKEN": "",
        "EIMIR_SERVER_ADMIN_EMAILS": "${EIMIR_SERVER_ADMIN_EMAILS:?Set the existing instance value in Arcane}",
        "EIMIR_SMTP_HOST": "${EIMIR_SMTP_HOST:?Set the existing instance value in Arcane}",
        "EIMIR_SMTP_PASSWORD": "${EIMIR_SMTP_PASSWORD:?Set the existing instance value in Arcane}",
        "EIMIR_SMTP_PORT": "587",
        "EIMIR_SMTP_STARTTLS": "true",
        "EIMIR_SMTP_USERNAME": "${EIMIR_MAIL_FROM:?Set the existing instance value in Arcane}",
        "EIMIR_WEBAUTHN_ORIGINS": "${EIMIR_WEBAUTHN_ORIGINS:?Set the existing instance value in Arcane}",
        "EIMIR_WEBAUTHN_RP_ID": "${EIMIR_WEBAUTHN_RP_ID:?Set the existing instance value in Arcane}",
        "EIMIR_WEBAUTHN_RP_NAME": "eimir."
      },
      "image": "ghcr.io/baerenmarke90/eimir-backend@sha256:7892c87678924f72fdc64a68aaca015db6c4176efc549363839f121b853a364b",
      "networks": {
        "app": null
      },
      "pull_policy": "always",
      "restart": "unless-stopped",
      "volumes": [
        {
          "source": "cloud_media_data",
          "target": "/var/lib/eimir/media",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "cloud_deletion_journal_data",
          "target": "/var/lib/eimir/deletion-journal",
          "type": "volume",
          "volume": {}
        }
      ]
    }
  },
  "volumes": {
    "cloud_deletion_journal_data": {
      "external": true,
      "name": "eimir-test_cloud_deletion_journal_data"
    },
    "cloud_media_data": {
      "external": true,
      "name": "eimir-test_cloud_media_data"
    }
  }
}
