<svg xmlns="http://www.w3.org/2000/svg" width="780" height="844" viewBox="0 0 780 844">
  <rect width="780" height="844" fill="#f5f3f7"/>
  <rect x="0" y="70" width="380" height="774" rx="28" fill="#ffffff"/>
  <text x="24" y="130" font-family="sans-serif" font-size="30" font-weight="700" fill="#2b2130">Your vibe today</text>
  <text x="24" y="160" font-family="sans-serif" font-size="16" fill="#6d5a69">What fits best right now?</text>
  <rect x="24" y="192" width="332" height="70" rx="18" fill="#fff4f2" stroke="#d73554" stroke-width="2"/><text x="50" y="235" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b2130">Good &amp; relaxed</text>
  <text x="24" y="304" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b2130">Want to add some context?</text>
  <rect x="24" y="322" width="332" height="126" rx="18" fill="#fffaf8" stroke="#dbcfc9"/><text x="42" y="352" font-family="sans-serif" font-size="15" fill="#7b7079">Optional · max. 200 characters</text><text x="42" y="386" font-family="sans-serif" font-size="16" fill="#2b2130">Today’s appointment finally</text><text x="42" y="410" font-family="sans-serif" font-size="16" fill="#2b2130">went better than expected.</text>
  <rect x="24" y="478" width="332" height="48" rx="18" fill="#cf294a"/><text x="190" y="508" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Share vibe</text>
  <text x="24" y="566" font-family="sans-serif" font-size="12" fill="#6d5a69">Own note stays within current-day Vibe and shares its lifecycle.</text>
  <rect x="400" y="70" width="380" height="774" rx="28" fill="#ffffff"/>
  <text x="424" y="130" font-family="sans-serif" font-size="30" font-weight="700" fill="#2b2130">Alex’s vibe</text>
  <text x="424" y="166" font-family="sans-serif" font-size="19" font-weight="700" fill="#2b2130">Doing okay</text>
  <text x="424" y="220" font-family="Georgia,serif" font-size="21" fill="#2b2130">“My head feels a little empty today.</text>
  <text x="424" y="250" font-family="Georgia,serif" font-size="21" fill="#2b2130">A quiet evening would be nice.”</text>
  <text x="424" y="304" font-family="sans-serif" font-size="13" fill="#6d5a69">Visible only when Alex’s vibe itself is visible.</text>
  <rect x="424" y="350" width="332" height="84" rx="18" fill="#f4f1f5"/><text x="446" y="382" font-family="sans-serif" font-size="14" font-weight="700" fill="#6d5a69">MUTUAL REVEAL</text><text x="446" y="410" font-family="sans-serif" font-size="14" fill="#6d5a69">No note or participation side channel before own check-in.</text>
</svg>