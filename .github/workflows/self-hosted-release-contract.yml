name: Self-Hosted Release Contract

on:
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - "deploy/self-hosted-release.env.example"
      - "scripts/self_hosted_release.py"
      - "scripts/test_self_hosted_release.py"
      - "scripts/self_hosted_upgrade_rehearsal.py"
      - "scripts/test_self_hosted_upgrade_rehearsal.py"
      - "tools/ci/test_self_hosted_topology.py"
      - "scripts/check_runtime_environment.py"
      - "scripts/test_check_runtime_environment.py"
      - "scripts/build_self_hosted_source.py"
      - "scripts/test_build_self_hosted_source.py"
      - "scripts/compose_checked.py"
      - "scripts/test_compose_checked.py"
      - "docs/SELF-HOSTING.md"
      - "docs/DEVELOPMENT-AND-RELEASE-ENVIRONMENTS.md"
      - "docs/ARCANE.md"
      - ".github/workflows/self-hosted-release-contract.yml"
  pull_request:
    paths:
      - "compose.yaml"
      - "deploy/self-hosted-release.env.example"
      - "scripts/self_hosted_release.py"
      - "scripts/test_self_hosted_release.py"
      - "scripts/self_hosted_upgrade_rehearsal.py"
      - "scripts/test_self_hosted_upgrade_rehearsal.py"
      - "tools/ci/test_self_hosted_topology.py"
      - "scripts/check_runtime_environment.py"
      - "scripts/test_check_runtime_environment.py"
      - "scripts/build_self_hosted_source.py"
      - "scripts/test_build_self_hosted_source.py"
      - "scripts/compose_checked.py"
      - "scripts/test_compose_checked.py"
      - "docs/SELF-HOSTING.md"
      - "docs/DEVELOPMENT-AND-RELEASE-ENVIRONMENTS.md"
      - "docs/ARCANE.md"
      - ".github/workflows/self-hosted-release-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Released Production entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit and syntax tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/self_hosted_release.py \
            scripts/test_self_hosted_release.py \
            scripts/self_hosted_upgrade_rehearsal.py \
            scripts/test_self_hosted_upgrade_rehearsal.py \
            scripts/check_runtime_environment.py \
            scripts/test_check_runtime_environment.py \
            scripts/build_self_hosted_source.py \
            scripts/test_build_self_hosted_source.py \
            scripts/compose_checked.py \
            scripts/test_compose_checked.py
          python3 -m unittest \
            scripts.test_self_hosted_release \
            scripts.test_self_hosted_upgrade_rehearsal \
            scripts.test_check_runtime_environment \
            scripts.test_build_self_hosted_source \
            scripts.test_compose_checked

      - name: Released topology contract (#827)
        run: python3 tools/ci/test_self_hosted_topology.py -v

      - name: Create release-contract identity fixture
        run: |
          set -euo pipefail
          cp deploy/self-hosted-release.env.example .env-release-contract
          sed -i 's/^EIMIR_ACCOUNT_DELETION_INSTANCE_ID=.*/EIMIR_ACCOUNT_DELETION_INSTANCE_ID=11111111-2222-4333-8444-555555555555/' .env-release-contract
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {}
          for raw_line in Path(".env-release-contract").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip()

          version = values["EIMIR_RELEASE_VERSION"]

          def image_record(role: str, digit: str, roles: list[str]) -> dict[str, object]:
              digest = "sha256:" + digit * 64
              return {
                  "reference": f"ghcr.io/baerenmarke90/eimir-{role}:v{version}@{digest}",
                  "digest": digest,
                  "roles": roles,
              }

          identity = {
              "schemaVersion": 1,
              "kind": "eimir-self-hosted-image-identity",
              "product": {"version": version, "tag": f"v{version}"},
              "sourceRevision": os.environ["GITHUB_SHA"],
              "images": {
                  "backend": image_record(
                      "backend", "a", ["api", "worker", "migrate"]
                  ),
                  "web": image_record("web", "b", ["web"]),
              },
          }
          Path(".release-contract-image-identity.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate the released Production entry point
        run: |
          set -euo pipefail
          python3 scripts/self_hosted_release.py \
            --env-file .env-release-contract \
            --image-identity .release-contract-image-identity.json \
            validate

      - name: Release-version mismatch cannot reach Production startup
        run: |
          set -euo pipefail
          if EIMIR_SELF_HOSTED_BACKEND_IMAGE=ghcr.io/baerenmarke90/eimir-backend:v0.1.1 \
             EIMIR_SELF_HOSTED_WEB_IMAGE=ghcr.io/baerenmarke90/eimir-web:v0.1.1 \
             python3 scripts/self_hosted_release.py \
               --env-file .env-release-contract \
               --image-identity .release-contract-image-identity.json \
               validate; then
            echo "Released launcher accepted image overrides from another product version." >&2
            exit 1
          fi

      - name: Process environment cannot downgrade the release boundary
        run: |
          set -euo pipefail
          if EIMIR_ENVIRONMENT=development \
             python3 scripts/self_hosted_release.py \
               --env-file .env-release-contract \
               --image-identity .release-contract-image-identity.json \
               validate; then
            echo "Released launcher accepted a Development process override." >&2
            exit 1
          fi

      - name: Living Production runbooks require the launcher
        run: |
          set -euo pipefail
          for path in \
            docs/SELF-HOSTING.md \
            docs/DEVELOPMENT-AND-RELEASE-ENVIRONMENTS.md \
            docs/ARCANE.md; do
            grep -Fq 'scripts/self_hosted_release.py' "$path" || {
              echo "$path does not reference the mandatory released launcher." >&2
              exit 1
            }
          done
