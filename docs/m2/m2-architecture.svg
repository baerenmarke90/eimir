<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">eimir. – M2 Memory Core target architecture</title>
  <desc id="desc">Human-readable architecture overview for Web and Android, REST API, Tenant Guard, M2 Domains, Story Read Model, Attachments, MediaStore, database, Outbox, and Privacy boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9FD"/>
      <stop offset="0.52" stop-color="#F7F3FC"/>
      <stop offset="1" stop-color="#F3F7FA"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#A878FF"/>
    </linearGradient>
    <linearGradient id="private" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE7EE"/>
      <stop offset="1" stop-color="#FFF5F8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#D9CFF0" opacity="0.42"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4C315F" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#4C315F" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C4DFF"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1769AA"/>
    </marker>
    <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#237A65"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px 'Segoe UI', Arial, sans-serif; letter-spacing: 2.8px; }
      .h1 { font: 700 46px 'Segoe UI', Arial, sans-serif; fill: #211A2B; }
      .subtitle { font: 400 21px 'Segoe UI', Arial, sans-serif; fill: #6A6072; }
      .section { font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.7px; }
      .cardTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #211A2B; }
      .cardText { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #61586A; }
      .small { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #6A6072; }
      .micro { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #6A6072; letter-spacing: .5px; }
      .pill { font: 700 13px 'Segoe UI', Arial, sans-serif; letter-spacing: .4px; }
      .whiteTitle { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .whiteText { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #F3EEFF; }
      .linePurple { fill: none; stroke: #7C4DFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .lineBlue { fill: none; stroke: #1769AA; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .lineMint { fill: none; stroke: #237A65; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .lineNeutral { fill: none; stroke: #B9ADCA; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#dots)" opacity="0.6"/>
  <circle cx="1480" cy="70" r="210" fill="#EEE7FF" opacity="0.66"/>
  <circle cx="65" cy="1005" r="180" fill="#E3F6F1" opacity="0.58"/>

  <!-- Header -->
  <g transform="translate(86 64)">
    <rect x="0" y="0" width="214" height="34" rx="17" fill="#EEE7FF"/>
    <circle cx="18" cy="17" r="5" fill="#7C4DFF"/>
    <text x="34" y="23" class="eyebrow" fill="#6540C9" font-size="13">M2 · MEMORY CORE</text>
    <text x="0" y="90" class="h1">From a private moment to the shared Story</text>
    <text x="0" y="128" class="subtitle">One API, two clients – Tenant-safe, Privacy-first, and E2EE-ready.</text>
  </g>
  <g transform="translate(1366 82)">
    <circle cx="34" cy="34" r="34" fill="url(#hero)" filter="url(#soft)"/>
    <path d="M20 35 C20 24, 33 21, 38 31 C43 21, 56 24, 56 35 C56 46, 38 56, 38 56 C38 56, 20 46, 20 35Z" fill="#FFFFFF"/>
    <text x="82" y="30" class="small" fill="#211A2B">eimir.</text>
    <text x="82" y="51" class="micro">NEXT · TARGET VIEW</text>
  </g>

  <!-- client row -->
  <text x="86" y="238" class="section" fill="#6540C9">EXPERIENCE LAYER</text>
  <g filter="url(#soft)">
    <rect x="86" y="258" width="282" height="112" rx="24" fill="#FFFFFF" stroke="#DFD6E9"/>
    <rect x="388" y="258" width="282" height="112" rx="24" fill="#FFFFFF" stroke="#DFD6E9"/>
  </g>
  <g transform="translate(112 281)">
    <rect x="0" y="0" width="58" height="48" rx="8" fill="#EEE7FF"/>
    <rect x="8" y="8" width="42" height="27" rx="3" fill="#7C4DFF" opacity="0.9"/>
    <rect x="20" y="39" width="18" height="3" rx="1.5" fill="#7C4DFF"/>
    <text x="78" y="20" class="cardTitle">Web App</text>
    <text x="78" y="47" class="cardText">responsive · accessible</text>
    <rect x="78" y="59" width="120" height="24" rx="12" fill="#F6F1FF"/>
    <text x="91" y="76" class="pill" fill="#6540C9">OFFLINE READ</text>
  </g>
  <g transform="translate(416 279)">
    <rect x="0" y="0" width="48" height="67" rx="10" fill="#EEE7FF" stroke="#7C4DFF" stroke-width="2"/>
    <rect x="7" y="10" width="34" height="43" rx="4" fill="#7C4DFF" opacity="0.9"/>
    <circle cx="24" cy="60" r="3" fill="#7C4DFF"/>
    <text x="72" y="22" class="cardTitle">Android App</text>
    <text x="72" y="49" class="cardText">native patterns · secure cache</text>
    <rect x="72" y="61" width="112" height="24" rx="12" fill="#F6F1FF"/>
    <text x="84" y="78" class="pill" fill="#6540C9">SAME CONTRACT</text>
  </g>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="718" y="250" width="794" height="128" rx="28" fill="url(#hero)"/>
  </g>
  <g transform="translate(756 275)">
    <rect x="0" y="0" width="60" height="60" rx="18" fill="#FFFFFF" opacity="0.18"/>
    <path d="M17 19 H43 M17 30 H43 M17 41 H34" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="88" y="23" class="whiteTitle">REST API v1</text>
    <text x="88" y="50" class="whiteText">OpenAPI · DTO validation · stable errors · optimistic concurrency</text>
    <rect x="520" y="7" width="207" height="44" rx="22" fill="#FFFFFF" opacity="0.18"/>
    <path d="M545 30 l8 8 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="582" y="35" class="pill" fill="#FFFFFF">MEMBERSHIP GUARD</text>
  </g>
  <path d="M368 336 V390 H686 V348 H700" class="linePurple" marker-end="url(#arrowPurple)"/>
  <path d="M670 314 H700" class="linePurple" marker-end="url(#arrowPurple)"/>

  <!-- Guard rail -->
  <g transform="translate(86 407)">
    <rect x="0" y="0" width="1426" height="56" rx="18" fill="#211A2B" filter="url(#soft)"/>
    <path d="M30 29 l9 9 l18 -22" fill="none" stroke="#9BE0CC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="35" class="pill" fill="#FFFFFF">AUTH → SPACE MEMBERSHIP → RESOURCE VISIBILITY → PROJECTION</text>
    <rect x="1010" y="12" width="388" height="32" rx="16" fill="#FFE7EE"/>
    <text x="1032" y="33" class="pill" fill="#A61F51">PRIVATE = OWNER_ONLY · FAIL CLOSED</text>
  </g>

  <!-- domain section -->
  <text x="86" y="514" class="section" fill="#6540C9">M2 DOMAIN &amp; READ MODELS</text>

  <!-- Story card -->
  <g filter="url(#soft)">
    <rect x="86" y="535" width="300" height="298" rx="28" fill="#E7F2FF" stroke="#B9D8F1"/>
  </g>
  <g transform="translate(116 566)">
    <rect x="0" y="0" width="58" height="58" rx="18" fill="#1769AA"/>
    <path d="M17 19 H41 M17 29 H35 M17 39 H41" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="78" y="24" class="cardTitle">Story Query</text>
    <text x="78" y="49" class="small" fill="#1769AA">DERIVED · NOT PERSISTED</text>
    <text x="0" y="95" class="cardText">combines permitted Memories into a</text>
    <text x="0" y="119" class="cardText">chronological Timeline</text>
    <g transform="translate(0 146)">
      <rect x="0" y="0" width="240" height="34" rx="17" fill="#FFFFFF"/>
      <text x="17" y="22" class="pill" fill="#1769AA">FILTER · SEARCH · CURSOR</text>
      <rect x="0" y="46" width="240" height="34" rx="17" fill="#FFFFFF"/>
      <text x="17" y="68" class="pill" fill="#1769AA">AUTHOR · MEDIA · MONTH</text>
    </g>
    <rect x="0" y="244" width="240" height="34" rx="17" fill="#FFE7EE"/>
    <text x="15" y="266" class="pill" fill="#A61F51">PRIVATE REMOVED FIRST</text>
  </g>

  <!-- Domain core -->
  <g filter="url(#shadow)">
    <rect x="414" y="535" width="714" height="298" rx="30" fill="#FFFFFF" stroke="#DFD6E9"/>
  </g>
  <g transform="translate(444 560)">
    <text x="0" y="18" class="section" fill="#6540C9">WRITE MODEL</text>
    <text x="510" y="18" class="micro">SPACE-SCOPED · VERSIONED</text>
    <g transform="translate(0 40)">
      <rect x="0" y="0" width="300" height="92" rx="20" fill="#EEE7FF"/>
      <circle cx="42" cy="46" r="25" fill="#7C4DFF"/>
      <path d="M29 48 C29 38, 40 35, 43 43 C47 35, 57 38, 57 48 C57 57, 43 65, 43 65 C43 65, 29 57, 29 48Z" fill="#FFFFFF"/>
      <text x="82" y="38" class="cardTitle">Memory</text>
      <text x="82" y="63" class="cardText">Text · date · multiple Media</text>
    </g>
    <g transform="translate(324 40)">
      <rect x="0" y="0" width="330" height="92" rx="20" fill="url(#private)" stroke="#F4B7CA"/>
      <circle cx="42" cy="46" r="25" fill="#A61F51"/>
      <path d="M30 48 C30 39, 40 35, 43 43 C47 35, 56 39, 56 48 C56 57, 43 64, 43 64 C43 64, 30 57, 30 48Z" fill="#FFFFFF"/>
      <text x="82" y="35" class="cardTitle">HeartMoment</text>
      <text x="82" y="61" class="cardText">SHARED or PRIVATE</text>
      <rect x="224" y="16" width="88" height="24" rx="12" fill="#FFFFFF"/>
      <text x="238" y="33" class="pill" fill="#A61F51">OWNER ONLY</text>
    </g>
    <g transform="translate(0 151)">
      <rect x="0" y="0" width="300" height="92" rx="20" fill="#FFF2D5"/>
      <circle cx="42" cy="46" r="25" fill="#B87800"/>
      <path d="M42 28 l5 11 l12 2 l-9 9 l2 12 l-10 -6 l-11 6 l3 -12 l-9 -9 l12 -2z" fill="#FFFFFF"/>
      <text x="82" y="38" class="cardTitle">Milestone</text>
      <text x="82" y="63" class="cardText">dedicated · Story-ready</text>
    </g>
    <g transform="translate(324 151)">
      <rect x="0" y="0" width="330" height="92" rx="20" fill="#E3F6F1"/>
      <circle cx="42" cy="46" r="25" fill="#237A65"/>
      <path d="M28 34 H56 V53 H43 L34 61 V53 H28Z" fill="#FFFFFF"/>
      <text x="82" y="38" class="cardTitle">Comment</text>
      <text x="82" y="63" class="cardText">permitted Shared Targets only</text>
    </g>
  </g>

  <!-- Attachment card -->
  <g filter="url(#soft)">
    <rect x="1156" y="535" width="356" height="298" rx="28" fill="#E3F6F1" stroke="#B7E2D7"/>
  </g>
  <g transform="translate(1186 565)">
    <rect x="0" y="0" width="58" height="58" rx="18" fill="#237A65"/>
    <path d="M19 39 l13 -13 c5 -5 13 3 8 8 L27 47 c-8 8 -19 -3 -11 -11 l15 -15" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="78" y="24" class="cardTitle">Attachment Service</text>
    <text x="78" y="49" class="small" fill="#237A65">VALIDATE BEFORE READY</text>
    <g transform="translate(0 91)">
      <rect x="0" y="0" width="296" height="40" rx="20" fill="#FFFFFF"/>
      <circle cx="23" cy="20" r="8" fill="#B87800"/>
      <text x="44" y="26" class="pill" fill="#6F665F">PENDING · UPLOAD</text>
      <path d="M202 20 H228" class="lineNeutral"/>
      <circle cx="251" cy="20" r="8" fill="#237A65"/>
      <text x="267" y="26" class="pill" fill="#237A65">READY</text>
    </g>
    <text x="0" y="164" class="cardText">MIME · size · dimensions · Space</text>
    <rect x="0" y="184" width="139" height="44" rx="16" fill="#FFFFFF"/>
    <text x="21" y="212" class="pill" fill="#237A65">LOCAL STORE</text>
    <rect x="157" y="184" width="139" height="44" rx="16" fill="#FFFFFF"/>
    <text x="184" y="212" class="pill" fill="#237A65">S3 STORE</text>
    <text x="0" y="260" class="small">opaque blobs · private by default</text>
  </g>

  <!-- connections down -->
  <path d="M950 378 V392 Q950 405 937 405 H790 V522" class="linePurple" marker-end="url(#arrowPurple)"/>
  <path d="M386 684 H402" class="lineBlue" marker-end="url(#arrowBlue)"/>
  <path d="M1128 684 H1144" class="lineMint" marker-end="url(#arrowMint)"/>

  <!-- Protected payload band -->
  <g transform="translate(414 850)">
    <rect x="0" y="0" width="1098" height="54" rx="18" fill="#F6F1FF" stroke="#D7C9F7" stroke-dasharray="7 6"/>
    <path d="M25 31 v-8 a9 9 0 0 1 18 0 v8 M21 31 h26 v17 H21z" fill="none" stroke="#7C4DFF" stroke-width="3"/>
    <text x="70" y="34" class="pill" fill="#6540C9">PROTECTED PAYLOAD BOUNDARY</text>
    <text x="318" y="34" class="cardText">sensitive content separated · cryptoVersion · no plaintext assumption</text>
    <rect x="889" y="11" width="186" height="32" rx="16" fill="#FFFFFF"/>
    <text x="913" y="32" class="pill" fill="#6540C9">E2EE-READY ≠ E2EE</text>
  </g>

  <!-- Data and events -->
  <text x="86" y="944" class="section" fill="#6540C9">DATA &amp; ASYNC EFFECTS</text>
  <g filter="url(#soft)">
    <rect x="86" y="964" width="318" height="82" rx="22" fill="#FFFFFF" stroke="#DFD6E9"/>
    <rect x="430" y="964" width="332" height="82" rx="22" fill="#FFFFFF" stroke="#DFD6E9"/>
    <rect x="788" y="964" width="300" height="82" rx="22" fill="#FFFFFF" stroke="#DFD6E9"/>
    <rect x="1114" y="964" width="398" height="82" rx="22" fill="#FFFFFF" stroke="#DFD6E9"/>
  </g>
  <g transform="translate(112 983)">
    <ellipse cx="28" cy="10" rx="24" ry="9" fill="#7C4DFF"/>
    <rect x="4" y="10" width="48" height="34" fill="#7C4DFF"/>
    <ellipse cx="28" cy="44" rx="24" ry="9" fill="#6540C9"/>
    <text x="74" y="22" class="cardTitle">Postgres</text>
    <text x="74" y="47" class="cardText">Tenant-scoped truth</text>
  </g>
  <g transform="translate(456 983)">
    <rect x="0" y="0" width="54" height="48" rx="14" fill="#FFF2D5"/>
    <path d="M12 16 H42 M12 25 H42 M12 34 H32" stroke="#B87800" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="22" class="cardTitle">Transactional Outbox</text>
    <text x="75" y="47" class="cardText">minimal Domain Events</text>
  </g>
  <g transform="translate(814 983)">
    <circle cx="27" cy="24" r="24" fill="#E7F2FF"/>
    <path d="M17 24 H37 M30 17 l7 7 l-7 7" fill="none" stroke="#1769AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="22" class="cardTitle">Worker</text>
    <text x="70" y="47" class="cardText">Retry · dedupe</text>
  </g>
  <g transform="translate(1140 983)">
    <rect x="0" y="0" width="54" height="48" rx="14" fill="#FFE7EE"/>
    <path d="M14 32 H40 L36 27 V20 C36 11 18 11 18 20 V27Z" fill="#A61F51"/>
    <circle cx="27" cy="38" r="4" fill="#A61F51"/>
    <text x="75" y="22" class="cardTitle">Notification</text>
    <text x="75" y="47" class="cardText">Privacy-safe Preview · optional Push</text>
  </g>
  <path d="M404 1005 H418" class="linePurple" marker-end="url(#arrowPurple)"/>
  <path d="M762 1005 H776" class="lineBlue" marker-end="url(#arrowBlue)"/>
  <path d="M1088 1005 H1102" class="lineBlue" marker-end="url(#arrowBlue)"/>

  <!-- small data links -->
  <path d="M675 833 V932 Q675 946 660 946 H250 V956" class="lineNeutral"/>
  <path d="M866 833 V932 Q866 946 881 946 H942 V956" class="lineNeutral"/>

  <!-- footer guardrails -->
  <g transform="translate(86 1063)">
    <circle cx="7" cy="7" r="7" fill="#7C4DFF"/>
    <text x="24" y="12" class="micro">NO REAL E2EE IN MVP</text>
    <circle cx="286" cy="7" r="7" fill="#1769AA"/>
    <text x="303" y="12" class="micro">OFFLINE READ YES · WRITE NO</text>
    <circle cx="612" cy="7" r="7" fill="#A61F51"/>
    <text x="629" y="12" class="micro">PRIVATE ENFORCED SERVER-SIDE</text>
    <text x="1280" y="12" class="micro">24.08.2026 · V1.0</text>
  </g>
</svg>