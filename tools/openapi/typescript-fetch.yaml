# TypeScript client for the React Web client.
#
# `typescript-fetch` generates code against the browser Fetch API and therefore
# adds *no* runtime dependency. That is why it is used here: a generator that
# requires axios would choose the Web client's HTTP library in this shared
# configuration instead of in the Web project.
supportsES6: true
withoutRuntimeChecks: false
# No package.json, tsconfig, or npmignore: this directory is a source layer in
# the Web project, not a separate package. Otherwise it would create a second
# dependency tree alongside the client.
withSeparateModelsAndApi: false
enumPropertyNaming: original
modelPropertyNaming: original
