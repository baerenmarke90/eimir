name: R1 Temporary Photo Hierarchy Fix

on:
  push:
    branches:
      - feat/964-r1-memory-capture
    paths:
      - .github/workflows/r1-temp-photo-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/964-r1-memory-capture
      - name: Apply secondary photo action
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/de/eimir/app/reference/ReferenceFlowScreen.kt')
          s = p.read_text()
          anchor = 'import androidx.compose.material3.OutlinedTextField\n'
          if 'import androidx.compose.material3.OutlinedButton\n' not in s:
              s = s.replace(anchor, 'import androidx.compose.material3.OutlinedButton\n' + anchor, 1)
          marker = 'private fun MemoryPhotoPicker'
          start = s.index(marker)
          end = s.index('\n}\n', start) + 3
          block = s[start:end]
          block = block.replace('    Button(\n', '    OutlinedButton(\n', 1)
          block = block.replace('        enabled = editable,\n', '        enabled = editable,\n        colors = ButtonDefaults.outlinedButtonColors(contentColor = EimirTheme.colors.linkText),\n', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/de/eimir/app/reference/ReferenceFlowScreen.kt
          git commit -m 'fix(android): keep R1 save as the dominant action'
          git push origin HEAD:feat/964-r1-memory-capture
